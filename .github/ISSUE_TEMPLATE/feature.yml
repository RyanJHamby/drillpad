name: Feature or new content request
description: A capability, problem, lesson, or learning track you would like to see
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: What are you trying to do, description: "The goal and what is hard about it today."}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: What would help}
  - type: textarea
    id: alternatives
    attributes: {label: Alternatives you considered}
