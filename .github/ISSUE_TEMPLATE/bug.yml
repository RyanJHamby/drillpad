name: Bug report
description: Something in the app, runner, or tooling does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened, description: "What you did, what you expected, what you saw."}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Steps to reproduce, description: "Commands or clicks, and the problem or lesson id if relevant."}
    validations: {required: true}
  - type: dropdown
    id: os
    attributes: {label: Operating system, options: [macOS, Linux, Windows (WSL), Other]}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: "Version (drillpad --version is not available yet: paste the commit or release tag)"}
  - type: textarea
    id: logs
    attributes: {label: Logs or output, render: shell}
