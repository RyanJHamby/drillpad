<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>DrillPad · Questions</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="/static/manifest.webmanifest"><link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="DrillPad"><meta name="theme-color" content="#0f172a">
<style>
:root{--bg:#f7f7f5;--surface:#fff;--fg:#1c1c1a;--mut:#6b6b66;--bd:#e4e3de;--acc:#3b5bdb;--acc-bg:#edf0fd;--ok:#198754;--ok-bg:#e7f5ee;--bad:#c92a2a;--warn:#b7791f;--code:#f1f0ec;--r:12px}
@media(prefers-color-scheme:dark){:root{--bg:#0e0f11;--surface:#16181b;--fg:#e8e8e6;--mut:#93938d;--bd:#26292d;--acc:#7c95ff;--acc-bg:#1b2140;--ok:#4cc38a;--ok-bg:#12281e;--bad:#ff7b7b;--warn:#e0b252;--code:#1d2024}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:3}
.logo{font-weight:700;font-size:16px}.logo span{color:var(--acc)}a{color:var(--acc)}
.btn{border:1px solid var(--bd);background:var(--surface);border-radius:8px;padding:6px 12px;text-decoration:none;color:var(--fg);cursor:pointer;font:inherit;white-space:nowrap}.btn:hover{background:var(--code)}
.wrap{max-width:1200px;margin:0 auto;padding:20px 24px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
input[type=search]{flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--bd);background:var(--surface);color:var(--fg);border-radius:8px;font:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--bd);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--fg)}.chip.on{background:var(--acc-bg);border-color:var(--acc);color:var(--acc)}
.lever{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.lh{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:14px 18px;cursor:pointer;align-items:center}.lh h2{margin:0;font-size:16px}.lh small{color:var(--mut)}
.bars{display:flex;gap:4px;height:8px;margin-top:8px;border-radius:99px;overflow:hidden;background:var(--code)}.bars i{display:block;height:100%}.b-pass{background:var(--ok)}.b-att{background:var(--warn)}.b-todo{background:var(--acc);opacity:.45}
.nums{text-align:right;font-size:13px;color:var(--mut)}.nums b{color:var(--fg)}
.body{border-top:1px solid var(--bd)}.grp{padding:10px 18px 2px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.row{display:grid;grid-template-columns:22px 1fr 56px 60px 70px 60px;gap:10px;padding:6px 18px;align-items:center;text-decoration:none;color:var(--fg);border-top:1px solid transparent}
a.row:hover{background:var(--code)}.row.missing{color:var(--mut);opacity:.65}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--bd)}.dot.passing{background:var(--ok);border-color:var(--ok)}.dot.attempted{background:var(--warn);border-color:var(--warn)}.dot.missing{border-style:dashed}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--code);color:var(--mut);text-align:center}.tag.lv{background:var(--acc-bg);color:var(--acc);font-weight:600}.sc{text-align:right;color:var(--mut)}
.hide{display:none}.note{color:var(--mut);font-size:12px;margin:0 0 16px}
</style></head><body>
<header><div class="logo">Drill<span>Pad</span></div><a class="btn" href="/">← Practice</a><a class="btn" href="/learn">Learn</a><a class="btn" href="/plan">Plan</a><a class="btn" href="/progress">Progress</a><b>Questions</b><span style="flex:1"></span><span id="sum" style="color:var(--mut)"></span></header>
<div class="wrap">
  <p class="note" id="note"></p>
  <div class="tools"><input type="search" id="q" placeholder="Search title or id…"><div class="chips" id="st"></div><div class="chips" id="lv"></div><div class="chips" id="lg"></div></div>
  <div id="levers"></div>
</div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null,st='all',lvl='all',lang='all',open=new Set(['leetcode']);
const ST=[['all','All'],['due','Due for review'],['todo','To do'],['attempted','In progress'],['passing','Passing'],['missing','Not yet authored']];
const LV=['all','1','2','3','4'];
const LG=[['all','Any language'],['python','Python'],['cpp','C++'],['rust','Rust']];
async function load(){D=await fetch('/api/questions').then(r=>r.json());$('note').textContent=D.note;render()}
function chips(){$('lg').innerHTML=LG.map(([k,l])=>`<button class="chip ${lang===k?'on':''}" data-lg="${k}">${l}</button>`).join('');$('st').innerHTML=ST.map(([k,l])=>`<button class="chip ${st===k?'on':''}" data-st="${k}">${l}</button>`).join('');$('lv').innerHTML=LV.map(k=>`<button class="chip ${lvl===k?'on':''}" data-lv="${k}">${k==='all'?'Any level':'L'+k}</button>`).join('')}
function ok(i){const q=$('q').value.trim().toLowerCase();return (st==='all'||(st==='due'?i.due:i.status===st))&&(lvl==='all'||String(i.level)===lvl)&&(lang==='all'||(i.language||'python')===lang)&&(!q||(i.title+' '+i.id).toLowerCase().includes(q))}
function row(i){const sc=i.score==null?'':Math.round(i.score);const inner=`<span class="dot ${i.status}"></span><span>${esc(i.title)}${i.status==='missing'?' <small>· not yet authored</small>':''}${i.due?` <span class="tag" style="color:var(--bad)">due · ${Math.round(i.recall*100)}%</span>`:(i.recall!=null?` <small>· recall ${Math.round(i.recall*100)}%</small>`:'')}</span>${i.language&&i.language!=='python'?`<span class="tag lv" style="background:var(--ok-bg);color:var(--ok)">${i.language==='cpp'?'C++':'Rust'}</span>`:'<span></span>'}<span class="tag lv">L${i.level}</span><span class="tag">${i.minutes?i.minutes+' min':'–'}</span><span class="sc">${sc}</span>`;return i.status==='missing'?`<div class="row missing">${inner}</div>`:`<a class="row" href="/?p=${encodeURIComponent(i.id)}">${inner}</a>`}
function render(){
  chips();let tot=0,auth=0,pass=0;
  $('levers').innerHTML=D.levers.map(l=>{
    tot+=l.total;auth+=l.authored;pass+=l.passing;
    const pp=l.passing/l.total*100,aa=(l.attempted-l.passing)/l.total*100,tt=(l.authored-l.attempted)/l.total*100;
    const groups=l.groups.map(g=>{const it=g.items.filter(ok);return it.length?`<div class="grp">${esc(g.id)} · ${it.length}</div>`+it.map(row).join(''):''}).join('');
    return `<div class="lever"><div class="lh" data-l="${l.id}"><div><h2>${esc(l.label)}</h2><small>${esc(l.basis)}</small><div class="bars"><i class="b-pass" style="width:${pp}%"></i><i class="b-att" style="width:${aa}%"></i><i class="b-todo" style="width:${tt}%"></i></div></div>
      <div class="nums"><b>${l.authored}</b>/${l.total} authored<br><b>${l.passing}</b> passing · ${l.attempted-l.passing} in progress</div></div>
      <div class="body ${open.has(l.id)||$('q').value||st!=='all'?'':'hide'}">${groups||'<div class="grp">No matches</div>'}</div></div>`}).join('')+
   (D.extras.length?`<div class="lever"><div class="lh" data-l="_x"><div><h2>Other practice problems</h2><small>not in a canonical list</small></div><div class="nums"><b>${D.extras.length}</b></div></div><div class="body ${open.has('_x')?'':'hide'}">${D.extras.filter(ok).map(row).join('')}</div></div>`:'');
  $('sum').textContent=`${auth}/${tot} canonical authored · ${pass} passing · ${D.total_problems} problems total`;
}
document.addEventListener('click',e=>{const c=e.target.closest('[data-st],[data-lv],[data-l],[data-lg]');if(!c)return;
  if(c.dataset.lg){lang=c.dataset.lg}else if(c.dataset.st){st=c.dataset.st}else if(c.dataset.lv){lvl=c.dataset.lv}else{const k=c.dataset.l;open.has(k)?open.delete(k):open.add(k)}render()});
$('q').oninput=render;
load();
</script></body></html>
