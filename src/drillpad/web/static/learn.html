<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>DrillPad · Learn</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f7f7f5;--surface:#fff;--fg:#1c1c1a;--mut:#6b6b66;--bd:#e4e3de;--acc:#3b5bdb;--acc-bg:#edf0fd;--ok:#198754;--ok-bg:#e7f5ee;--bad:#c92a2a;--warn:#b7791f;--code:#f1f0ec;--r:12px}
@media(prefers-color-scheme:dark){:root{--bg:#0e0f11;--surface:#16181b;--fg:#e8e8e6;--mut:#93938d;--bd:#26292d;--acc:#7c95ff;--acc-bg:#1b2140;--ok:#4cc38a;--ok-bg:#12281e;--bad:#ff7b7b;--warn:#e0b252;--code:#1d2024}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:3}
.logo{font-weight:700;font-size:16px}.logo span{color:var(--acc)}a{color:var(--acc)}
.btn{border:1px solid var(--bd);background:var(--surface);border-radius:8px;padding:6px 12px;text-decoration:none;color:var(--fg);cursor:pointer;font:inherit;white-space:nowrap}.btn:hover{background:var(--code)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:0;min-height:calc(100vh - 57px)}
nav{background:var(--surface);border-right:1px solid var(--bd);padding:12px 0;overflow:auto;max-height:calc(100vh - 57px);position:sticky;top:57px}
.mod{padding:10px 18px 4px}.mod h3{margin:0;font-size:14px}.mod small{color:var(--mut)}
.pbar{height:6px;border-radius:99px;background:var(--code);overflow:hidden;margin:6px 0 4px}.pbar i{display:block;height:100%;background:var(--ok)}
.les{display:flex;gap:8px;align-items:flex-start;padding:5px 18px 5px 24px;cursor:pointer;border-left:3px solid transparent;font-size:13px}.les:hover{background:var(--bg)}.les.sel{background:var(--acc-bg);border-left-color:var(--acc)}
.les .ck{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--bd);flex:none;margin-top:4px}.les.done .ck{background:var(--ok);border-color:var(--ok)}.les.draft{opacity:.5}
main{padding:28px 40px;max-width:900px}
.md h1{font-size:24px;margin:0 0 .6em;line-height:1.25}.md h2{font-size:17px;margin:1.6em 0 .4em}.md h3{font-size:15px}
.md p,.md li{margin:.5em 0}.md code{background:var(--code);padding:1px 5px;border-radius:5px;font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace}
.md pre{background:var(--code);padding:12px 14px;border-radius:var(--r);overflow:auto;border:1px solid var(--bd);line-height:1.45}.md pre code{background:none;padding:0}
.md table{border-collapse:collapse;margin:.8em 0}.md td,.md th{border:1px solid var(--bd);padding:5px 10px;text-align:left}
.md blockquote{margin:.6em 0;padding:.1em 1em;border-left:3px solid var(--bd);color:var(--mut)}
details{border:1px solid var(--bd);border-radius:8px;padding:8px 12px;margin:8px 0;background:var(--surface)}summary{cursor:pointer;font-weight:500}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--code);color:var(--mut);margin-right:4px}.tag.lang{background:var(--acc-bg);color:var(--acc);font-weight:600}
.prac{display:grid;grid-template-columns:18px 1fr auto auto;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;background:var(--surface);text-decoration:none;color:var(--fg)}
.prac:hover{background:var(--code)}.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--bd)}.dot.passing{background:var(--ok);border-color:var(--ok)}.dot.attempted{background:var(--warn);border-color:var(--warn)}.dot.missing{border-style:dashed}
.nav2{display:flex;justify-content:space-between;margin-top:28px}
.empty{color:var(--mut);padding:60px 0;text-align:center}
.mermaid{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:12px;margin:1em 0;display:flex;justify-content:center}
.wbm{margin-left:auto;flex:none;width:10px;height:10px;border-radius:2px;border:1.5px solid var(--bd);margin-top:5px}.wbm.ok{background:var(--acc);border-color:var(--acc)}.wbm.due{background:var(--warn);border-color:var(--warn)}
.wbbar{padding:0 18px 8px}.wbbar .btn{width:100%;text-align:left;font-size:13px}
.wbp{border:1px solid var(--bd);border-radius:var(--r);background:var(--surface);padding:14px 16px;margin-top:22px}.wbp h2{margin:0 0 4px!important}
.wbs{color:var(--mut);margin:2px 0 10px}.wbs b{color:var(--fg)}.wbs .dueb{color:var(--warn);font-weight:600}
.wbrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.wbrow input{font:inherit;border:1px solid var(--bd);border-radius:8px;padding:6px 10px;background:var(--bg);color:var(--fg)}.wbrow input[type=text]{flex:1;min-width:200px}
.wbsc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.wbsc button{display:flex;flex-direction:column;align-items:center;padding:8px 4px;line-height:1.25}.wbsc b{font-size:16px}.wbsc small{color:var(--mut);font-size:11px;text-align:center}
.wbh{list-style:none;margin:12px 0 0;padding:0}.wbh li{display:flex;gap:10px;align-items:baseline;padding:4px 0;border-top:1px solid var(--bd);font-size:13px}.wbh .sc{font-weight:700;width:2.2em}.wbh .nt{flex:1;color:var(--mut)}.wbh button{border:0;background:none;color:var(--mut);cursor:pointer;font:inherit}.wbh button:hover{color:var(--bad)}
.wbq-item{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;background:var(--surface);cursor:pointer}.wbq-item:hover{background:var(--code)}
@media(max-width:900px){.layout{grid-template-columns:1fr}nav{position:static;max-height:none}main{padding:20px}}
</style></head><body>
<header><a href="/home" style="text-decoration: none; display: flex; align-items: center; gap: 10px; color: inherit;">
  <div class="logo">Drill<span>Pad</span></div>
</a><span style="color: var(--mut); font-size: 12px;">Learn</span></header>
<div class="layout"><nav id="nav"></nav><main><div id="lesson" class="empty">Pick a lesson to begin.</div></main></div>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" media="(prefers-color-scheme: dark)">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LANG={python:'Python',cpp:'C++',rust:'Rust','?':'?'};
let MODS=[],cur=null,WB={lessons:{},due:[],summary:{whiteboarded:0,due_now:0,total_lessons:0}};
const flat=()=>MODS.flatMap(m=>m.lessons.map(l=>({m,l})));
const WBL={1:'blank',2:'shaky',3:'got there, gaps',4:'solid',5:'flawless, cold'};
const ago=iso=>{const d=Math.floor((Date.now()-new Date(iso))/864e5);return d<=0?'today':d===1?'yesterday':d+' days ago'};
const when=iso=>{const d=new Date(iso),n=(d-Date.now())/864e5;return n<=0?'now':n<1?'today':new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'})};
async function loadWb(){try{WB=await fetch('/api/whiteboard').then(r=>r.json())}catch{}}
async function load(sel){
  [MODS]=await Promise.all([fetch('/api/modules').then(r=>r.json()),loadWb()]);renderNav();
  const q=new URLSearchParams(location.search),want=sel||(q.get('m')&&q.get('l')?{m:q.get('m'),l:q.get('l')}:null)||(()=>{const f=flat().find(x=>!x.l.done&&x.l.written)||flat()[0];return f?{m:f.m.id,l:f.l.id}:null})();
  if(want)open_(want.m,want.l);
}
function wbMark(m,l){const s=WB.lessons[m+'/'+l];return `<span class="wbm ${s?(s.due_now?'due':'ok'):''}" title="${s?`Whiteboarded ${s.sessions}x · last ${s.last_score}/5 · next ${s.due_now?'due now':when(s.due)}`:'Never whiteboarded'}"></span>`}
function showQueue(){
  cur=null;history.replaceState(null,'','?');renderNav();
  const rows=WB.due.map(d=>`<div class="wbq-item" data-m="${d.module}" data-l="${d.lesson}"><span>${esc(d.title)} <small style="color:var(--mut)">· ${esc(d.module_title)}</small></span><span class="tag">last ${d.last_score}/5 · ${ago(d.last_at)}</span><span class="tag lang">due</span></div>`).join('');
  $('lesson').className='md';
  $('lesson').innerHTML=`<h1>Whiteboard queue</h1><p>${WB.summary.due_now} due now · ${WB.summary.whiteboarded} of ${WB.summary.total_lessons} lessons practiced`+(WB.summary.mean_last_score!=null?` · mean latest score ${WB.summary.mean_last_score}/5`:'')+`</p>`+
   (rows||`<div class="empty">Nothing due. Open a lesson and log a whiteboard session to start the schedule.</div>`)+
   `<p style="color:var(--mut);margin-top:18px">Scores: 1 blank · 2 shaky · 3 got there with gaps · 4 solid · 5 flawless, cold. Scores of 3 or lower come back within about a day; repeated 4s and 5s stretch out toward 45 days.</p>`;
}
async function renderWb(mid,lid){
  const el=$('wbpanel');if(!el)return;
  const d=await fetch(`/api/whiteboard/${mid}/${lid}`).then(r=>r.json()),s=d.state,today=new Date().toISOString().slice(0,10);
  const status=s?`Practiced <b>${s.sessions}x</b> · last <b>${s.last_score}/5</b> ${ago(s.last_at)} · next review <span class="${s.due_now?'dueb':''}">${s.due_now?'due now':when(s.due)}</span>`:'Not whiteboarded yet. Close the lesson, draw it from memory, then score yourself.';
  el.innerHTML=`<h2>Whiteboard</h2><div class="wbs">${status}</div>
   <div class="wbrow"><input type="text" id="wbn" maxlength="500" placeholder="What tripped you up? (optional)"><input type="date" id="wbd" value="${today}" max="${today}" title="Date you whiteboarded"></div>
   <div class="wbsc">${[1,2,3,4,5].map(n=>`<button class="btn" data-score="${n}"><b>${n}</b><small>${WBL[n]}</small></button>`).join('')}</div>
   ${d.history.length?`<ul class="wbh">${d.history.map(h=>`<li><span class="sc">${h.score}/5</span><span>${ago(h.at)}</span><span class="nt">${esc(h.notes)}</span><button data-del="${h.id}" title="Delete this entry">✕</button></li>`).join('')}</ul>`:''}`;
  el.querySelectorAll('[data-score]').forEach(b=>b.onclick=async()=>{
    const day=$('wbd').value,body={score:+b.dataset.score,notes:$('wbn').value};
    if(day&&day!==today)body.at=day+'T12:00:00';
    const r=await fetch(`/api/whiteboard/${mid}/${lid}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.ok){await loadWb();renderNav();renderWb(mid,lid)}else alert('Could not save: '+await r.text());
  });
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await fetch(`/api/whiteboard/sessions/${b.dataset.del}`,{method:'DELETE'});await loadWb();renderNav();renderWb(mid,lid)});
}
function renderNav(){
  // Group modules by stage
  const byStage={};
  const stageOrder=[];
  MODS.forEach(m=>{
    const stageId=m.stage_id||'_unsorted';
    const stageTitle=m.stage_title||'Unsorted';
    if(!byStage[stageId]){
      byStage[stageId]={title:stageTitle,modules:[]};
      stageOrder.push(stageId);
    }
    byStage[stageId].modules.push(m);
  });

  const wbs=WB.summary,bar=`<div class="wbbar"><button class="btn" id="wbq">Whiteboard queue · <b>${wbs.due_now}</b> due · ${wbs.whiteboarded}/${wbs.total_lessons} practiced</button></div>`;
  // Render stages with modules
  $('nav').innerHTML=bar+stageOrder.map(stageId=>{
    const stage=byStage[stageId];
    const stageHtml=stageId==='_unsorted'?``:`<div style="padding:12px 18px 4px;margin-top:8px;border-top:1px solid var(--bd);font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:0.5px">${esc(stage.title)}</div>`;
    const modsHtml=stage.modules.map(m=>`<div class="mod"><h3>${esc(m.title)}</h3><small>${m.done}/${m.lessons.length} lessons · ${m.practice_passing} practice passing</small><div class="pbar"><i style="width:${m.done/m.lessons.length*100}%"></i></div></div>`+
     m.lessons.map((l,i)=>`<div class="les ${l.done?'done':''} ${l.written?'':'draft'} ${cur&&cur.m===m.id&&cur.l===l.id?'sel':''}" data-m="${m.id}" data-l="${l.id}"><span class="ck"></span><span>${i+1}. ${esc(l.title)}${l.written?'':' <small>(coming)</small>'}</span>${wbMark(m.id,l.id)}</div>`).join('')).join('');
    return stageHtml+modsHtml;
  }).join('');
}
async function open_(mid,lid){
  cur={m:mid,l:lid};history.replaceState(null,'',`?m=${mid}&l=${lid}`);renderNav();
  const mod=MODS.find(m=>m.id===mid),idx=mod.lessons.findIndex(l=>l.id===lid),les=mod.lessons[idx];
  const r=await fetch(`/api/modules/${mid}/${lid}`).then(x=>x.json());
  let html=marked.parse(r.markdown,{gfm:true});
  // Convert mermaid code blocks to mermaid divs before sanitizing
  html=html.replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g,'<div class="mermaid">$1</div>');
  html=DOMPurify.sanitize(html,{ADD_TAGS:['div'],ADD_ATTR:['class']});
  const pr=les.practice.length?`<h2>Practice</h2>`+les.practice.map(p=>p.status==='missing'?`<div class="prac"><span class="dot missing"></span><span>${esc(p.id)} <small>not yet authored</small></span><span></span><span></span></div>`:`<a class="prac" href="/?p=${encodeURIComponent(p.id)}"><span class="dot ${p.status}"></span><span>${esc(p.title)}</span><span class="tag lang">${esc(LANG[p.language]||p.language)}</span><span class="tag">L${p.level}</span></a>`).join(''):'';
  const prev=idx>0?mod.lessons[idx-1]:null,next=idx<mod.lessons.length-1?mod.lessons[idx+1]:null;
  $('lesson').className='md';
  $('lesson').innerHTML=`<div style="margin-bottom:8px"><span class="tag lang">${esc(LANG[mod.language]||mod.language)}</span><span class="tag">${esc(mod.title)} · lesson ${idx+1}/${mod.lessons.length}</span></div>${html}${pr}
   <div style="margin-top:22px"><button class="btn ${les.done?'':'pri'}" id="done">${les.done?'✓ Done (click to undo)':'Mark lesson done'}</button></div>
   <div class="wbp" id="wbpanel"></div>
   <div class="nav2">${prev?`<a class="btn" href="#" data-m="${mod.id}" data-l="${prev.id}">← ${esc(prev.title)}</a>`:'<span></span>'}${next?`<a class="btn" href="#" data-m="${mod.id}" data-l="${next.id}">${esc(next.title)} →</a>`:''}</div>`;
  document.querySelectorAll('#lesson pre code').forEach(c=>{try{hljs.highlightElement(c)}catch{}});
  mermaid.contentLoaded();
  renderWb(mid,lid);
  $('done').onclick=async()=>{await fetch(`/api/modules/${mid}/${lid}/done?done=${!les.done}`,{method:'POST'});await load({m:mid,l:lid})};
  scrollTo(0,0);
}
document.addEventListener('click',e=>{if(e.target.closest('#wbq')){showQueue();return}const t=e.target.closest('[data-m][data-l]');if(t){e.preventDefault();open_(t.dataset.m,t.dataset.l)}});
load();
</script></body></html>
