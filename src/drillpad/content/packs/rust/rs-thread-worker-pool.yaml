statement: |2

  Build a fixed-size thread pool from `std::thread` and `std::sync::mpsc` only.

  ```rust
  use std::sync::mpsc;

  type Job = Box<dyn FnOnce() + Send + 'static>;

  struct ThreadPool { /* workers, sender */ }

  impl ThreadPool {
      fn new(size: usize) -> ThreadPool;                   // size >= 1: spawn that many worker threads
      fn size(&self) -> usize;
      fn execute<F>(&self, f: F) where F: FnOnce() + Send + 'static;
      fn submit<T, F>(&self, f: F) -> mpsc::Receiver<T>    // run f on the pool; the receiver yields its result
          where F: FnOnce() -> T + Send + 'static, T: Send + 'static;
  }
  // Drop for ThreadPool: stop accepting work, let workers finish every queued job, then join all workers.
  ```

  Requirements:

  - Jobs go through ONE `mpsc` channel; workers share its `Receiver` as `Arc<Mutex<mpsc::Receiver<Job>>>`.
  - Jobs run in parallel across workers (two jobs that wait for each other on a `Barrier(2)` must complete with `size >= 2`).
  - A job that **panics must not kill its worker** (use `std::panic::catch_unwind`); later jobs still run.
  - `submit`'s receiver must yield `Err` on `recv()` if the job panicked (the sender is dropped without sending).
  - Dropping the pool runs all already-queued jobs to completion and joins every worker. Hold the receiver lock only
    while waiting for a job, never while running it, or the pool is effectively single-threaded.
  - With `size == 1`, jobs run in submission order (FIFO).

  Example: submit 100 increments of an `AtomicUsize`, drop the pool, and the counter reads 100.
