title: 'Lifetimes: Longest Common Prefix and Splitters'
target_minutes: 25
patterns:
- lifetimes
- string-slices
- struct-with-borrow
- iterator-over-slices
- char-boundaries
firm_tags: []
categories:
- leetcode
statement: |2

  Practice returning borrowed slices with explicit lifetimes.

  ```rust
  fn longest_common_prefix<'a>(words: &[&'a str]) -> &'a str;
  fn split_at_delim<'a>(s: &'a str, delim: char) -> (&'a str, &'a str);

  struct Tokenizer<'a> { /* borrows the source text */ }
  impl<'a> Tokenizer<'a> { fn new(src: &'a str) -> Tokenizer<'a>; }
  impl<'a> Iterator for Tokenizer<'a> { type Item = &'a str; /* ... */ }
  ```

  - `longest_common_prefix`: a slice of the first word (so it borrows from the *words' text*, `'a`, not from the outer
    slice), `""` for an empty list or no shared prefix. Compare by `char`, and never cut inside a UTF-8 character.
  - `split_at_delim`: split at the FIRST occurrence of `delim`; returns `(before, after)` with the delimiter dropped. If the
    delimiter is absent, returns `(s, "")`.
  - `Tokenizer`: yields tokens as `&'a str` slices of the source with no allocation. Whitespace separates tokens and is
    skipped. These single characters are always their own token: `( ) , ; + - * / =`. Everything else forms maximal runs
    of non-whitespace, non-punctuation characters. So `"f(x1, y) = 2*x1"` gives
    `f ( x1 , y ) = 2 * x1`.

  Important: the tokens must be tied to the *source text* (`'a`), not to the `Tokenizer` value, so you can collect them
  and drop the tokenizer while still using them.
