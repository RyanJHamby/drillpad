extensions:
- q: Why does the compiler's default drop of a long Box chain overflow the stack, and how does your Drop avoid it?
  kind: reasoning
  key_points:
  - 'Dropping a Node drops its `next: Option<Box<Node>>`, which drops the next node, and so on: recursion depth equals list length'
  - Each frame is small but a million of them exceed the 8MB main-thread stack
  - The loop takes each node's `next` out first (leaving None) so the node being dropped has nothing left to recurse into
- q: How do the time and space costs compare with Vec for these operations, and what does reverse cost?
  kind: complexity
  key_points:
  - push_front/pop_front are O(1) here but O(n) on a Vec (shifting); push/pop at the back of a Vec is O(1) amortized
  - 'reverse is O(n) time and O(1) extra space: it only rewires pointers with take()'
  - 'Each node is a separate heap allocation: worse cache locality and per-node overhead versus a contiguous Vec'
- q: How would this change to support a doubly linked list or sharing across owners?
  kind: design
  key_points:
  - 'Safe doubly linked lists need shared ownership: Rc<RefCell<Node>> with Weak back pointers (runtime borrow checking) or an arena with usize indices'
  - 'Box means single ownership, so each node has exactly one parent: that is what makes the safe version simple and fast'
  - Across threads you would need Arc<Mutex<..>> and the node type must be Send
state_aloud:
- 'Empty list: pop_front and peek return None; reverse on empty or one element is a no-op.'
- 'Moving out of self.head through &mut self requires take() or mem::replace: say that unprompted.'
- Iterator items borrow from the list ('a), not from the iterator's own &mut self.
- Iterative Drop is needed or a long list overflows the stack.
walkthrough: |2

  Each node owns the rest of the list through `Option<Box<Node<T>>>`, so you can never move out of `self.head` through `&mut self` directly; `take()` swaps in `None` and hands you ownership, which is the core idiom behind push, pop, reverse and drop. Peeks use `as_ref`/`as_mut`, and `Iter` stores an `Option<&'a Node<T>>` advanced with `as_deref()` so yielded items carry the list's lifetime. A Python linked list just reassigns references under a garbage collector; here ownership makes the borrow checker prove there are no aliases, and an explicit loop in `Drop` keeps freeing a million nodes from recursing.
