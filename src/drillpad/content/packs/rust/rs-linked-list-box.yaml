hints:
- You cannot move out of `self.head` through `&mut self`. `Option::take()` swaps in `None` and gives you ownership of the old value; `mem::replace` is the general form of the same trick.
- '`push_front`: `let new = Box::new(Node { elem, next: self.head.take() }); self.head = Some(new);`. For peeks use `self.head.as_ref().map(|n| &n.elem)` and `as_mut()` for the mutable version. For `Iter::next`, `self.next.map(|n| { self.next = n.next.as_deref(); &n.elem })` is the idiom.'
- 'reverse: keep `prev: Option<Box<Node>>` and `cur = self.head.take()`; in a loop take `cur`''s `next`, point it at `prev`, then advance. Drop: `let mut cur = self.head.take(); while let Some(mut node) = cur { cur = node.next.take(); }` so each node is freed with an empty `next`.'
follow_ups:
- Why does the default Drop for Option<Box<Node>> overflow the stack, and how does the loop avoid it?
- What changes if you want a doubly linked list? Why is that much harder in safe Rust?
- How would you add into_iter (owned) and iter_mut (mutable) iterators?
- Why is as_deref() needed in Iter::next? What does it convert?
tests:
- name: push pop peek
  tags:
  - single
  - ordering
  code: |
    let mut l: List<i32> = List::new();
    assert!(l.is_empty());
    assert_eq!(l.pop_front(), None);
    l.push_front(1);
    l.push_front(2);
    l.push_front(3);
    assert_eq!(l.len(), 3);
    assert_eq!(l.peek_front(), Some(&3));
    assert_eq!(l.pop_front(), Some(3));
    assert_eq!(l.pop_front(), Some(2));
    assert_eq!(l.len(), 1);
    assert_eq!(l.pop_front(), Some(1));
    assert_eq!(l.pop_front(), None);
    assert!(l.is_empty() && l.len() == 0);
  hidden: false
- name: peek_front_mut
  tags:
  - single
  - state-reuse
  code: |
    let mut l = List::new();
    assert!(l.peek_front_mut().is_none());
    l.push_front(String::from("a"));
    l.push_front(String::from("b"));
    l.peek_front_mut().unwrap().push('!');
    assert_eq!(l.peek_front().unwrap(), "b!");
    assert_eq!(l.pop_front().unwrap(), "b!");
    assert_eq!(l.peek_front().unwrap(), "a");
  hidden: false
- name: iter yields front to back
  tags:
  - ordering
  - empty
  code: |
    let mut l = List::new();
    assert_eq!(l.iter().count(), 0);
    for i in 1..=4 { l.push_front(i * 10); }
    let v: Vec<&i32> = l.iter().collect(); // items must outlive each next() call
    assert_eq!(v, vec![&40, &30, &20, &10]);
    assert_eq!(l.iter().map(|x| *x).sum::<i32>(), 100);
    assert_eq!(l.len(), 4); // iteration does not consume
    let mut it = l.iter();
    assert_eq!(it.next(), Some(&40));
    assert_eq!(it.next(), Some(&30));
  hidden: false
- name: reverse
  tags:
  - ordering
  - boundary
  code: |
    let mut l = List::new();
    l.reverse(); // empty is fine
    assert!(l.is_empty());
    l.push_front(1);
    l.reverse();
    assert_eq!(l.iter().collect::<Vec<_>>(), vec![&1]);
    for i in 2..=5 { l.push_front(i); }
    assert_eq!(l.iter().copied().collect::<Vec<_>>(), vec![5, 4, 3, 2, 1]);
    l.reverse();
    assert_eq!(l.iter().copied().collect::<Vec<_>>(), vec![1, 2, 3, 4, 5]);
    assert_eq!(l.len(), 5);
    assert_eq!(l.pop_front(), Some(1));
    l.reverse();
    assert_eq!(l.iter().copied().collect::<Vec<_>>(), vec![5, 4, 3, 2]);
  hidden: false
- name: non-Clone elements are moved not copied
  tags:
  - duplicate
  - state-reuse
  hidden: true
  code: |
    use std::rc::Rc;
    let token = Rc::new(());
    let mut l = List::new();
    for _ in 0..3 { l.push_front(Rc::clone(&token)); }
    assert_eq!(Rc::strong_count(&token), 4);
    l.reverse();
    assert_eq!(Rc::strong_count(&token), 4); // reverse must not clone
    let x = l.pop_front().unwrap();
    assert_eq!(Rc::strong_count(&token), 4);
    drop(x);
    assert_eq!(Rc::strong_count(&token), 3);
    drop(l);
    assert_eq!(Rc::strong_count(&token), 1, "dropping the list must drop every node");
- name: items outlive the iterator
  tags:
  - boundary
  - single
  hidden: true
  code: |
    let mut l = List::new();
    l.push_front("c".to_string());
    l.push_front("b".to_string());
    l.push_front("a".to_string());
    let firsts: Vec<&String>;
    {
        let it = l.iter();
        firsts = it.take(2).collect();
    }
    assert_eq!(firsts[0], "a");
    assert_eq!(firsts[1], "b");
- name: million node list drops without stack overflow
  tags:
  - scale
  hidden: true
  code: |
    let mut l = List::new();
    for i in 0..1_000_000u32 { l.push_front(i); }
    assert_eq!(l.len(), 1_000_000);
    assert_eq!(l.peek_front(), Some(&999_999));
    l.reverse();
    assert_eq!(l.peek_front(), Some(&0));
    drop(l); // recursive Drop would crash here
