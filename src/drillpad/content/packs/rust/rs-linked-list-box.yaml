statement: |2

  Implement a singly linked stack-like list using `Option<Box<Node<T>>>` (no `Rc`, no `unsafe`).

  ```rust
  struct List<T> { /* head link and a length */ }

  impl<T> List<T> {
      fn new() -> Self;
      fn push_front(&mut self, value: T);
      fn pop_front(&mut self) -> Option<T>;
      fn peek_front(&self) -> Option<&T>;
      fn peek_front_mut(&mut self) -> Option<&mut T>;
      fn reverse(&mut self);                    // in place: relink nodes, no new allocations, no cloning
      fn len(&self) -> usize;
      fn is_empty(&self) -> bool;
      fn iter(&self) -> Iter<'_, T>;            // yields &T from front to back
  }

  struct Iter<'a, T> { /* ... */ }
  impl<'a, T> Iterator for Iter<'a, T> { type Item = &'a T; /* ... */ }
  ```

  `Iter<'a, T>` must yield `&'a T`, not a reference tied to the `&mut self` of `next`, so that items can be
  collected. Elements need no `Clone`.

  Finally, implement `Drop for List<T>` **iteratively**. The compiler's default recursive drop of a long
  `Box` chain overflows the stack; your drop must be able to free a list of one million nodes.

  Example: pushing 1, 2, 3 gives front-to-back `[3, 2, 1]`; after `reverse()` it is `[1, 2, 3]`.
