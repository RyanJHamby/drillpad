title: Graph BFS and Shortest Path (indices)
target_minutes: 25
patterns:
- bfs
- adjacency-list
- parent-pointers
- vecdeque
- option-vec
firm_tags: []
categories:
- leetcode
statement: |2

  A graph with `n` nodes numbered `0..n` is given as an adjacency list `adj: &[Vec<usize>]`, where `adj[u]` lists the
  nodes reachable from `u` by one directed edge (an undirected graph lists each edge in both directions). Edges are
  unweighted. Implement:

  ```rust
  fn bfs_distances(adj: &[Vec<usize>], start: usize) -> Vec<Option<usize>>;
  fn shortest_path(adj: &[Vec<usize>], from: usize, to: usize) -> Option<Vec<usize>>;
  fn bfs_order(adj: &[Vec<usize>], start: usize) -> Vec<usize>;
  ```

  - `bfs_distances` returns a vector of length `adj.len()`: entry `v` is `Some(edges on a shortest path)` or `None` if `v`
    is unreachable. If `start` is out of range, every entry is `None`.
  - `shortest_path` returns the node list `from ..= to` inclusive, or `None` if there is no path or either endpoint is out
    of range. `shortest_path(g, a, a)` is `Some(vec![a])`.
  - `bfs_order` returns the nodes in the order BFS visits them (reachable only; empty if `start` is out of range).

  Determinism: explore each node's neighbors in the order they appear in `adj[u]`, and keep the **first** parent that
  discovers a node. Under that rule the BFS order and the reconstructed path are unique. Duplicate edges and self-loops
  may appear and must not break anything.

  Example: `adj = [[1, 2], [3], [3], []]`: distances are `[Some(0), Some(1), Some(1), Some(2)]` and the path 0 to 3 is `[0, 1, 3]`.
