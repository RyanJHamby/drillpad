statement: |2

  Implement a fixed-capacity least-recently-used cache with O(1) `get` and `put` **in safe Rust**. A doubly linked list
  of owned nodes needs `Rc<RefCell<..>>` or `unsafe`; instead keep the nodes in a `Vec` (a slab) and link them with
  `usize` indices, with a `HashMap<K, usize>` from key to slot.

  ```rust
  use std::collections::HashMap;
  use std::hash::Hash;

  struct LruCache<K, V> { /* ... */ }

  impl<K: Hash + Eq + Clone, V> LruCache<K, V> {
      fn new(capacity: usize) -> Self;
      fn get(&mut self, key: &K) -> Option<&V>;          // a hit makes the key most recently used
      fn peek(&self, key: &K) -> Option<&V>;             // read without touching recency
      fn put(&mut self, key: K, value: V) -> Option<(K, V)>;
      fn contains(&self, key: &K) -> bool;               // no recency change
      fn len(&self) -> usize;
      fn keys_mru_first(&self) -> Vec<K>;                // keys from most to least recently used
  }
  ```

  `put` semantics: if the key exists, replace its value, mark it most recently used and return `None`. Otherwise insert it
  as most recently used; if that exceeds capacity, evict the least recently used entry and return it as `Some((key, value))`.
  With capacity 0 nothing is ever stored and `put` immediately hands the pair back as `Some((key, value))`.

  Example (capacity 2): `put(1,"a"); put(2,"b"); get(&1); put(3,"c")` evicts key 2 and returns `Some((2, "b"))`.
