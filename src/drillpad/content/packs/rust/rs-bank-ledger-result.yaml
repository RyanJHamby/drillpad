extensions:
- q: Why a typed error enum with Display and std::error::Error, and how do ? and Box<dyn Error> interact with it?
  kind: design
  key_points:
  - Callers can match exhaustively on variants (retry on InsufficientFunds, alert on Overflow) and the compiler flags new unhandled variants; strings force parsing
  - Implementing Display plus Error lets it convert into Box<dyn Error> via `?`, work with source() chains, and compose in libraries (thiserror derives exactly this boilerplate)
  - Deriving Clone and PartialEq is what makes idempotency replay (store and clone the Result) and exact test assertions possible
- q: What are the costs of this ledger, and what grows without bound?
  kind: complexity
  key_points:
  - All account operations are O(1) expected through a HashMap; history copies O(h) entries
  - 'The per-account entry log and the idempotency map grow forever: O(total transactions) memory'
  - Fix with a TTL or a bounded window for txn ids and snapshotting or compaction of old entries
- q: How would you make transfer safe for concurrent callers, and what does Rust's type system check for you?
  kind: design
  key_points:
  - Wrap in Arc<Mutex<Ledger>> for simplicity, or lock per account and ALWAYS acquire the two locks in a global order (for example sorted account id) to avoid deadlock
  - Ledger must be Send for Arc<Mutex<Ledger>> to be shared across threads; the compiler rejects sharing it with a bare Rc or RefCell
  - Atomicity of the debit+credit pair holds because both happen under one lock; the idempotency check-then-insert must be inside the same critical section or two retries can both execute
- q: What if the same txn_id arrives with different parameters?
  kind: reasoning
  key_points:
  - Store a fingerprint (src, dst, amount) with the result and return an error variant such as IdempotencyConflict on mismatch, as payment APIs do
  - Silently replaying the first result would hide client bugs; silently re-executing would double-spend
  - Decide per product whether the key is scoped per account or global
state_aloud:
- 'Money is u64 minor units with checked arithmetic: never floats, never wrapping, never panicking on overflow.'
- Validate everything before mutating so a failed transfer leaves no half-applied state and writes no ledger lines.
- 'Idempotency: look up txn_id first, and store failures as well as successes so a retry cannot succeed after a failure.'
- 'Double entry: both legs are written together, so the sum of deltas across all accounts equals total deposits.'
- Error enum derives Clone and PartialEq, and implements Display and std::error::Error.
walkthrough: |2

  Failures are a `LedgerError` enum with data (`InsufficientFunds { needed, available }`), implementing `Display` and `std::error::Error` so it works with `?` and `Box<dyn Error>`. `transfer` first checks the idempotency map for the `txn_id`, then calls a private `apply_transfer` that validates everything with `?` and only then mutates the two accounts one after the other (two `get_mut` borrows never overlap), and finally stores the `Result` (cloned) under the id, failures included. Python raises exceptions and returns status strings; here the compiler makes callers handle each case, `u64::checked_add` turns overflow into a value, and `Clone` on the error enum is what makes replaying a stored result trivial.
