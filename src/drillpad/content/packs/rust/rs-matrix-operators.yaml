statement: |2

  Build a small row-major `f64` matrix type that behaves like a numeric type. This error enum and a test helper are
  **already defined for you** (do not redefine them):

  ```rust
  #[derive(Debug, Clone, PartialEq)]
  enum MatrixError {
      DimensionMismatch { left: (usize, usize), right: (usize, usize) },   // (rows, cols) of each operand, in call order
      BadDataLength { expected: usize, got: usize },
  }

  fn mat(rows: usize, cols: usize, data: &[f64]) -> Matrix   // Matrix::new(..).unwrap(), handy in tests
  ```

  You write the type and everything below (derive `Debug, Clone, PartialEq` on `Matrix`):

  ```rust
  struct Matrix { rows: usize, cols: usize, data: Vec<f64> }   // row-major: element (r, c) is data[r * cols + c]

  impl Matrix {
      fn new(rows: usize, cols: usize, data: Vec<f64>) -> Result<Matrix, MatrixError>;  // BadDataLength unless data.len() == rows*cols
      fn zeros(rows: usize, cols: usize) -> Matrix;
      fn identity(n: usize) -> Matrix;
      fn shape(&self) -> (usize, usize);
      fn transpose(&self) -> Matrix;
      fn checked_add(&self, rhs: &Matrix) -> Result<Matrix, MatrixError>;   // same shape required
      fn checked_mul(&self, rhs: &Matrix) -> Result<Matrix, MatrixError>;   // self.cols == rhs.rows required: the matrix product
  }

  impl Add<&Matrix> for &Matrix { type Output = Matrix; }      // panics on a shape mismatch (use checked_add to avoid)
  impl Mul<&Matrix> for &Matrix { type Output = Matrix; }      // matrix product, panics on mismatch
  impl Mul<f64> for &Matrix { type Output = Matrix; }          // scalar multiply
  impl Index<(usize, usize)> for Matrix { type Output = f64; } // m[(row, col)]
  impl IndexMut<(usize, usize)> for Matrix { }                 // m[(row, col)] = x
  impl fmt::Display for Matrix { }                             // rows on separate lines, elements joined by one space, no trailing newline
  ```

  `Display` uses `{}` for each element, so `mat(2, 2, &[1.0, 2.0, 3.0, 4.5])` prints `"1 2\n3 4.5"`. A 0-row or 0-column
  matrix is legal (an empty matrix prints `""`). Example: `checked_mul` of a 2x3 and a 3x2 is 2x2, but a 2x3 times a
  2x3 is `Err(DimensionMismatch { left: (2, 3), right: (2, 3) })`.
