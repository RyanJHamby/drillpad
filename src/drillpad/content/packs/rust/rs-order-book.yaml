statement: |2

  Implement a single-symbol limit order book with price-time priority. Prices and quantities are `u64` and must be
  positive. These types are **already defined for you** (do not redefine them):

  ```rust
  #[derive(Debug, Clone, Copy, PartialEq, Eq)]
  enum Side { Buy, Sell }

  #[derive(Debug, Clone, Copy, PartialEq, Eq)]
  struct Fill { order_id: u64, price: u64, qty: u64 }   // order_id is the RESTING order that was hit

  #[derive(Debug, Clone, Copy, PartialEq, Eq)]
  enum BookError { ZeroPrice, ZeroQty }
  ```

  ```rust
  struct OrderBook { /* ... */ }

  impl OrderBook {
      fn new() -> Self;
      fn limit(&mut self, side: Side, price: u64, qty: u64) -> Result<(u64, Vec<Fill>), BookError>;
      fn market(&mut self, side: Side, qty: u64) -> Result<Vec<Fill>, BookError>;
      fn cancel(&mut self, order_id: u64) -> bool;
      fn best_bid(&self) -> Option<u64>;
      fn best_ask(&self) -> Option<u64>;
      fn depth(&self, side: Side) -> Vec<(u64, u64)>;    // (price, total resting qty), best price first
  }
  ```

  - `limit` returns `(order_id, fills)`. Ids are 1, 2, 3, ... in call order of **accepted** orders (a rejected call consumes
    no id). The order first matches against the opposite side while it crosses (buy price >= best ask, sell price <= best
    bid): best price first, FIFO within a price level. Every fill executes at the RESTING order's price. Any unfilled
    remainder rests in the book; an order that does not cross just rests.
  - `market` matches at any price and discards an unfilled remainder (it never rests and consumes no id).
  - `cancel` returns true only if the order is currently resting (not unknown, not already cancelled, not fully filled).
  - Validation: `price == 0` gives `Err(BookError::ZeroPrice)` and `qty == 0` gives `Err(BookError::ZeroQty)`; check price
    first. A rejected call changes nothing. `market` only checks quantity.
  - `depth` skips empty levels; bids are listed highest price first, asks lowest first.

  Example: resting sell 5 @ 101, then `limit(Buy, 102, 3)` fills `Fill { order_id: 1, price: 101, qty: 3 }` (not at 102).
