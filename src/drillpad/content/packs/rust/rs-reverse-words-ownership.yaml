title: Reverse Words (Ownership and Slices)
target_minutes: 15
patterns:
- string-slices
- ownership
- borrowing
- split-whitespace
firm_tags: []
categories:
- leetcode
statement: |2

  Implement four free functions. Words are separated by any amount of Unicode whitespace; leading,
  trailing and repeated whitespace is ignored.

  ```rust
  fn reverse_words(s: &str) -> String        // words in reverse order, joined by ONE space
  fn reverse_each_word(s: &str) -> String    // each word's characters reversed, words keep order, joined by one space
  fn first_word(s: &str) -> &str             // borrowed slice of the first word, "" if there is none
  fn longest_word(s: &str) -> &str           // borrowed slice of the longest word (by chars); the first one wins ties; "" if none
  ```

  `reverse_words` and `reverse_each_word` must build a new owned `String` (the input is only borrowed).
  `first_word` and `longest_word` must NOT allocate: they return a slice that points into the input.
  "Reverse" means by Unicode scalar value (`char`), never by byte.

  Example: `reverse_words("  the sky   is blue ")` is `"blue is sky the"`, and
  `reverse_each_word("ab cd")` is `"ba dc"`.
