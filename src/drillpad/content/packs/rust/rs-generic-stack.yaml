title: Generic Stack<T>
target_minutes: 15
patterns:
- generics
- option-return
- into-iterator
- vec-wrapper
firm_tags: []
categories:
- systems-impl
statement: |2

  Implement a generic LIFO stack backed by a `Vec<T>`. It must work for non-`Copy`, non-`Clone` element types
  (no `T: Clone` / `T: Copy` bounds anywhere).

  ```rust
  struct Stack<T> { /* your fields */ }

  impl<T> Stack<T> {
      fn new() -> Self;
      fn push(&mut self, value: T);
      fn pop(&mut self) -> Option<T>;               // None when empty
      fn peek(&self) -> Option<&T>;                 // borrow the top, do not remove it
      fn peek_mut(&mut self) -> Option<&mut T>;     // mutable borrow of the top
      fn len(&self) -> usize;
      fn is_empty(&self) -> bool;
  }

  impl<T> IntoIterator for Stack<T> { type Item = T; /* ... */ }   // consumes the stack, yields TOP FIRST
  ```

  Also implement `Default` for `Stack<T>` (an empty stack, again with no bound on `T`).

  Example: after pushing 1, 2, 3, `peek()` is `Some(&3)`, and `for x in stack` yields 3, 2, 1.
