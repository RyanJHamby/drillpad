hints:
- '`vec![None; n]` needs `Option<T>: Clone`. Without a `Clone` bound build the slots with `(0..capacity).map(|_| None).collect()` or `std::iter::repeat_with(|| None)`.'
- Keep `head` (index of the oldest) and `len`; the next free slot is `(head + len) % cap`, and the modulo must never run when `cap == 0` (division by zero panics), so check capacity first. Moving a value OUT of a slot while keeping the Vec intact is `self.slots[i].take()`, which leaves `None` behind.
- '`push` into a full buffer: return `Err(value)` before touching anything: that is why the error type is `T`. `push_overwrite` when full: `take()` the oldest slot, store the new value in that same slot, advance `head`, and keep `len` unchanged. `iter` can be `(0..self.len).map(move |k| self.slots[(self.head + k) % cap].as_ref().unwrap())` boxed.'
follow_ups:
- Why is Err(value) the right error type for push? What would you lose with Err(()) or a panic?
- 'How would you make this lock-free single-producer single-consumer (hint: atomics, power-of-two mask)?'
- What changes if capacity is a const generic [Option<T>; N] instead of a Vec?
- Why use head + len instead of head + tail indices? What ambiguity does tail == head create?
tests:
- name: fifo order and wraparound
  tags:
  - ordering
  - boundary
  code: |
    let mut rb = RingBuffer::new(3);
    assert!(rb.push(1).is_ok());
    assert!(rb.push(2).is_ok());
    assert!(rb.push(3).is_ok());
    assert!(rb.is_full());
    assert_eq!(rb.pop(), Some(1));
    assert!(rb.push(4).is_ok()); // wraps around the end of the Vec
    assert_eq!(rb.pop(), Some(2));
    assert_eq!(rb.pop(), Some(3));
    assert_eq!(rb.pop(), Some(4));
    assert_eq!(rb.pop(), None);
    assert!(rb.is_empty());
  hidden: false
- name: push on full returns the value back
  tags:
  - boundary
  - invalid
  code: |
    let mut rb = RingBuffer::new(2);
    assert_eq!(rb.push(String::from("a")), Ok(()));
    assert_eq!(rb.push(String::from("b")), Ok(()));
    let rejected = rb.push(String::from("c"));
    assert_eq!(rejected, Err(String::from("c")));
    assert_eq!(rb.len(), 2);
    assert_eq!(rb.peek().map(|s| s.as_str()), Some("a")); // unchanged
    assert_eq!(rb.pop().as_deref(), Some("a"));
    assert_eq!(rb.push(String::from("c")), Ok(()));
  hidden: false
- name: empty buffer
  tags:
  - empty
  code: |
    let mut rb: RingBuffer<i32> = RingBuffer::new(4);
    assert_eq!(rb.len(), 0);
    assert_eq!(rb.capacity(), 4);
    assert!(rb.is_empty() && !rb.is_full());
    assert_eq!(rb.pop(), None);
    assert_eq!(rb.peek(), None);
    assert_eq!(rb.iter().count(), 0);
  hidden: false
- name: iter is oldest to newest and non-consuming
  tags:
  - ordering
  - state-reuse
  code: |
    let mut rb = RingBuffer::new(4);
    for i in 1..=4 { rb.push(i).unwrap(); }
    rb.pop();
    rb.pop();
    rb.push(5).unwrap();
    rb.push(6).unwrap(); // data now wraps: [5, 6, 3, 4] with head at 2
    let seen: Vec<i32> = rb.iter().copied().collect();
    assert_eq!(seen, vec![3, 4, 5, 6]);
    assert_eq!(rb.len(), 4);
    assert_eq!(rb.peek(), Some(&3));
    let again: Vec<&i32> = rb.iter().collect();
    assert_eq!(again, vec![&3, &4, &5, &6]);
  hidden: false
- name: capacity zero and one
  tags:
  - zero-capacity
  - single
  hidden: true
  code: |
    let mut z = RingBuffer::new(0);
    assert!(z.is_empty() && z.is_full());
    assert_eq!(z.push(1), Err(1));
    assert_eq!(z.push_overwrite(2), Some(2));
    assert_eq!(z.pop(), None);
    assert_eq!(z.iter().count(), 0);
    let mut o = RingBuffer::new(1);
    assert_eq!(o.push('a'), Ok(()));
    assert_eq!(o.push('b'), Err('b'));
    assert_eq!(o.push_overwrite('c'), Some('a'));
    assert_eq!(o.peek(), Some(&'c'));
    assert_eq!(o.pop(), Some('c'));
    assert!(o.is_empty());
- name: push_overwrite drops the oldest
  tags:
  - ordering
  - duplicate
  hidden: true
  code: |
    let mut rb = RingBuffer::new(3);
    assert_eq!(rb.push_overwrite(1), None);
    assert_eq!(rb.push_overwrite(2), None);
    assert_eq!(rb.push_overwrite(3), None);
    assert_eq!(rb.push_overwrite(4), Some(1));
    assert_eq!(rb.push_overwrite(5), Some(2));
    assert_eq!(rb.len(), 3);
    assert_eq!(rb.iter().copied().collect::<Vec<_>>(), vec![3, 4, 5]);
    assert_eq!(rb.pop(), Some(3));
    assert_eq!(rb.push_overwrite(6), None);
    assert_eq!(rb.iter().copied().collect::<Vec<_>>(), vec![4, 5, 6]);
- name: values are moved, never cloned or leaked
  tags:
  - state-reuse
  - duplicate
  hidden: true
  code: |
    use std::rc::Rc;
    struct NoClone(Rc<()>);
    let token = Rc::new(());
    let mut rb = RingBuffer::new(2);
    rb.push(NoClone(Rc::clone(&token))).ok().unwrap();
    rb.push(NoClone(Rc::clone(&token))).ok().unwrap();
    assert_eq!(Rc::strong_count(&token), 3);
    let back = rb.push(NoClone(Rc::clone(&token)));
    assert!(back.is_err());
    assert_eq!(Rc::strong_count(&token), 4);
    drop(back);
    assert_eq!(Rc::strong_count(&token), 3);
    let old = rb.push_overwrite(NoClone(Rc::clone(&token)));
    assert!(old.is_some());
    drop(old);
    assert_eq!(Rc::strong_count(&token), 3);
    drop(rb);
    assert_eq!(Rc::strong_count(&token), 1);
- name: many cycles keep indices correct
  tags:
  - scale
  - boundary
  hidden: true
  code: |
    let mut rb = RingBuffer::new(7);
    let mut next_in = 0u64;
    let mut next_out = 0u64;
    for round in 0..200_000u64 {
        let pushes = (round % 5) as usize + 1;
        for _ in 0..pushes {
            if rb.push(next_in).is_ok() { next_in += 1; }
        }
        let pops = (round % 4) as usize + 1;
        for _ in 0..pops {
            if let Some(v) = rb.pop() {
                assert_eq!(v, next_out);
                next_out += 1;
            }
        }
        assert_eq!(rb.len() as u64, next_in - next_out);
    }
