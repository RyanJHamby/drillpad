statement: |2

  Implement a generic fixed-capacity FIFO ring buffer over a pre-allocated `Vec<Option<T>>` (no `T: Clone`, `Copy` or
  `Default` bounds anywhere, and no `VecDeque`).

  ```rust
  struct RingBuffer<T> { /* slots, head, len */ }

  impl<T> RingBuffer<T> {
      fn new(capacity: usize) -> Self;                         // capacity may be 0
      fn push(&mut self, value: T) -> Result<(), T>;           // Err(value) hands the value BACK when full
      fn push_overwrite(&mut self, value: T) -> Option<T>;     // when full, drops the oldest and returns it
      fn pop(&mut self) -> Option<T>;                          // oldest first (FIFO)
      fn peek(&self) -> Option<&T>;                            // the oldest, not removed
      fn len(&self) -> usize;
      fn capacity(&self) -> usize;
      fn is_empty(&self) -> bool;
      fn is_full(&self) -> bool;
      fn iter(&self) -> Box<dyn Iterator<Item = &T> + '_>;     // oldest to newest, without consuming
  }
  ```

  `push` on a full buffer must not lose the value: it returns `Err(value)`. With capacity 0 the buffer is always both
  empty and full: `push` returns `Err`, and `push_overwrite` returns the pushed value straight back as `Some(value)`
  (it cannot be stored). Indices must wrap correctly after many push/pop cycles.

  Example (capacity 2): `push(1)`, `push(2)`, `push(3)` gives `Err(3)`; `pop()` gives `Some(1)`.
