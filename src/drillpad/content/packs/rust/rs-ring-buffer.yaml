extensions:
- q: Why does push return Result<(), T> with the value inside Err, and why Vec<Option<T>> for the slots?
  kind: design
  key_points:
  - 'Ownership: push takes the value by move, so on failure it must give it back or the caller loses it; Err(value) makes ''full'' unignorable (#[must_use]) and lossless'
  - Option<T> slots let you move a value out with take() while keeping the Vec fully initialized, so no unsafe or MaybeUninit and no Default/Clone bound on T
  - Python's deque(maxlen=n) silently discards; Rust makes overwrite-vs-reject an explicit API choice (push vs push_overwrite)
- q: What are the costs, and how would you avoid the modulo on a hot path?
  kind: complexity
  key_points:
  - 'All operations are O(1) with one allocation up front: no reallocation unlike Vec growth'
  - 'Modulo (division) is slowish: round capacity up to a power of two and use `& (cap - 1)`, as high-performance queues do'
  - Space is O(capacity) fixed regardless of occupancy, plus the Option discriminant per slot unless T has a niche
- q: How would you turn this into a single-producer single-consumer queue shared between two threads?
  kind: design
  key_points:
  - Split into Producer and Consumer handles over Arc<Inner> where head and tail are AtomicUsize with Acquire/Release ordering
  - The slots become UnsafeCell<MaybeUninit<T>>, so unsafe is required; the safe API relies on exactly one producer and one consumer (the handles are Send but not Clone)
  - T must be Send; keep head and tail on separate cache lines to avoid false sharing
state_aloud:
- Capacity 0 is both empty and full; avoid `% 0` which panics.
- 'push on a full buffer returns Err(value): the value is never dropped silently.'
- 'Wraparound: next write index is (head + len) % capacity; test after many cycles.'
- 'Build slots without Clone: use repeat_with(|| None), not vec![None; n].'
- iter is oldest to newest and does not consume the buffer.
walkthrough: |2

  The buffer is a `Vec<Option<T>>` of fixed size with a `head` index of the oldest element and a `len`; the next free slot is `(head + len) % capacity`. `Option::take` moves a value out of a slot while keeping the Vec valid, which is what lets it work for any `T` without `Clone` or `unsafe`, and `push` returns `Err(value)` when full so ownership of the rejected value goes back to the caller. Compared with Python's `collections.deque(maxlen=n)`, which silently drops, the Rust API forces you to choose between rejecting (`push`) and overwriting the oldest (`push_overwrite`).
