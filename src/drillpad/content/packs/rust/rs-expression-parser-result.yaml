statement: |2

  Evaluate arithmetic expressions with `+ - * /`, parentheses, unary minus and decimal numbers, returning errors as
  values instead of panicking. These two enums are **already defined for you** (do not redefine them):

  ```rust
  #[derive(Debug, Clone, Copy, PartialEq)]
  enum Token { Num(f64), Plus, Minus, Star, Slash, LParen, RParen }

  #[derive(Debug, Clone, PartialEq)]
  enum ParseError {
      UnexpectedChar(char),     // tokenizer met a char that cannot start a token, e.g. 'x' or '$'
      InvalidNumber(String),    // a run of digits/dots that is not an f64, e.g. "1.2.3" or "."
      UnexpectedEnd,            // input ended where more was required: "", "1 +", "2 *"
      UnexpectedToken(Token),   // a token in the wrong place: "1 2" -> Num(2.0), "*3" -> Star, "()" -> RParen
      UnmatchedParen,           // "(1 + 2" (missing close) or "1 + 2)" (extra close)
      DivisionByZero,           // divisor equals 0.0
  }
  ```

  Write:

  ```rust
  fn tokenize(input: &str) -> Result<Vec<Token>, ParseError>;
  fn evaluate(input: &str) -> Result<f64, ParseError>;
  ```

  Whitespace is skipped. A number is a maximal run of ASCII digits and `.`; parse it with `str::parse::<f64>`
  (a failure is `InvalidNumber(text)`). Precedence: `*` and `/` bind tighter than `+` and `-`, all left associative;
  unary minus (`-3`, `--3`, `2 * -3`) binds tighter than `*`. There is no unary plus. A successful `evaluate` must
  consume every token.

  Error details the tests check: `evaluate("")` is `UnexpectedEnd`; inside parentheses, a missing `)` at end of input is
  `UnmatchedParen` while a wrong token there is `UnexpectedToken(tok)`; a leftover `)` after a complete expression is
  `UnmatchedParen`; any other leftover token is `UnexpectedToken(tok)`. Tokenizer errors are reported before any parse
  error. Example: `evaluate("2 * (3 + 4)")` is `Ok(14.0)`.
