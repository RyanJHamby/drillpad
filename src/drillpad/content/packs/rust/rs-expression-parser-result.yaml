hints:
- 'Split the work: `tokenize` walks `input.chars().peekable()` and builds `Vec<Token>`; the parser then walks a `&[Token]` with an index. Every fallible step returns `Result` so you can chain with `?` instead of unwrapping.'
- 'Recursive descent: `expr` loops over `+ -` calling `term`; `term` loops over `* /` calling `unary`; `unary` handles a leading `-` by recursing, otherwise calls `primary`; `primary` matches `Num` or `(` expr `)`. A small `struct Parser { tokens: Vec<Token>, pos: usize }` with `&mut self` methods keeps the cursor out of every signature.'
- 'Use `match self.peek()` over the `Option<Token>`: `None` means end of input (`UnexpectedEnd` or `UnmatchedParen` depending on context), `Some(Token::Plus)` etc. are the operators. `Token` is `Copy`, so peeking by value avoids borrow fights with `&mut self`.'
follow_ups:
- Why model errors as an enum with data instead of returning strings?
- How does the ? operator convert errors, and what would From<ParseFloatError> for ParseError buy you?
- How would you add exponentiation (right associative) and function calls like sqrt(x)?
- How would you produce error positions (byte offsets) for good diagnostics?
tests:
- name: tokenize basics
  tags:
  - single
  - ordering
  code: |
    assert_eq!(tokenize("1+2").unwrap(), vec![Token::Num(1.0), Token::Plus, Token::Num(2.0)]);
    assert_eq!(
        tokenize(" ( 3.5 * 2 ) / x1").unwrap_err(),
        ParseError::UnexpectedChar('x')
    );
    assert_eq!(
        tokenize("(3.5*2)-4/1").unwrap(),
        vec![Token::LParen, Token::Num(3.5), Token::Star, Token::Num(2.0), Token::RParen,
             Token::Minus, Token::Num(4.0), Token::Slash, Token::Num(1.0)]
    );
    assert_eq!(tokenize("").unwrap(), vec![]);
  hidden: false
- name: precedence and associativity
  tags:
  - ordering
  - single
  code: |
    assert_eq!(evaluate("1 + 2 * 3"), Ok(7.0));
    assert_eq!(evaluate("(1 + 2) * 3"), Ok(9.0));
    assert_eq!(evaluate("10 - 4 - 3"), Ok(3.0));
    assert_eq!(evaluate("100 / 10 / 5"), Ok(2.0));
    assert_eq!(evaluate("2 * (3 + 4)"), Ok(14.0));
    assert_eq!(evaluate("2 + 3 * 4 - 6 / 3"), Ok(12.0));
    assert_eq!(evaluate("42"), Ok(42.0));
    assert_eq!(evaluate("((7))"), Ok(7.0));
    assert_eq!(evaluate(" 1.5 + .5 "), Ok(2.0));
  hidden: false
- name: unary minus
  tags:
  - boundary
  - single
  code: |
    assert_eq!(evaluate("-3"), Ok(-3.0));
    assert_eq!(evaluate("--3"), Ok(3.0));
    assert_eq!(evaluate("2 * -3"), Ok(-6.0));
    assert_eq!(evaluate("-(1 + 2) * 2"), Ok(-6.0));
    assert_eq!(evaluate("4 - -4"), Ok(8.0));
    assert_eq!(evaluate("-2 * -2"), Ok(4.0));
  hidden: false
- name: empty and truncated input
  tags:
  - empty
  - invalid
  code: |
    assert_eq!(evaluate(""), Err(ParseError::UnexpectedEnd));
    assert_eq!(evaluate("   "), Err(ParseError::UnexpectedEnd));
    assert_eq!(evaluate("1 +"), Err(ParseError::UnexpectedEnd));
    assert_eq!(evaluate("2 *"), Err(ParseError::UnexpectedEnd));
    assert_eq!(evaluate("-"), Err(ParseError::UnexpectedEnd));
  hidden: false
- name: division by zero is an error value
  tags:
  - invalid
  - boundary
  code: |
    assert_eq!(evaluate("1 / 0"), Err(ParseError::DivisionByZero));
    assert_eq!(evaluate("5 / (3 - 3)"), Err(ParseError::DivisionByZero));
    assert_eq!(evaluate("0 / 5"), Ok(0.0));
    assert_eq!(evaluate("1 / 0.0"), Err(ParseError::DivisionByZero));
  hidden: false
- name: unexpected tokens and characters
  tags:
  - invalid
  hidden: true
  code: |
    assert_eq!(evaluate("1 2"), Err(ParseError::UnexpectedToken(Token::Num(2.0))));
    assert_eq!(evaluate("*3"), Err(ParseError::UnexpectedToken(Token::Star)));
    assert_eq!(evaluate("()"), Err(ParseError::UnexpectedToken(Token::RParen)));
    assert_eq!(evaluate("(1 2)"), Err(ParseError::UnexpectedToken(Token::Num(2.0))));
    assert_eq!(evaluate("3 $ 4"), Err(ParseError::UnexpectedChar('$')));
    assert_eq!(evaluate("1.2.3 + 1"), Err(ParseError::InvalidNumber("1.2.3".to_string())));
    assert_eq!(evaluate("."), Err(ParseError::InvalidNumber(".".to_string())));
- name: unmatched parentheses
  tags:
  - invalid
  - boundary
  hidden: true
  code: |
    assert_eq!(evaluate("(1 + 2"), Err(ParseError::UnmatchedParen));
    assert_eq!(evaluate("1 + 2)"), Err(ParseError::UnmatchedParen));
    assert_eq!(evaluate("((1)"), Err(ParseError::UnmatchedParen));
    assert_eq!(evaluate("("), Err(ParseError::UnexpectedEnd));
    assert_eq!(evaluate("1 + (2 * 3))"), Err(ParseError::UnmatchedParen));
- name: deep nesting and long chains
  tags:
  - scale
  hidden: true
  code: |
    let deep = format!("{}1{}", "(".repeat(2000), ")".repeat(2000));
    assert_eq!(evaluate(&deep), Ok(1.0));
    let long = vec!["1"; 50_000].join("+");
    assert_eq!(evaluate(&long), Ok(50_000.0));
