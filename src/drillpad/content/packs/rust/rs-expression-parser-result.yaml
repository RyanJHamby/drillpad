extensions:
- q: Why is an error enum with data better than String errors, and how do ? and From fit together?
  kind: design
  key_points:
  - Callers can match exhaustively on variants and the compiler flags unhandled cases; strings force parsing
  - '`?` returns early with Err(e.into()), so a `From<ParseFloatError> for ParseError` impl lets numeric parse failures convert automatically'
  - Implement Display and std::error::Error so it composes with Box<dyn Error> and anyhow-style code
- q: What is the time and stack cost of recursive descent, and what happens with deeply nested parentheses?
  kind: complexity
  key_points:
  - 'Each token is consumed once: O(n) time overall'
  - Recursion depth equals nesting depth, so stack space is O(depth) up to O(n)
  - 'Very deep input can overflow the stack: cap depth and return an error, or use a shunting-yard algorithm with an explicit Vec stack'
- q: How would you add right-associative exponentiation and function calls like sqrt(x), min(a, b)?
  kind: design
  key_points:
  - 'Add a precedence level between unary and primary: power = primary (''^'' unary_or_power)? recursing on the right for right associativity'
  - Add Token::Ident(String), Comma and an arity-checking dispatch with new ParseError variants (UnknownFunction, WrongArity)
  - Keep tokenizer and parser separate so each new token type is a local change
state_aloud:
- Empty or whitespace-only input is UnexpectedEnd, not a panic or Ok(0).
- Division by zero is an error value; check the divisor before dividing since f64 would give inf.
- 'Precedence and left associativity: 10 - 4 - 3 is 3, not 9.'
- 'Unary minus can stack: --3 and 2 * -3 must work.'
- 'Never unwrap: every failure path returns Err so one bad input cannot crash the caller.'
walkthrough: |2

  `tokenize` scans the characters once and produces a `Vec<Token>` or the first `ParseError`; a small recursive-descent `Parser` then implements one function per precedence level (`expr`, `term`, `unary`, `primary`) and matches on the next `Token`, using `?` to bubble errors up. Errors are an enum with data, so callers (and tests) match on exactly what went wrong, unlike Python where you would raise exceptions of various types. Division checks for a zero divisor before dividing, and `evaluate` verifies no tokens are left over, mapping a stray `)` to `UnmatchedParen`.
