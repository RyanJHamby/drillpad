id: cpp-scope-guard
title: ScopeGuard and Exception Safety
language: cpp
bar_level: 1
target_minutes: 15
patterns:
- raii
- scope-guard
- exception-safety
- move-only
- ctad
firm_tags:
- quant-hft
- ai-infra
statement: |
  Implement `template <class F> class ScopeGuard` (C++20), an RAII helper that runs a callable when the
  guard leaves scope (normal exit, early `return`, or exception unwinding) unless it was dismissed, and use it
  to give a function the strong exception guarantee.

  API:
  - `explicit ScopeGuard(F f)`: store the callable; class template argument deduction must work (`ScopeGuard g([&]{ ... });`)
  - `void dismiss() noexcept`: cancel the action (idempotent)
  - Not copyable; movable. A moved-from guard must not run the action; the action runs exactly once overall.
  - The destructor must never let an exception escape (it can run during stack unwinding); swallow exceptions
    from the cleanup callable.
  - `make_scope_guard(f)` returns a `ScopeGuard<F>` by value (works because of the move constructor).
  - `void add_to_both(Sink& a, Sink& b, int v)`: call `a.add(v)` then `b.add(v)` using a guard so that if `b.add`
    throws, `a` is rolled back with `a.remove_last()` and the exception propagates (strong guarantee).
    `Sink` is provided; `add` throws `std::runtime_error` when `fail` is set.

  Guards declared later run first (reverse order of construction).

  Example:
  ```cpp
  {
      ScopeGuard g([&] { log("cleanup"); });
      risky();                 // cleanup runs even if this throws
  }
  ```
starter: |
  // Runs `f` when the guard goes out of scope, unless dismiss() was called. Move-only.
  template <class F>
  class ScopeGuard {
  public:
      explicit ScopeGuard(F f) { (void)f; }
      void dismiss() noexcept {}
  };

  template <class F>
  ScopeGuard<F> make_scope_guard(F f) { return ScopeGuard<F>(std::move(f)); }

  // Add v to `a` and then to `b` with the STRONG exception guarantee: if either add throws,
  // both sinks are exactly as they were before the call and the exception propagates.
  void add_to_both(Sink& a, Sink& b, int v) {
      (void)a; (void)b; (void)v;
  }
prelude: |
  struct Sink {
      std::vector<int> items;
      bool fail = false;
      void add(int v) { if (fail) throw std::runtime_error("sink full"); items.push_back(v); }
      void remove_last() { items.pop_back(); }
  };
hints:
- Hold the callable and a bool active_. The destructor runs the callable only if active_.
- 'The move constructor must steal the callable and disable the source: std::exchange(o.active_, false).
  Delete the copy operations.'
- 'Wrap the cleanup in try { f_(); } catch (...) {} inside the destructor: a destructor is noexcept by
  default and a throw during unwinding calls std::terminate. For add_to_both: do the first add, arm the
  guard, do the second add, dismiss.'
follow_ups:
- Why can the destructor not simply let the cleanup throw?
- How does std::uncaught_exceptions() let you build scope_fail / scope_success variants?
- What does the strong exception guarantee require beyond a guard (copy-and-swap, commit-or-rollback ordering)?
- How does this compare with Python's `try/finally` or `contextlib.ExitStack`, and with Go's defer?
tests:
- name: runs at scope exit
  tags:
  - single
  - boundary
  code: |
    int n = 0;
    {
        ScopeGuard g([&] { ++n; });
        CHECK_EQ(n, 0);
    }
    CHECK_EQ(n, 1);
- name: dismiss cancels the action
  tags:
  - boundary
  - state-reuse
  code: |
    int n = 0;
    {
        ScopeGuard g([&] { ++n; });
        g.dismiss();
        g.dismiss();
    }
    CHECK_EQ(n, 0);
    {
        auto g2 = make_scope_guard([&] { n += 10; });
    }
    CHECK_EQ(n, 10);
- name: cleanup runs in reverse order of construction
  tags:
  - ordering
  code: |
    std::vector<int> order;
    {
        ScopeGuard a([&] { order.push_back(1); });
        ScopeGuard b([&] { order.push_back(2); });
        ScopeGuard c([&] { order.push_back(3); });
    }
    std::vector<int> want = {3, 2, 1};
    CHECK(order == want);
- name: runs while an exception unwinds
  tags:
  - invalid
  - single
  code: |
    int n = 0;
    bool caught = false;
    try {
        ScopeGuard g([&] { ++n; });
        throw std::runtime_error("boom");
    } catch (const std::runtime_error&) { caught = true; }
    CHECK(caught);
    CHECK_EQ(n, 1);
- name: early return still cleans up
  tags:
  - boundary
  - ordering
  code: |
    int n = 0;
    auto f = [&](bool bail) {
        ScopeGuard g([&] { ++n; });
        if (bail) return 1;
        return 2;
    };
    CHECK_EQ(f(true), 1);
    CHECK_EQ(n, 1);
    CHECK_EQ(f(false), 2);
    CHECK_EQ(n, 2);
- name: move transfers responsibility, never double runs
  tags:
  - duplicate
  - state-reuse
  code: |
    int n = 0;
    {
        auto make = [&] { return make_scope_guard([&] { ++n; }); };
        auto g = make();
        CHECK_EQ(n, 0);
        ScopeGuard moved(std::move(g));
        CHECK_EQ(n, 0);
    }
    CHECK_EQ(n, 1);
- name: not copyable but movable
  tags:
  - invalid
  code: |
    auto fn = [] {};
    using G = ScopeGuard<decltype(fn)>;
    CHECK(!std::is_copy_constructible_v<G>);
    CHECK(!std::is_copy_assignable_v<G>);
    CHECK(std::is_move_constructible_v<G>);
    int n = 0;
    { ScopeGuard g([&] { ++n; }); }
    CHECK_EQ(n, 1);
- name: add_to_both success keeps both
  tags:
  - single
  - ordering
  code: |
    Sink a, b;
    add_to_both(a, b, 1);
    add_to_both(a, b, 2);
    std::vector<int> want = {1, 2};
    CHECK(a.items == want);
    CHECK(b.items == want);
- name: add_to_both failure rolls back (strong guarantee)
  tags:
  - invalid
  - state-reuse
  code: |
    Sink a, b;
    add_to_both(a, b, 1);
    b.fail = true;
    CHECK_THROWS(add_to_both(a, b, 2));
    std::vector<int> want = {1};
    CHECK(a.items == want);
    CHECK(b.items == want);
    b.fail = false;
    add_to_both(a, b, 3);
    std::vector<int> want2 = {1, 3};
    CHECK(a.items == want2);
    CHECK(b.items == want2);
- name: a throwing cleanup does not escape the destructor
  hidden: true
  tags:
  - invalid
  - boundary
  code: |
    int ran = 0;
    {
        ScopeGuard g([&] { ++ran; throw std::runtime_error("cleanup failed"); });
    }
    CHECK_EQ(ran, 1);
    bool escaped = false;
    try {
        ScopeGuard g([&] { throw std::runtime_error("cleanup failed"); });
        throw std::logic_error("primary");
    } catch (const std::logic_error&) {
    } catch (...) { escaped = true; }
    CHECK(!escaped);
- name: guard works with move-only captures and function pointers
  hidden: true
  tags:
  - single
  - empty
  code: |
    static int hits;
    hits = 0;
    {
        auto p = std::make_unique<int>(5);
        ScopeGuard g([q = std::move(p)] { hits += *q; });
    }
    CHECK_EQ(hits, 5);
    {
        ScopeGuard g(+[] { hits += 100; });
    }
    CHECK_EQ(hits, 105);
complexity:
- op: construct / dismiss
  time: O(1)
  space: O(1)
- op: destructor
  time: O(1)
  space: O(1)
extensions:
- q: What does the strong guarantee require, and what does the guard buy you?
  kind: reasoning
  key_points:
  - 'Either the operation fully succeeds or program state is unchanged: do all throwing work first, then
    commit with non-throwing operations'
  - A guard arms an undo action right after each step that has side effects, then dismisses it at the
    commit point
  - Rollback actions themselves must not throw, hence the swallow in the destructor
- q: What is the runtime cost of a guard?
  kind: complexity
  key_points:
  - 'Zero overhead abstraction: the lambda is inlined, the guard is one bool beyond the callable (EBO
    for empty lambdas)'
  - No heap allocation, unlike std::function-based defer which type-erases
  - Dismiss is a single store; the destructor a single branch
- q: How would you make scope_fail and scope_success variants?
  kind: design
  key_points:
  - Record std::uncaught_exceptions() at construction and compare it in the destructor
  - scope_fail runs only if the count grew (exiting by exception); scope_success only if it did not
  - Success variants may throw from the destructor if declared noexcept(false); the failure variant must
    not
- q: Where does this pattern appear in real C++ code and what are its pitfalls?
  kind: design
  key_points:
  - It underlies std::lock_guard, std::unique_lock, and Folly/Abseil ScopeGuard/Cleanup; absl::Cleanup
    is the standard-style version
  - 'Pitfall: a guard capturing locals by reference must not outlive them (do not return it from the function)'
  - 'Pitfall: an unnamed temporary `ScopeGuard([&]{...});` runs immediately: always name the guard'
narration: []
state_aloud:
- 'A destructor must not throw: swallow (or log) cleanup failures.'
- 'Strong guarantee: do the fallible work first, commit last; roll back with an armed guard.'
- Moved-from guard must be disarmed so the action runs exactly once.
- 'Name your guard: an unnamed temporary is destroyed at the end of the full expression.'
walkthrough: |
  The guard stores the callable and an `active_` flag; the destructor runs the callable unless dismissed, and swallows exceptions because a throwing destructor during unwinding terminates the program. The move constructor disarms the source, copying is deleted, and `add_to_both` arms a rollback after the first add and dismisses it once the second succeeds. Python uses `try/finally` or `with`; in C++ the destructor of a stack object is the finally block, and exception safety is a design property you enforce by ordering your operations.
