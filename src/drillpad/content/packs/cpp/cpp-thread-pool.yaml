extensions:
- q: What are the concurrency and lifetime hazards in this design?
  kind: design
  key_points:
  - 'Tasks run after submit returns: captured references must outlive the future, so prefer value captures
    or join via the future'
  - A task that blocks waiting on another queued task can deadlock a fixed-size pool (thread starvation)
  - 'Destroying the pool from a worker thread would join itself: forbid it'
- q: What is the contention profile and how would you scale it?
  kind: complexity
  key_points:
  - 'One mutex and one queue serializes submit and pop: O(1) per op but all threads contend on one cache
    line'
  - Per-worker deques with work stealing cut contention at the cost of complexity
  - Batch dequeue or lock-free MPMC queues reduce lock hold time; wake-up latency is then dominated by
    the futex
- q: Why decay-copy the callable and arguments?
  kind: reasoning
  key_points:
  - The task outlives the submit call, so it must own its arguments, exactly what std::thread and std::async
    do
  - Perfect forwarding straight into the queue would store dangling references to temporaries
  - Use std::ref explicitly when you do mean to pass by reference
- q: How would you add task priorities or graceful cancellation?
  kind: design
  key_points:
  - Replace std::queue with a priority_queue keyed by (priority, sequence) to stay FIFO within a level
  - 'Cancellation: a std::stop_token or shared atomic flag checked by long tasks; pending tasks can be
    dropped on a fast shutdown'
  - A broken_promise future_error results if a packaged_task is destroyed unrun, which makes dropped tasks
    observable
narration: []
state_aloud:
- 'Spurious wakeups: always wait with a predicate.'
- Never run user code while holding the queue mutex (deadlock and serialization).
- 'Shutdown semantics: drain vs drop; here we drain and reject new work.'
- 'Exceptions in tasks must not kill the worker thread: packaged_task captures them into the future.'
walkthrough: |
  Workers sleep on a condition variable until the queue has work or the pool is stopping, pop a task under the lock and run it outside it; `submit` wraps the call in a `std::packaged_task` (kept in a `shared_ptr` because `std::function` needs copyable callables) so results and exceptions flow into the future. Shutdown sets the stop flag under the mutex and joins, draining the queue first. Python's `ThreadPoolExecutor` does all this for you; the C++ work is move-only task storage, lifetime, and the stop/drain protocol.
