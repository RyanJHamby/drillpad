anki_queries: []
statement: |
  Order-entry protocols pack order options into bit flags. Implement helpers over this fixed table (given in the starter):

  `FLAGS = {"IOC": 1, "FOK": 2, "POST_ONLY": 4, "HIDDEN": 8, "REDUCE_ONLY": 16}`

  - `parse_flags(names) -> int`: OR of the named flags (`ValueError` for an unknown name; `[]` gives 0; repeats are harmless).
  - `flag_names(flags) -> list[str]`: names of the set flags in ascending bit order.
  - `toggle(flags, name) -> int`: flip one flag (`ValueError` for an unknown name).
  - `validate(flags) -> bool`: True iff `flags` is an int in `0..31` (no unknown high bits, not negative) AND it is
    consistent: `IOC` and `FOK` are mutually exclusive, and `POST_ONLY` cannot be combined with `IOC` or `FOK`.
  - `popcount(x) -> int`: number of set bits (non-negative `x`, else `ValueError`); use the `x &= x - 1` trick, not `bin().count`.
  - `lowest_set_bit(x) -> int`: index of the lowest set bit using `x & -x`, or `-1` for 0 (`ValueError` if negative).
  - `diff_flags(a, b) -> list[str]`: names whose state differs between `a` and `b` (XOR), ascending bit order.
  - `pack(side, flags, qty) -> int`: a single word `(qty << 8) | (flags << 1) | side_bit` with `side_bit` 0 for `"buy"`, 1 for
    `"sell"`. `ValueError` if side is bad, `flags` fails `validate`, or `qty` is not an int in `1..2**32 - 1`.
  - `unpack(word) -> (side, flags, qty)`: the inverse; `ValueError` for a negative word, a word with bits 6-7 set, or a word of 40 bits or more.
prelude: |
