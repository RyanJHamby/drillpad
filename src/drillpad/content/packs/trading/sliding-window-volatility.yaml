id: sliding-window-volatility
title: Rolling Volatility (Welford)
bar_level: 2
target_minutes: 25
patterns:
- welford
- sliding-window
- running-statistics
- numerical-stability
firm_tags:
- quant-hft
anki_queries: []
statement: |
  Implement `RollingStd(window)`: streaming sample standard deviation (a volatility estimate) over the last `window`
  observations.

  - `add(x) -> float | None`: append observation `x` (int or float) and return the **sample** standard deviation
    (divide by `n - 1`) of the most recent `min(count, window)` values, or `None` while fewer than 2 values are in the window.
  - `std() -> float | None`: same value for the current window without adding.
  - `window` must be an int >= 2 else `ValueError`.

  Implement it with a Welford-style running mean and sum of squared deviations (`m2`) that supports both adding the
  new value and REMOVING the value that falls out of the window, so each `add` is O(1). A naive recompute is O(window) per
  tick and will time out. Do not use `sum(x*x)` minus `n*mean**2`: with prices around 1e9 and tiny variance it loses all
  precision (catastrophic cancellation); tests include such data.

  Results are compared with a tolerance of 1e-6 (absolute or relative, whichever is looser).
starter: |
  class RollingStd:
      def __init__(self, window):
          pass
hints:
- 'Keep n, mean and m2 (sum of squared deviations). Adding x: n += 1; d = x - mean; mean += d / n; m2
  += d * (x - mean).'
- 'Removing x from a window of n values: new_n = n - 1, new_mean = (n * mean - x) / new_n, m2 -= (x -
  old_mean) * (x - new_mean). Handle the n == 1 case by resetting.'
- Sample variance is m2 / (n - 1) and needs n >= 2. Clamp tiny negative m2 from rounding to 0 before sqrt.
follow_ups:
- Why is sum-of-squares minus n*mean^2 a bad idea for prices?
- How would you compute an exponentially weighted volatility instead?
- How do you annualize volatility from per-tick or per-minute returns?
tests:
- name: basic windowed std
  code: |
    r = RollingStd(3)
    assert r.add(2) is None
    assert abs(r.add(4) - 2 ** 0.5) < 1e-9
    assert abs(r.add(6) - 2.0) < 1e-9
    assert abs(r.add(8) - 2.0) < 1e-9, "window now [4, 6, 8]"
    assert abs(r.std() - 2.0) < 1e-9
  hidden: false
  tags:
  - ordering
  - boundary
- name: fewer than two values gives None
  code: |
    r = RollingStd(5)
    assert r.std() is None
    assert r.add(10) is None and r.std() is None
    assert abs(r.add(10) - 0.0) < 1e-12
  hidden: false
  tags:
  - empty
  - single
- name: constant series has zero std and never goes negative
  code: |
    r = RollingStd(4)
    for _ in range(50):
        out = r.add(1234567)
    assert out == 0.0 or abs(out) < 1e-9
    for x in [5, 5, 5, 5, 5]:
        out = r.add(x)
    assert abs(out) < 1e-9
  hidden: false
  tags:
  - duplicate
  - boundary
- name: window of 2
  code: |
    r = RollingStd(2)
    r.add(1)
    assert abs(r.add(3) - 2 ** 0.5) < 1e-9
    assert abs(r.add(3) - 0.0) < 1e-9
    assert abs(r.add(10) - (7 / 2 ** 0.5)) < 1e-9
    for bad in (0, 1, -3, 2.5):
        try:
            RollingStd(bad)
        except ValueError:
            pass
        else:
            raise AssertionError(bad)
  hidden: false
  tags:
  - zero-capacity
  - invalid
- name: numerically stable with large offset
  code: |
    r = RollingStd(5)
    base = 10**9
    xs = [base + d for d in (1, 2, 3, 4, 5, 6, 7, 8)]
    out = [r.add(x) for x in xs]
    # every full window is five consecutive integers -> sample std = sqrt(2.5)
    for v in out[4:]:
        assert abs(v - 2.5 ** 0.5) < 1e-6, v
  hidden: true
  tags:
  - boundary
  - ordering
- name: matches brute force on random-ish data
  code: |
    import math
    w = 7
    xs = [(i * 7919) % 101 + (i % 3) * 0.5 for i in range(200)]
    r = RollingStd(w)
    for i, x in enumerate(xs):
        got = r.add(x)
        win = xs[max(0, i - w + 1): i + 1]
        if len(win) < 2:
            assert got is None
            continue
        m = sum(win) / len(win)
        exp = math.sqrt(sum((v - m) ** 2 for v in win) / (len(win) - 1))
        assert abs(got - exp) < 1e-6, (i, got, exp)
  hidden: true
  tags:
  - ordering
  - time
- name: 'scale: 300k ticks, window 5000'
  code: |
    r = RollingStd(5000)
    last = None
    for i in range(300000):
        last = r.add(100000 + (i * 7919) % 1000)
    assert 250 < last < 330
  hidden: true
  tags:
  - scale
  - time
complexity:
- op: add
  time: O(1)
  space: O(W)
- op: std
  time: O(1)
  space: O(1)
extensions:
- q: 'Level 2: compute rolling volatility of log returns instead of prices and annualize it.'
  key_points:
  - Convert prices to returns incrementally (needs the previous price) and feed returns to the estimator
  - Annualization multiplies by sqrt(periods per year)
  - First price yields no return, so output is None until two returns exist
  kind: code
- q: 'Level 3: replace the window with an exponentially weighted variance (EWMA).'
  key_points:
  - Update mean and variance with a single alpha and no stored history
  - West/Finch incremental formula keeps stability
  - Seed with the first observation and define the warm-up behaviour
  kind: code
- q: Complexity and numerical error of the Welford add/remove approach.
  key_points:
  - O(1) time per tick, O(W) memory for the deque
  - Welford avoids catastrophic cancellation; removals accumulate small drift, so periodically recompute
    exactly
  - 'Naive recompute is O(W) per tick: 300k ticks x 5000 window is >1e9 operations'
  kind: complexity
- q: 'Design: where does rolling volatility feed in a trading system?'
  key_points:
  - Sizing and risk limits (vol targeting), spread/quote width in market making
  - Estimator state is per symbol and must be checkpointed or warmed up from history on restart
  - Bad ticks should be filtered before the estimator or they dominate the variance
  kind: design
narration: []
state_aloud:
- Sample std (n - 1); None until two observations are in the window.
- Window of 2 is the minimum; constant data must give 0, never NaN from a tiny negative m2.
- Welford updates rather than E[x^2] - E[x]^2 because of cancellation at large price offsets.
walkthrough: |
  Standard Welford streaming variance extended with a removal step for a sliding window. Source: standard formulation.
