id: ohlc-bar-aggregation
title: OHLC Bar Aggregation from Ticks
bar_level: 2
target_minutes: 20
patterns:
- time-bucketing
- single-pass
- streaming
- gap-fill
firm_tags:
- quant-hft
anki_queries: []
statement: |
  Aggregate a tick stream into OHLCV bars.

  `ohlc(ticks, bar_secs, fill_gaps=False) -> list[tuple]` where `ticks` is a list of `(ts, price, qty)`
  (int seconds, int price ticks, int qty) sorted by `ts` (non-decreasing; raise `ValueError` if not sorted).

  A tick belongs to the bar starting at `ts - ts % bar_secs` (bars are `[start, start + bar_secs)`). Return one
  tuple per bar that has at least one tick, in time order: `(bar_start, open, high, low, close, volume)`.
  Open/close are the first/last tick of the bar **in input order** (ties on `ts` keep input order); volume is the sum of qty.

  If `fill_gaps` is True, also emit a flat bar for every EMPTY bar between the first and last bar:
  `(start, c, c, c, c, 0)` where `c` is the previous bar's close. Never emit anything before the first
  bar or after the last. Empty input gives `[]`. `ValueError` if `bar_secs <= 0`.

  The input can have hundreds of thousands of ticks: do a single pass, not one scan per bar.
starter: |
  def ohlc(ticks, bar_secs, fill_gaps=False):
      pass
hints:
- 'Bucket id is ts - ts % bar_secs. Because input is sorted, you only ever need the current open bar:
  emit it when the bucket changes.'
- Open is set when a bar is created, close is overwritten on every tick, high/low use max/min, volume
  adds.
- To fill gaps, emit flat bars from previous_start + bar_secs up to (not including) the new bar start,
  using the previous close.
follow_ups:
- How do you handle ticks that arrive late for an already emitted bar?
- How would you emit bars live (on a timer) instead of from a batch?
- What do you do for VWAP and trade count per bar?
tests:
- name: basic one-minute bars
  code: |
    ticks = [(0, 100, 1), (10, 105, 2), (30, 99, 3), (59, 101, 4), (60, 102, 5), (61, 98, 1)]
    assert ohlc(ticks, 60) == [(0, 100, 105, 99, 101, 10), (60, 102, 102, 98, 98, 6)]
  hidden: false
  tags:
  - ordering
  - boundary
- name: empty and single tick
  code: |
    assert ohlc([], 60) == []
    assert ohlc([(125, 50, 7)], 60) == [(120, 50, 50, 50, 50, 7)]
  hidden: false
  tags:
  - empty
  - single
- name: bar boundary is half-open
  code: |
    out = ohlc([(59, 10, 1), (60, 20, 1), (119, 30, 1), (120, 40, 1)], 60)
    assert out == [(0, 10, 10, 10, 10, 1), (60, 20, 30, 20, 30, 2), (120, 40, 40, 40, 40, 1)]
  hidden: false
  tags:
  - boundary
- name: same timestamp keeps input order for open and close
  code: |
    out = ohlc([(5, 100, 1), (5, 90, 1), (5, 110, 1)], 10)
    assert out == [(0, 100, 110, 90, 110, 3)]
  hidden: false
  tags:
  - duplicate
  - ordering
- name: gaps are skipped by default and filled on request
  code: |
    ticks = [(0, 100, 2), (185, 120, 3)]
    assert ohlc(ticks, 60) == [(0, 100, 100, 100, 100, 2), (180, 120, 120, 120, 120, 3)]
    assert ohlc(ticks, 60, fill_gaps=True) == [
        (0, 100, 100, 100, 100, 2), (60, 100, 100, 100, 100, 0),
        (120, 100, 100, 100, 100, 0), (180, 120, 120, 120, 120, 3)]
  hidden: false
  tags:
  - boundary
  - time
- name: bar_secs of 1 and invalid input
  code: |
    assert ohlc([(3, 5, 1), (3, 6, 1), (4, 7, 2)], 1) == [(3, 5, 6, 5, 6, 2), (4, 7, 7, 7, 7, 2)]
    for bad in (0, -60):
        try:
            ohlc([(1, 1, 1)], bad)
        except ValueError:
            pass
        else:
            raise AssertionError(bad)
    try:
        ohlc([(5, 1, 1), (4, 1, 1)], 60)
    except ValueError:
        pass
    else:
        raise AssertionError("unsorted")
  hidden: true
  tags:
  - invalid
  - zero-capacity
- name: 'scale: 300k ticks into 100k bars'
  code: |
    ticks = [(i // 3, 1000 + (i * 37) % 200, 1 + i % 4) for i in range(300000)]
    bars = ohlc(ticks, 1)
    assert len(bars) == 100000
    assert sum(b[5] for b in bars) == sum(t[2] for t in ticks)
    filled = ohlc([(0, 1, 1), (10**6, 2, 1)], 10, fill_gaps=True)
    assert len(filled) == 100001
  hidden: true
  tags:
  - scale
  - time
complexity:
- op: ohlc
  time: O(n + G)
  space: O(B)
extensions:
- q: 'Level 2: make it streaming: a `BarBuilder` with `on_tick` that returns finished bars and `flush()`.'
  key_points:
  - Keep only the open bar as state; on_tick returns zero or more completed bars (including gap fills)
  - flush() emits the final partial bar once and is idempotent
  - Out-of-order ticks older than the open bar are rejected or routed to a late-data path
  kind: code
- q: Add per-bar VWAP and trade count, and support session boundaries (bars never straddle a session start).
  key_points:
  - Store sum(price*qty) and count in the bar record
  - Align bucket starts to the session open rather than epoch zero
  - Ticks outside the session are dropped or assigned to the pre/post bar explicitly
  kind: code
- q: 'Complexity: why is the one-pass approach linear, and what does gap filling cost?'
  key_points:
  - Each tick is touched once; the sorted-input assumption removes the need for hashing buckets
  - Gap filling costs O(G) extra output bars, which can dominate for sparse data, so make it opt-in
  - A dict of buckets also works at O(n) but loses the streaming/low-memory property
  kind: complexity
- q: 'Design: bars in production (event time vs processing time, watermarks).'
  key_points:
  - Bar boundaries use exchange event time; a watermark decides when a bar is final
  - Late ticks either amend a published bar (with a revision flag) or go to a correction stream
  - Exact int arithmetic for prices and volumes so bars reproduce bit-for-bit in replay
  kind: design
narration: []
state_aloud:
- Bars are [start, start + bar_secs); a tick at the boundary starts the next bar.
- Open/close follow input order including ties on timestamp.
- Empty bars are omitted unless fill_gaps; unsorted input and bar_secs <= 0 are errors.
walkthrough: |
  Standard OHLC aggregation (single pass over sorted ticks). Only the open bar is held in memory; bar start is ts - ts % bar_secs; optional gap filling replays the previous close as flat zero-volume bars. Source: standard formulation.
categories:
- trading
