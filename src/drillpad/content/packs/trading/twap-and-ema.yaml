extensions:
- q: 'Level 2: add a streaming `update(ts, price)` / `twap_since(start)` that needs no stored history
    for a fixed start.'
  key_points:
  - Keep running integral, last price and last ts; close the open segment on each update
  - twap_since(now) adds the open segment price * (now - last_ts) without mutating state
  - Reject non-increasing timestamps and queries before the first update
  kind: code
- q: Implement a time-decayed EMA where the decay depends on the gap between ticks.
  key_points:
  - alpha = 1 - exp(-dt / tau) so irregular gaps are handled correctly
  - dt == 0 and the first tick are special cases (no decay / seed)
  - 'Compare with the index-based EMA: they agree only for evenly spaced data'
  kind: code
- q: Complexity of queries and the effect of precomputation.
  key_points:
  - Naive per-query scan is O(n) per query and O(nq) total; prefix integrals make it O(log n) per query
  - Build is a single O(n) pass and O(n) memory
  - Integer integrals avoid cancellation; divide once at the end
  kind: complexity
- q: 'Design: where do TWAP and EMA signals live in a trading stack and what must be deterministic?'
  key_points:
  - Time comes from message timestamps so research, backtests and production agree
  - Streaming state is small enough to checkpoint and restore after a restart
  - Separate the numeric kernel from I/O so it can be unit-tested against golden vectors
  kind: design
narration: []
state_aloud:
- Price holds until the next update; last price holds forever; query before first update is invalid.
- start == end returns the price in effect at that instant.
- EMA seeds with the first value; span < 1 invalid. Float tolerance 1e-9.
walkthrough: |
  Standard formulation. TWAP is the integral of a piecewise-constant price divided by elapsed time; prefix integrals plus bisect answer each query in O(log n). EMA uses alpha = 2/(span+1) seeded with the first observation (the usual "adjust=False" convention). Source: standard formulation.
