id: fenwick-tree-range-sum
title: Fenwick Tree (BIT) Range Queries
bar_level: 3
target_minutes: 30
patterns:
- fenwick-tree
- prefix-sums
- bit-manipulation
- point-update-range-query
firm_tags:
- quant-hft
anki_queries: []
statement: |
  Implement `FenwickTree(values)` (binary indexed tree) over a list of ints, 0-indexed.

  - `add(i, delta)`: `values[i] += delta`.
  - `prefix_sum(count) -> int`: sum of the FIRST `count` elements (`values[0] + ... + values[count-1]`); `prefix_sum(0) == 0`
    and `prefix_sum(n)` is the total.
  - `range_sum(l, r) -> int`: sum of `values[l..r]` INCLUSIVE.
  - `IndexError` if `i`, `l` or `r` is outside `0..n-1` or `count` outside `0..n`; `ValueError` if `l > r`.

  Construction must be O(n) (not n separate updates), and `add`, `prefix_sum`, `range_sum` O(log n). A per-query O(n) sum over
  200k elements times 100k queries will time out.
starter: |
  class FenwickTree:
      def __init__(self, values):
          pass
hints:
- Store in t[i] (1-indexed) the sum of the last (i & -i) elements ending at i. Moving i += i & -i climbs
  to every node covering i; i -= i & -i walks a prefix query down.
- 'prefix_sum(count): while count > 0: sum += t[count]; count -= count & -count. range_sum(l, r) = prefix_sum(r+1)
  - prefix_sum(l).'
- 'O(n) build: copy values into t, then for each i push t[i] into its parent j = i + (i & -i) if j <=
  n.'
follow_ups:
- How would you support range add + point query?
- How would you find the smallest index with prefix >= target in O(log n)?
- How does this compare to a segment tree?
tests:
- name: prefix and range sums
  code: |
    f = FenwickTree([1, 2, 3, 4, 5])
    assert f.prefix_sum(0) == 0 and f.prefix_sum(1) == 1 and f.prefix_sum(5) == 15
    assert f.range_sum(1, 3) == 9 and f.range_sum(0, 4) == 15 and f.range_sum(2, 2) == 3
  hidden: false
  tags:
  - ordering
  - boundary
- name: point updates
  code: |
    f = FenwickTree([1, 2, 3, 4, 5])
    f.add(2, 10)
    assert f.range_sum(2, 2) == 13 and f.prefix_sum(3) == 16 and f.range_sum(0, 4) == 25
    f.add(0, -1); f.add(4, 5)
    assert f.range_sum(0, 4) == 29 and f.range_sum(0, 0) == 0
  hidden: false
  tags:
  - state-reuse
  - duplicate
- name: empty and single
  code: |
    f = FenwickTree([])
    assert f.prefix_sum(0) == 0
    g = FenwickTree([7])
    assert g.range_sum(0, 0) == 7
    g.add(0, 3)
    assert g.prefix_sum(1) == 10
  hidden: false
  tags:
  - empty
  - single
- name: negative values and zeros
  code: |
    f = FenwickTree([0, -5, 0, 5, -5])
    assert f.range_sum(0, 4) == -5 and f.range_sum(1, 3) == 0 and f.range_sum(4, 4) == -5
  hidden: false
  tags:
  - boundary
  - duplicate
- name: invalid indices
  code: |
    f = FenwickTree([1, 2, 3])
    for fn, args, exc in [(f.add, (3, 1), IndexError), (f.add, (-1, 1), IndexError), (f.prefix_sum, (4,), IndexError),
                          (f.prefix_sum, (-1,), IndexError), (f.range_sum, (0, 3), IndexError),
                          (f.range_sum, (2, 1), ValueError)]:
        try:
            fn(*args)
        except exc:
            pass
        else:
            raise AssertionError((fn.__name__, args))
    assert f.range_sum(0, 2) == 6
  hidden: true
  tags:
  - invalid
  - zero-capacity
- name: matches brute force after random updates
  code: |
    import random
    rng = random.Random(3)
    vals = [rng.randrange(-50, 50) for _ in range(300)]
    f = FenwickTree(vals)
    for _ in range(2000):
        if rng.random() < 0.5:
            i = rng.randrange(300); d = rng.randrange(-9, 10)
            vals[i] += d; f.add(i, d)
        else:
            l = rng.randrange(300); r = rng.randrange(l, 300)
            assert f.range_sum(l, r) == sum(vals[l:r + 1])
  hidden: true
  tags:
  - state-reuse
  - ordering
- name: 'scale: 200k elements, 200k operations'
  code: |
    n = 200000
    f = FenwickTree([i % 10 for i in range(n)])
    tot = 0
    for k in range(100000):
        f.add((k * 7919) % n, 1)
        l = (k * 31) % n
        tot += f.range_sum(l, min(n - 1, l + 1000))
    assert f.prefix_sum(n) == sum(i % 10 for i in range(n)) + 100000
    assert tot > 0
  hidden: true
  tags:
  - scale
complexity:
- op: build
  time: O(n)
  space: O(n)
- op: add
  time: O(log n)
  space: O(1)
- op: prefix_sum/range_sum
  time: O(log n)
  space: O(1)
extensions:
- q: 'Level 2: add `lower_bound(target)` returning the smallest count whose prefix sum >= target (non-negative
    values).'
  key_points:
  - Binary descent over powers of two using the tree array directly
  - O(log n) with no per-step prefix recomputation
  - Return n+1 or None when the total is less than the target
  kind: code
- q: 'Level 3: range-add / range-sum with two Fenwick trees.'
  key_points:
  - Maintain difference-array trees B1 and B2 so prefix(x) = B1(x)*x - B2(x)
  - Range add [l, r] updates both trees at l and r+1
  - All operations stay O(log n)
  kind: code
- q: Complexity compared to prefix sums and to a segment tree.
  key_points:
  - 'Plain prefix array: O(1) query but O(n) update; BIT balances both at O(log n)'
  - Segment tree supports more operations (min/max, lazy) at higher constants and 2n-4n memory
  - BIT uses n+1 integers and very tight loops, which is why it wins on speed for sums
  kind: complexity
- q: 'Design: where do Fenwick trees show up in trading systems?'
  key_points:
  - 'Order-book depth by price tick: cumulative quantity up to a price and quantile-by-volume queries'
  - Counting inversions or rank statistics on streams of bounded integers
  - Per-symbol structures sized by tick range, rebuilt at session start
  kind: design
narration: []
state_aloud:
- Tree is 1-indexed internally but the API is 0-indexed; prefix_sum takes a count.
- range_sum is inclusive; invalid indices raise IndexError; l > r is ValueError.
- O(n) construction; add/query O(log n).
walkthrough: |
  Standard Fenwick tree / BIT with the linear-time build. The lowbit trick (i & -i) drives both update and query. Source: standard formulation.
