- name: thousands of pages
  tags:
  - scale
  hidden: true
  code: |
    def raises(fn, *a, **k):
        try:
            fn(*a, **k)
        except ApiError:
            return True
        return False

    def make_api(pages, script=None):
        # pages: {cursor: (items, next)}; script: {cursor: [responses to return first]}
        calls = []
        script = {k: list(v) for k, v in (script or {}).items()}
        def call(cursor):
            calls.append(cursor)
            if script.get(cursor):
                return script[cursor].pop(0)
            items, nxt = pages[cursor]
            return 200, {"items": items, "next": nxt}
        return call, calls

    pages = {}
    per = 100
    npages = 4000
    for p in range(npages):
        cur = None if p == 0 else "c%d" % p
        nxt = None if p == npages - 1 else "c%d" % (p + 1)
        pages[cur] = ([{"id": p * 95 + i} for i in range(per)], nxt)
    call, _ = make_api(pages)
    out = fetch_all(call, lambda s: None)
    assert len(out) == 95 * (npages - 1) + 100
    assert out[0]["id"] == 0 and out[-1]["id"] == 95 * (npages - 1) + 99
complexity:
- op: fetch_all
  time: O(n + p)
  space: O(n)
extensions:
- q: 'Level 2: add proactive pacing: at most R requests per W seconds using an injected clock, so 429s
    are rare.'
  kind: code
  key_points:
  - Token bucket or sliding window of request timestamps with the injected now()
  - Sleep only the shortfall, not a fixed interval
  - A 429 should also reduce the client's pace (adaptive)
- q: 'Level 3: make it a generator that yields pages lazily and can resume from a saved cursor.'
  kind: code
  key_points:
  - Expose (items, next_cursor) per page and let the caller persist next_cursor
  - Dedupe state must survive a resume (persist ids or rely on idempotent downstream writes)
  - Retry logic stays inside the generator so consumers never see transient errors
- q: How does this client behave well in a fleet of many workers sharing one API quota?
  kind: design
  key_points:
  - Full jitter on backoff to avoid thundering herds when the limit resets
  - Central or per-worker token buckets and a shared retry budget
  - Respect Retry-After, treat 5xx and 429 differently, and cap total elapsed time with a deadline
- q: What is the cost and where would a naive version blow up?
  kind: complexity
  key_points:
  - Time O(n + p) for n items and p pages; set lookups for dedupe are O(1)
  - Space O(n) for results and ids; using `in list` for dedupe or list concatenation per page is O(n^2)
  - Retries add at most max_retries extra calls per page
narration: []
state_aloud:
- 'Classify errors first: 429 and 5xx are retryable, other 4xx are permanent and must fail fast.'
- Retry the SAME cursor; the failure counter is per page and resets on success.
- Respect retry_after exactly when valid; otherwise capped exponential backoff.
- Dedupe by id because retries and shifting cursors repeat items; guard against cursor loops.
- Sleep and transport are injected so I can test without real time.
walkthrough: |
  Outer while loop requests the current cursor; an inner loop calls the API, handling 200 (extend results, dedupe by id with a set, advance the cursor, detect repeated cursors), 429 and 5xx (increment the page's failure counter, raise ApiError when it exceeds max_retries, sleep retry_after or capped exponential backoff, then retry the same cursor) and any other status (raise). Results go into a single list and a set of seen ids so cost is linear. Source: standard formulation.
