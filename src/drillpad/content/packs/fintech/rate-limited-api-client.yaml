    pages = {None: ([{"id": 1, "v": "a"}, {"id": 2}], "n"), "n": ([{"id": 2, "v": "dup"}, {"id": 3}, {"id": 1, "v": "dup"}], None)}
    call, _ = make_api(pages)
    out = fetch_all(call, lambda s: None)
    assert out == [{"id": 1, "v": "a"}, {"id": 2}, {"id": 3}]
- name: 429 honours retry_after and 5xx backs off exponentially
  tags:
  - time
  - boundary
  code: |
    def raises(fn, *a, **k):
        try:
            fn(*a, **k)
        except ApiError:
            return True
        return False

    def make_api(pages, script=None):
        # pages: {cursor: (items, next)}; script: {cursor: [responses to return first]}
        calls = []
        script = {k: list(v) for k, v in (script or {}).items()}
        def call(cursor):
            calls.append(cursor)
            if script.get(cursor):
                return script[cursor].pop(0)
            items, nxt = pages[cursor]
            return 200, {"items": items, "next": nxt}
        return call, calls

    pages = {None: ([{"id": 1}], None)}
    script = {None: [(429, {"retry_after": 7}), (503, {}), (500, {}), (429, {}), (200, {"items": [{"id": 1}], "next": None})]}
    call, calls = make_api(pages, script)
    sleeps = []
    out = fetch_all(call, sleeps.append, base_delay=2, max_delay=10)
    assert out == [{"id": 1}]
    assert sleeps == [7, 4, 8, 10], "retry_after exact; then 2*2**1, 2*2**2, capped at 10"
    assert len(calls) == 5
