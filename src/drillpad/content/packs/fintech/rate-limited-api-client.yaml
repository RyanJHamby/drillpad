id: rate-limited-api-client
title: Rate-limited API Client with Pagination
bar_level: 2
target_minutes: 25
patterns:
- pagination
- retry
- exponential-backoff
- dedupe
- injected-clock
firm_tags:
- distsys
categories:
- fintech
anki_queries: []
statement: |
  Write `fetch_all(call, sleep, max_retries=5, base_delay=1, max_delay=30)`, a client that downloads every
  item from a paginated, rate-limited HTTP API. Both the transport and the clock are injected so tests are
  deterministic and instant.

  * `call(cursor)` performs one request and returns `(status, body)`. The first request uses `cursor=None`.
    * `status == 200`: `body = {"items": [ {"id": ..., ...}, ...], "next": cursor_or_None}`.
    * `status == 429` (rate limited): `body = {"retry_after": seconds}` (the key may be missing).
    * `status` in 500-599: transient server error (body ignored).
    * any other status (e.g. 400, 401, 404): permanent error.
  * `sleep(seconds)` waits; the client calls it instead of `time.sleep`.
  * Walk the pages by following `next` until it is `None`. Return all items in order, de-duplicated by their
    `"id"` (first occurrence wins), because retries and moving cursors can repeat items across pages.
  * Retry rules: a 429 or 5xx response is retried for the SAME cursor. Count consecutive failures for the
    current page; the counter resets after any success. If the counter exceeds `max_retries` raise `ApiError`.
    Wait before each retry: for 429 with an int `retry_after >= 0`, sleep exactly `retry_after`; otherwise
    (5xx, or 429 without it) sleep `min(max_delay, base_delay * 2 ** (failures - 1))` where `failures` is the
    count including this one.
  * A permanent error status raises `ApiError` immediately (no sleep, no retry).
  * If a `next` cursor equals one that was already requested, raise `ApiError` (cursor loop) instead of
    looping forever.

  `ApiError` is an `Exception` subclass defined by you.
starter: |
  class ApiError(Exception):
      pass


  def fetch_all(call, sleep, max_retries=5, base_delay=1, max_delay=30):
      pass
hints:
- Structure it as an outer loop over pages and an inner retry loop for one page; keep the failure counter
  local to the page.
- Keep a set of seen ids for deduping and a set of requested cursors for loop detection; append to one
  result list instead of concatenating lists.
- Distinguish retryable (429, 5xx) from permanent (other 4xx) before writing the retry loop; honour retry_after
  exactly when it is given.
follow_ups:
- Add jitter to the backoff. Why does it matter when many clients share a limit?
- How would you pace requests proactively (token bucket) to avoid ever receiving a 429?
- How do you resume after a crash halfway through a long export?
tests:
- name: follows cursors and returns items in order
  tags:
  - ordering
  - boundary
  code: |
    def raises(fn, *a, **k):
        try:
            fn(*a, **k)
        except ApiError:
            return True
        return False

    def make_api(pages, script=None):
        # pages: {cursor: (items, next)}; script: {cursor: [responses to return first]}
        calls = []
        script = {k: list(v) for k, v in (script or {}).items()}
        def call(cursor):
            calls.append(cursor)
            if script.get(cursor):
                return script[cursor].pop(0)
            items, nxt = pages[cursor]
            return 200, {"items": items, "next": nxt}
        return call, calls

    pages = {None: ([{"id": 1}, {"id": 2}], "p2"), "p2": ([{"id": 3}], "p3"), "p3": ([{"id": 4}], None)}
    call, calls = make_api(pages)
    sleeps = []
    out = fetch_all(call, sleeps.append)
    assert [x["id"] for x in out] == [1, 2, 3, 4]
    assert calls == [None, "p2", "p3"] and sleeps == []
- name: dedupes ids across pages, first wins
  tags:
  - duplicate
  - ordering
  code: |
    def raises(fn, *a, **k):
