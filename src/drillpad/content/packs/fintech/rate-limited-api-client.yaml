- name: gives up after max_retries and on permanent errors
  tags:
  - invalid
  - zero-capacity
  code: |
    def raises(fn, *a, **k):
        try:
            fn(*a, **k)
        except ApiError:
            return True
        return False

    def make_api(pages, script=None):
        # pages: {cursor: (items, next)}; script: {cursor: [responses to return first]}
        calls = []
        script = {k: list(v) for k, v in (script or {}).items()}
        def call(cursor):
            calls.append(cursor)
            if script.get(cursor):
                return script[cursor].pop(0)
            items, nxt = pages[cursor]
            return 200, {"items": items, "next": nxt}
        return call, calls

    call, calls = make_api({None: ([], None)}, {None: [(500, {})] * 10})
    sleeps = []
    assert raises(fetch_all, call, sleeps.append, max_retries=3, base_delay=1)
    assert len(calls) == 4 and sleeps == [1, 2, 4], "1 try + 3 retries; no sleep after giving up"
    call2, calls2 = make_api({None: ([], None)}, {None: [(404, {})]})
    s2 = []
    assert raises(fetch_all, call2, s2.append)
    assert calls2 == [None] and s2 == []
    call3, _ = make_api({None: ([], None)}, {None: [(401, {})]})
    assert raises(fetch_all, call3, lambda s: None)
