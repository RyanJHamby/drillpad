id: currency-conversion-graph
title: Currency Conversion Graph
bar_level: 2
target_minutes: 25
patterns:
- graph
- bellman-ford
- dp-by-hops
- exact-arithmetic
firm_tags: []
categories:
- fintech
anki_queries: []
statement: |
  Given quoted exchange rates, find the best (largest) conversion factor from one currency to another when a
  direct quote may be missing or worse than a multi-leg route.

  `rates` is a list of `(from_ccy, to_ccy, rate)` where `rate` is a string such as `"0.92"` or `"3/7"` (exact
  decimal or fraction; never a float). Parse it with `fractions.Fraction`; a float, or a rate <= 0, raises
  `ValueError`.

  Graph rules:
  * Every quote `(a, b, r)` gives a directed edge `a -> b` with factor `r`, and a derived reverse edge
    `b -> a` with factor `1/r`.
  * An explicit quote always overrides a derived reverse edge for the same direction. If the same directed pair
    is quoted several times, the LAST one wins.

  `best_rate(rates, src, dst, max_hops=3)` returns the maximum product of factors over all walks from `src` to
  `dst` that use at most `max_hops` legs (edges), as a `Fraction`. The empty walk counts, so `best_rate(.., x, x)`
  is at least `Fraction(1)`; if rates are inconsistent (an arbitrage cycle), a walk that loops through the cycle
  may beat 1. Return `None` if `src` or `dst` is not in the graph or `dst` is not reachable within `max_hops`.
  `max_hops < 1` raises `ValueError`.

  `convert(rates, src, dst, amount, max_hops=3)` converts an integer `amount` (minor units, >= 0, else
  `ValueError`) using the best rate and returns an int rounded half up: `floor((2*amount*num + den) / (2*den))`
  for the rate `num/den`. Return `None` when there is no route. Assume all currencies share the same minor-unit
  scale.
starter: |
  from fractions import Fraction


  def best_rate(rates, src, dst, max_hops=3):
      pass


  def convert(rates, src, dst, amount, max_hops=3):
      pass
hints:
- 'Build the directed edge map first: derive every reverse edge, then let explicit quotes overwrite them.'
- 'Run hop-limited relaxation (Bellman-Ford style): best[v] after k rounds is the best product using at
  most k legs; each round reads the previous round''s table.'
- Use Fraction throughout so products are exact; round only once, in convert.
follow_ups:
- How do you detect arbitrage? (take -log of the rates and look for a negative cycle)
- If you needed unlimited hops without arbitrage, what algorithm replaces the hop DP?
- How would you answer many queries quickly on a static rate table (Floyd-Warshall)?
tests:
- name: direct, reverse and multi leg
  tags:
  - single
  - boundary
  code: |
    from fractions import Fraction

    rates = [("USD", "EUR", "0.9"), ("EUR", "GBP", "0.8"), ("USD", "JPY", "150")]
    assert best_rate(rates, "USD", "EUR") == Fraction(9, 10)
    assert best_rate(rates, "EUR", "USD") == Fraction(10, 9), "derived reverse edge"
    assert best_rate(rates, "USD", "GBP") == Fraction(18, 25)
    assert best_rate(rates, "GBP", "JPY") == Fraction(25, 18) * 150
    assert best_rate(rates, "USD", "USD") == 1
- name: a cheaper indirect route beats a bad direct quote
  tags:
  - boundary
  - ordering
  code: |
    from fractions import Fraction

    rates = [("A", "B", "1"), ("A", "C", "2"), ("C", "B", "2")]
    assert best_rate(rates, "A", "B") == 4
    assert best_rate(rates, "A", "B", max_hops=1) == 1
    assert best_rate(rates, "B", "A", max_hops=1) == 1
    assert best_rate(rates, "B", "A", max_hops=2) == Fraction(1, 1)
    assert best_rate(rates, "B", "A", max_hops=3) == 1
- name: unreachable and unknown currencies
  tags:
  - empty
  - invalid
  code: |
    from fractions import Fraction

    rates = [("A", "B", "2"), ("C", "D", "3")]
    assert best_rate(rates, "A", "D") is None
    assert best_rate(rates, "A", "Z") is None
    assert best_rate(rates, "Z", "A") is None
    assert best_rate([], "A", "B") is None
    assert best_rate(rates, "A", "B") == 2
- name: explicit quotes override derived reverse and later duplicates win
  tags:
  - duplicate
  - ordering
  code: |
    from fractions import Fraction

    rates = [("A", "B", "2"), ("B", "A", "1/3"), ("A", "B", "5")]
    assert best_rate(rates, "A", "B", max_hops=1) == 5
    assert best_rate(rates, "B", "A", max_hops=1) == Fraction(1, 3), "explicit reverse beats 1/5"
- name: exact arithmetic and convert rounding
  tags:
  - boundary
  - invalid
  code: |
    from fractions import Fraction

    rates = [("USD", "EUR", "0.92")]
    assert convert(rates, "USD", "EUR", 1000) == 920
    assert convert(rates, "USD", "EUR", 1) == 1, "0.92 rounds half up to 1"
    assert convert([("A", "B", "1/2")], "A", "B", 3) == 2, "1.5 rounds up to 2"
    assert convert([("A", "B", "1/2")], "A", "B", 5) == 3, "2.5 rounds up to 3, not banker's 2"
    assert convert(rates, "USD", "XXX", 5) is None
    assert convert(rates, "USD", "EUR", 0) == 0
    assert best_rate([("A", "B", "0.1")], "A", "B") == Fraction(1, 10), "no float error"
- name: invalid inputs
  tags:
  - invalid
  - zero-capacity
  hidden: true
  code: |
    from fractions import Fraction

    for bad in (0.5, "0", "-1", "-0.5"):
        try:
            best_rate([("A", "B", bad)], "A", "B")
            assert False
        except ValueError:
            pass
    try:
        best_rate([("A", "B", "2")], "A", "B", max_hops=0)
        assert False
    except ValueError:
        pass
    try:
        convert([("A", "B", "2")], "A", "B", -1)
        assert False
    except ValueError:
        pass
- name: arbitrage loops are bounded by max_hops
  tags:
  - boundary
  - time
  hidden: true
  code: |
    from fractions import Fraction

    rates = [("A", "B", "2"), ("B", "C", "2"), ("C", "A", "1")]
    assert best_rate(rates, "A", "A", max_hops=3) == 4, "A->B->C->A is 2*2*1"
    assert best_rate(rates, "A", "A", max_hops=2) == 1, "reverse legs undo each other; empty walk wins"
    assert best_rate(rates, "A", "A", max_hops=6) == 16
- name: dense graph with many currencies
  tags:
  - scale
  hidden: true
  code: |
    from fractions import Fraction

    n = 250
    price = [1 + (i * 37) % 997 for i in range(n)]
    rates = [("C%d" % i, "C%d" % j, "%d/%d" % (price[i], price[j])) for i in range(n) for j in range(i + 1, n)]
    r = best_rate(rates, "C0", "C%d" % (n - 1), max_hops=4)
    assert r == Fraction(price[0], price[n - 1])
    assert convert(rates, "C3", "C200", 10**6, max_hops=4) == (2 * 10**6 * price[3] + price[200]) // (2 * price[200])
complexity:
- op: best_rate
  time: O(k * E)
  space: O(V + E)
extensions:
- q: 'Level 2: return the route too (list of currencies), with deterministic tie-breaking.'
  kind: code
  key_points:
  - Store a parent pointer per hop layer, not one global parent, since a hop-limited DP overwrites
  - Break ties by fewer hops then lexicographic path
  - Reconstruct by walking the layers backwards
- q: 'Level 3: add bid/ask spreads so each leg costs a fee in basis points, applied with integer arithmetic.'
  kind: code
  key_points:
  - Model the fee as an exact Fraction multiplier per leg
  - Round once at the end to avoid compounding rounding
  - Reverse edges use the ask, forward edges the bid
- q: How would a production FX service serve this and handle stale quotes?
  kind: design
  key_points:
  - Snapshot of the rate table with a version and TTL per quote; reject routes using stale legs
  - Precompute all-pairs best rates (Floyd-Warshall) per snapshot for O(1) lookup
  - Detect arbitrage with -log weights and a negative-cycle check, and alert instead of trading on it
- q: Compare a DFS over simple paths to the hop-limited DP.
  kind: complexity
  key_points:
  - DFS over simple paths is exponential, roughly V^k on dense graphs
  - The hop DP is O(k*E) because each round relaxes every edge once
  - Without a hop bound and with arbitrage the 'best' product is unbounded, so a bound or simple-path
    rule is required
narration: []
state_aloud:
- 'Never floats for money or rates: Fraction for rates, integer minor units for amounts, round half up
  once at the end.'
- Ask whether reverse edges exist and whether explicit quotes override them.
- '''Best'' is ill-defined with arbitrage cycles unless I bound the walk (max hops) or restrict to simple
  paths; say which.'
- Hop-limited DP must read the previous round's table, otherwise it silently allows extra hops.
- Unknown currency or unreachable target returns None rather than raising.
walkthrough: |
  Build a dict of directed edges: first derive every reverse edge as 1/r, then overwrite with explicit quotes in input order (so the last duplicate wins). Then run max_hops rounds of relaxation over a copy of the table: for each edge (a, b, r) with a already reached, candidate = best[a] * r from the previous round. The empty walk seeds best[src] = 1. convert multiplies the integer amount by the exact Fraction and rounds half up in integers. Source: standard formulation.
