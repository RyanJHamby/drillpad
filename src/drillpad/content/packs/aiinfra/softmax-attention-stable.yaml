id: softmax-attention-stable
title: Numerically Stable Softmax + Attention
bar_level: 3
target_minutes: 35
patterns:
- softmax
- attention
- numerical-stability
- matrix-math
- causal-mask
firm_tags:
- ai-infra
anki_queries: []
statement: |
  Implement softmax and single-head scaled dot-product attention with plain Python lists (no numpy).

  - `softmax(xs) -> list[float]`: `exp(x_i) / sum(exp(x_j))`, computed so it never overflows:
    subtract `max(xs)` first. `[]` returns `[]`. An entry of `-inf` gets probability exactly `0.0`
    (that is how masked positions are expressed). If every entry is `-inf`, raise `ValueError`.
  - `attention(Q, K, V, causal=False) -> list[list[float]]`: `Q` is `n x d`, `K` is `m x d`, `V` is
    `m x dv` (lists of lists). For each query row `i`: scores `s_j = (q_i . k_j) / sqrt(d)`, weights
    `softmax(s)`, output `sum_j w_j * v_j`. With `causal=True` (requires `n == m`) query `i` may only
    attend to keys `j <= i`; the masked scores must be excluded (or set to `-inf`) before softmax.
    `n == 0` returns `[]`.
    `ValueError` if `len(V) != len(K)`, `K` is empty while `Q` is not, row lengths of Q and K differ, or
    `causal=True` with `n != m`.

  Compare floats with a tolerance. Both functions must be linear-time per row in the number of keys (do
  not recompute the normalising sum for every element).

  Example: `softmax([1000.0, 1000.0, 999.0])` must work (the naive `math.exp(1000.0)` overflows).
starter: |
  def softmax(xs):
      pass


  def attention(Q, K, V, causal=False):
      pass
hints:
- softmax(x) == softmax(x - c) for any constant c; choose c = max(x) so the largest exponent is exp(0)
  = 1.
- Compute the exponentials once, sum them once, then divide. The one-liner that sums inside the comprehension
  is O(n^2).
- 'Causal masking: score only keys[:i+1] instead of building a full matrix and masking, it is both simpler
  and faster.'
follow_ups:
- Online (streaming) softmax with a running max and sum, as used by FlashAttention.
- Multi-head attention with a projection per head.
- Add a key-padding mask and an additive bias such as ALiBi.
tests:
- name: softmax basics
  code: |
    def close(a, b, tol=1e-9):
        if isinstance(a, (list, tuple)):
            return len(a) == len(b) and all(close(x, y, tol) for x, y in zip(a, b))
        return abs(a - b) <= tol
    import math
    assert close(softmax([0.0, 0.0]), [0.5, 0.5])
    assert close(softmax([1.0]), [1.0])
    e = math.e
    assert close(softmax([1.0, 0.0]), [e / (e + 1), 1 / (e + 1)])
    assert softmax([]) == []
  hidden: false
  tags:
  - boundary
  - single
