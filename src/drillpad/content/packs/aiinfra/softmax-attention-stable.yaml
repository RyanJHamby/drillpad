extensions:
- q: 'Level 2: implement online softmax over a stream of scores in one pass (running max m and running
    sum s), and use it to compute an attention row without storing all scores.'
  kind: code
  key_points:
  - 'On a new x: m'' = max(m, x); s = s * exp(m - m'') + exp(x - m''); the output accumulator is rescaled
    by the same factor'
  - Initial m = -inf, s = 0; guard the first element so exp(-inf - -inf) is not NaN
  - Final result equals the two-pass version up to rounding
- q: Why does FlashAttention-style tiling rely on the online softmax, and what is the memory benefit?
  kind: design
  key_points:
  - 'The full n x n score matrix never needs to exist in slow memory: process K/V in tiles and keep per-row
    running max, sum and output'
  - Memory goes from O(n^2) to O(n) per head for the intermediate scores
  - The rescaling trick is what makes tiles composable
- q: Why divide by sqrt(d), and what goes wrong in low precision?
  kind: reasoning
  key_points:
  - Dot products of d random unit-variance components have variance d, so large d saturates softmax and
    kills gradients
  - In fp16/bf16 exp overflows quickly, so max-subtraction and accumulating in fp32 matter
  - Fully masked rows give 0/0; define the behaviour (error or zeros) explicitly
- q: State time and space of one attention call and of softmax; where does a naive version blow up?
  kind: complexity
  key_points:
  - O(n * m * d) for scores plus O(n * m * dv) for the weighted sum
  - Scratch space is O(m) per row when rows are processed one at a time, O(n * m) if the score matrix
    is materialised
  - A softmax that recomputes sum(exp) per element is O(n^2) per row
narration: []
state_aloud:
- Subtract the max before exponentiating; say why (overflow, shift invariance).
- -inf entries mean masked; an all-masked row is an error here.
- Scale by 1/sqrt(d) where d is the key dimension.
- Causal needs square shapes in this problem; validate shapes up front.
- 'Floats: compare with a tolerance.'
walkthrough: |
  softmax subtracts the row maximum, exponentiates once, sums once and divides; -inf entries naturally become exp(-inf) = 0 and an all -inf row is rejected before it can produce NaN. attention loops over queries, scores each against the visible keys (all of them, or the first i+1 when causal), scales by 1/sqrt(d), applies softmax and accumulates the weighted V rows. Slicing the keys for causal attention avoids materialising a mask. Standard formulation; the stability argument is the shift-invariance of softmax.
