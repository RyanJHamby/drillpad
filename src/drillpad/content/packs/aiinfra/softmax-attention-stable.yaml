- name: softmax over 20k logits and attention over 64 positions
  code: |
    def close(a, b, tol=1e-9):
        if isinstance(a, (list, tuple)):
            return len(a) == len(b) and all(close(x, y, tol) for x, y in zip(a, b))
        return abs(a - b) <= tol
    import random
    rng = random.Random(2)
    xs = [rng.uniform(-50, 50) for _ in range(20000)]
    p = softmax(xs)
    assert abs(sum(p) - 1.0) < 1e-9 and p.index(max(p)) == xs.index(max(xs))
    Q = [[rng.random() for _ in range(32)] for _ in range(64)]
    out = attention(Q, Q, Q, causal=True)
    assert len(out) == 64 and len(out[0]) == 32
    assert close(out[0], Q[0], 1e-12)
    big = [1e4 * rng.random() for _ in range(300000)]
    assert abs(sum(softmax(big)) - 1.0) < 1e-9
  hidden: true
  tags:
  - scale
