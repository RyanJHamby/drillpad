extensions:
- q: 'Level 2: add a repetition/frequency penalty: subtract `alpha * count[token]` from the logit of tokens
    already generated. Where does it sit in the pipeline?'
  kind: code
  key_points:
  - It modifies logits before temperature and filtering, so it changes which tokens survive top-k/top-p
  - Counts come from the generated (and optionally prompt) token history, kept in a dict
  - Apply it sparsely (only touched tokens) so it does not cost O(V) per step
- q: How do you make sampling reproducible per request when many requests share a batch?
  kind: design
  key_points:
  - One random.Random(seed) per request, never a global stream, so batch composition does not change results
  - Consume exactly one draw per token (as here) so replays line up
  - Log the seed and parameters with the request; note GPU nondeterminism can still change logits
- q: Compare top-k and top-p. When does each fail?
  kind: reasoning
  key_points:
  - 'Top-k keeps a fixed count: too many tokens when the model is confident, too few when the distribution
    is flat'
  - Top-p adapts to the distribution but can keep a huge tail when it is flat; combine both with a cap
  - Low temperature already concentrates mass, so filters matter more at high temperature
- q: Cost per sampled token with a vocabulary of V and what dominates at V = 100k.
  kind: complexity
  key_points:
  - O(V log k) with a heap for top-k selection, O(V log V) for a full sort when only top_p is used
  - The softmax over the survivors is O(k); over the whole vocabulary it would be O(V) exponentials
  - Space O(k) for the candidate list
narration: []
state_aloud:
- 'Order of operations: temperature, top-k, top-p; say it before coding.'
- Temperature 0 means greedy; avoid dividing by zero.
- top_p keeps at least one token (the cumulative check happens after adding).
- Ties in logits resolve to the lower index so results are deterministic.
- One rng.random() draw per sample.
walkthrough: |
  candidates picks the surviving indices first (heapq.nlargest when top_k is set, otherwise a stable descending sort), softmaxes only those scaled logits, applies the nucleus cut on the descending cumulative sum and renormalises. Selecting before exponentiating is valid because softmax restricted to a subset equals the renormalised subset of the full softmax. sample consumes a single rng.random() and walks the cumulative distribution. Standard top-k/top-p formulation; no source note applies.
