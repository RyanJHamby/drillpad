id: credit-tracker-expiring
title: Credit tracker with expiring credits (earliest-expiry-first)
bar_level: 3
target_minutes: 25
patterns:
- min-heap
- lazy-expiry
- partial-consumption
- atomic-update
firm_tags:
- ai-infra
anki_queries: []
statement: |
  Implement `CreditTracker`, a billing-style tracker of credit grants that expire.
  Times are numbers and the `now` passed to successive calls never decreases.

  - `add_credit(start, end, amount)`: a grant usable in `[start, end)` (start inclusive, end
    exclusive). `ValueError` if `end <= start` or `amount <= 0`.
  - `check_credit(now) -> int`: total remaining credit usable at `now` (started and not expired).
  - `subtract_credit(now, amount)`: spend `amount` from credits usable at `now`, always taking
    from the EARLIEST-EXPIRING credit first (ties: the one added first), spilling over into the
    next credit as needed. `ValueError` if `amount <= 0` or the usable total is less than
    `amount`; in that case nothing is consumed. A credit that has not started yet is never spent.
starter: |
  class CreditTracker:
      def __init__(self):
          pass
hints:
- Min-heap keyed by (end, insertion order) holding mutable remaining amounts.
- Expire lazily on every call by popping while end <= now; no timer thread.
- 'A credit with start > now sits at the top of the heap but cannot be spent: set it aside and push it
  back.'
follow_ups:
- What if queries can go back in time? (do not pop destructively; keep a sorted list and compute per query)
- Add credit_expiring_within(now, window).
- 'Add refunds (negative amounts): which credit gets the refund?'
- How would you persist grants and reconcile against an invoice?
tests:
- name: add and check with half-open validity
  tags:
  - empty
  - single
  - time
  - boundary
  code: |
    c = CreditTracker()
    assert c.check_credit(0) == 0
    c.add_credit(10, 20, 100)
    assert c.check_credit(9) == 0, "not started"
    assert c.check_credit(10) == 100, "start is inclusive"
    assert c.check_credit(19) == 100
    assert c.check_credit(20) == 0, "end is exclusive"
    c.add_credit(0, 100, 5)
    assert c.check_credit(100) == 0
- name: earliest-expiring credit is consumed first
  tags:
  - ordering
  - time
  code: |
    c = CreditTracker()
    c.add_credit(0, 100, 50)    # B, long-lived (added first)
    c.add_credit(0, 10, 5)      # A, expires soon
    c.subtract_credit(1, 3)
    assert c.check_credit(1) == 52
    assert c.check_credit(10) == 50, "A's remaining 2 expired; B untouched by the earlier subtract"
    c.subtract_credit(10, 50)
    assert c.check_credit(10) == 0
- name: insufficient credit raises and changes nothing
  tags:
  - invalid
  - state-reuse
  code: |
    c = CreditTracker()
    c.add_credit(0, 10, 4); c.add_credit(0, 20, 4)
    try:
        c.subtract_credit(1, 9)
    except ValueError:
        pass
    else:
        raise AssertionError("expected ValueError")
    assert c.check_credit(1) == 8
    c.subtract_credit(1, 8)
    assert c.check_credit(1) == 0
    try:
        c.subtract_credit(1, 1)
    except ValueError:
        pass
    else:
        raise AssertionError("expected ValueError on empty")
- name: future-dated credit cannot be spent early
  tags:
  - time
  - boundary
  code: |
    c = CreditTracker()
    c.add_credit(5, 8, 10)       # expires first but not yet started at t=1
    c.add_credit(0, 50, 3)
    assert c.check_credit(1) == 3
    c.subtract_credit(1, 3)
    try:
        c.subtract_credit(1, 1)
    except ValueError:
        pass
    else:
        raise AssertionError("future credit must be unusable")
    assert c.check_credit(5) == 10
    c.subtract_credit(7, 10)
- name: spend spans several credits
  tags:
  - boundary
  - duplicate
  hidden: true
  code: |
    c = CreditTracker()
    for end in (30, 10, 20, 10):
        c.add_credit(0, end, 5)
    c.subtract_credit(0, 12)
    assert c.check_credit(0) == 8
    assert c.check_credit(10) == 8, "both end=10 credits were consumed first, then 2 from end=20"
    c.subtract_credit(10, 8)
    assert c.check_credit(10) == 0
- name: rejects non-positive and malformed input
  tags:
  - invalid
  - zero-capacity
  hidden: true
  code: |
    c = CreditTracker()
    for args in [(0, 10, 0), (0, 10, -5), (5, 5, 1), (9, 3, 1)]:
        try:
            c.add_credit(*args)
        except ValueError:
            pass
        else:
            raise AssertionError(args)
    c.add_credit(0, 10, 5)
    for amt in (0, -1):
        try:
            c.subtract_credit(1, amt)
        except ValueError:
            pass
        else:
            raise AssertionError(amt)
    assert c.check_credit(1) == 5
- name: many credits stay fast
  tags:
  - scale
  - ordering
  hidden: true
  code: |
    c = CreditTracker()
    n = 50000
    for i in range(n):
        c.add_credit(0, 1000 + (i * 31) % 997, 1)
    for t in range(n // 2):
        c.subtract_credit(t % 500, 1)
    assert c.check_credit(500) == n // 2
    assert c.check_credit(5000) == 0
complexity:
- op: add_credit
  time: O(log n)
  space: O(n)
- op: subtract_credit
  time: O(k log n)
  space: O(k)
- op: check_credit
  time: O(n)
  space: O(1)
extensions:
- q: 'Level 2: add credit_expiring_within(now, window) and a refund(now, amount) operation.'
  kind: code
  key_points:
  - expiring_within sums usable credit with now < end <= now + window
  - A refund creates (or restores) credit with a defined expiry; state which one and why
  - 'Keep atomicity: a failed operation leaves the heap unchanged'
- q: 'Level 3: support queries with arbitrary (non-monotonic) times.'
  kind: code
  key_points:
  - Do not destructively pop expired credits; keep a sorted list/segment structure and compute usable
    credit per query
  - Track consumption as events so a past-time query reconstructs state, or restrict spends to non-decreasing
    time
  - 'State the cost: O(n) or O(log n) per query depending on the structure'
- q: How would this be built as a production billing component?
  kind: design
  key_points:
  - Immutable grant and consumption ledger, balances derived or cached
  - Idempotency keys on spend requests
  - 'Concurrency: serialize per customer; decide spend order policy (earliest-expiry first) explicitly'
- q: Why is subtract O(k log n) and check O(n)?
  kind: complexity
  key_points:
  - Each touched credit costs a heap pop/push; k is the number of credits touched or expired
  - check scans all live credits to sum started ones; maintain a running total if it is hot
  - 'Lazy expiry amortizes: each credit is popped at most once for expiry'
narration: []
state_aloud:
- 'Interval is half-open: start inclusive, end exclusive.'
- Which credit is consumed matters for later expiry, so I decrement the specific heap entry, not a single
  balance.
- A failed spend must be atomic; a not-yet-started credit is not spendable.
- Assuming non-decreasing time lets me expire destructively; I will say so.
walkthrough: |
  Credits sit in a min-heap ordered by (end, insertion sequence) as mutable [end, seq, start, remaining] records. Every call first lazily pops credits whose end has passed. subtract_credit pops credits in expiry order, skipping (and later restoring) any that have not started, consuming from each until the amount is covered and pushing back a partially used credit. If the total is insufficient it restores every touched credit's remaining amount and re-pushes them, so the spend is atomic. check_credit sums remaining amounts over started credits. Source: standard formulation.
categories:
- ai-infra
