complexity:
- op: beam_search
  time: O(T * B * V log B)
  space: O(B * T)
extensions:
- q: 'Level 2: add length normalisation. Rank finished and unfinished hypotheses by score / len(tokens)
    ** alpha and stop early when the best finished hypothesis cannot be beaten.'
  kind: code
  key_points:
  - Keep a separate list of finished hypotheses; they leave the beam and do not occupy beam slots
  - 'Early stop: with alpha = 0 and log-probs <= 0, once the best finished score is >= the best live score
    no live hypothesis can overtake it'
  - With alpha > 0 the bound is not exact, so state the heuristic
- q: How does beam search interact with the KV cache and with continuous batching?
  kind: design
  key_points:
  - Each beam is a sequence; beams that share a prefix should share KV blocks via copy-on-write (see paged-kv-cache-allocator
    fork)
  - Beam width multiplies the decode batch size, so one request with beam 8 costs about 8 slots
  - Reordering beams each step means block tables are re-pointed rather than copied
- q: When is beam search a poor choice for open-ended LLM generation, and what do chat systems use instead?
  kind: reasoning
  key_points:
  - It favours high-probability, repetitive text and shorter sequences without normalisation; good for
    translation, poor for creative text
  - Sampling with temperature, top-k and top-p is the usual choice for chat (see top-p-top-k-sampling)
  - Beam search is still used where a single best answer is wanted, such as constrained or structured
    output
- q: Cost per step and overall, and the effect of building tuples eagerly.
  kind: complexity
  key_points:
  - 'Each step scores B * V candidates and selects B with a heap: O(B * V log B); overall O(T * B * V
    log B)'
  - Creating the extended tuple for every candidate adds O(T) per candidate; build tuples only for survivors
  - Space O(B * T) for the beams plus O(B * V) candidate records
narration: []
state_aloud:
- Score is a sum of log-probabilities; higher is better; define tie-breaking explicitly.
- Finished (eos) hypotheses persist and compete but are never expanded.
- Stop when all beams are finished or max_len steps ran.
- beam_width 1 equals greedy; empty step_fn output drops the hypothesis.
- Compare scores with a tolerance in tests; the real code never relies on float equality.
walkthrough: |
  Each step builds candidates from the current beams in rank order: finished beams are carried through as a single candidate, live beams expand over step_fn's tokens. heapq.nsmallest with a negated score key picks the top beam_width candidates and is stable, so ties follow generation order. Only the survivors get their token tuple extended, which keeps the cost proportional to the beam instead of the candidate count. Standard beam search; no source note applies.
