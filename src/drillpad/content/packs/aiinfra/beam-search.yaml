id: beam-search
title: Beam Search
bar_level: 3
target_minutes: 35
patterns:
- beam-search
- decoding
- heap
- log-probabilities
- stable-ordering
firm_tags:
- ai-infra
anki_queries: []
statement: |
  Implement beam search decoding over an abstract next-token function.

  `beam_search(step_fn, beam_width, max_len, eos) -> list[(tokens_tuple, score)]`
  - `step_fn(prefix_tuple) -> list[(token, logprob)]` returns the candidate next tokens for a prefix
    (deterministic; may return an empty list). It is called with the empty tuple `()` first.
  - The search keeps at most `beam_width` hypotheses. A hypothesis is `(tokens, score)` where `score` is
    the SUM of the log-probabilities of its tokens. Start with `[((), 0.0)]`.
  - Each of at most `max_len` steps: if every hypothesis already ends with `eos`, stop. Otherwise form
    candidates: a hypothesis that ends with `eos` is carried over unchanged (and `step_fn` is NOT called
    for it); every other hypothesis yields one candidate per `(token, logprob)` returned by `step_fn`,
    with `score + logprob`. Keep the `beam_width` best candidates by score. Candidates are generated in
    order of the current beams (best first) and then in `step_fn` order, and ties are broken by that
    generation order (a stable sort).
  - Return the final beams, best first. Unfinished beams are returned too (no length normalisation).
  - `ValueError` if `beam_width < 1` or `max_len < 0`. `max_len == 0` returns `[((), 0.0)]`.

  Example: with a table where greedy picks `a` (-1.0) and then only bad continuations, `beam_width=1`
  returns the greedy sequence while `beam_width=2` finds the globally better one that starts with `b`.

  Do not build full token tuples for candidates that are discarded; with beam 50, vocabulary 200 and 40
  steps there are hundreds of thousands of candidates.
starter: |
  def beam_search(step_fn, beam_width, max_len, eos):
      pass
hints:
- Represent a candidate as (parent_tokens, new_score, new_token) and only create the extended tuple for
  the survivors.
- 'heapq.nsmallest(k, items, key=lambda c: -c[1]) behaves like a stable sort limited to k items, so ties
  keep generation order.'
- A finished beam is one candidate that competes with its siblings unchanged; do not call step_fn for
  it.
follow_ups:
- Length normalisation (score / len ** alpha) when ranking finished hypotheses.
- Batch the beams into one model call per step and share the KV cache between beams (copy-on-write blocks).
- Diverse beam search or sampling-based beams.
tests:
- name: beam of 1 is greedy and can miss the best sequence
  code: |
    def close(a, b, tol=1e-9):
        return abs(a - b) <= tol
    TABLE = {
        (): [("a", -1.0), ("b", -2.0)],
        ("a",): [("EOS", -4.0), ("x", -5.0)],
        ("b",): [("EOS", -1.0), ("y", -3.0)],
    }
    def table_fn(prefix):
        return TABLE.get(prefix, [("EOS", -0.5)])
    g = beam_search(table_fn, 1, 5, "EOS")
    assert g[0][0] == ("a", "EOS") and close(g[0][1], -5.0)
  hidden: false
  tags:
  - boundary
  - ordering
- name: wider beam finds the better sequence
