- name: beam 50, vocabulary 200, 40 steps
  code: |
    def close(a, b, tol=1e-9):
        return abs(a - b) <= tol
    TABLE = {
        (): [("a", -1.0), ("b", -2.0)],
        ("a",): [("EOS", -4.0), ("x", -5.0)],
        ("b",): [("EOS", -1.0), ("y", -3.0)],
    }
    def table_fn(prefix):
        return TABLE.get(prefix, [("EOS", -0.5)])
    import math
    def fn(prefix):
        h = hash(prefix) if False else sum((i + 1) * (t + 1) for i, t in enumerate(prefix))
        return [(v, -((h * 31 + v * 17) % 97) / 10.0 - 0.1) for v in range(200)]
    r = beam_search(fn, 50, 40, -1)
    assert len(r) == 50 and all(len(t) == 40 for t, _ in r)
    scores = [s for _, s in r]
    assert scores == sorted(scores, reverse=True)
