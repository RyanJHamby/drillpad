- name: finished beams are carried unchanged and not expanded
  code: |
    def close(a, b, tol=1e-9):
        return abs(a - b) <= tol
    TABLE = {
        (): [("a", -1.0), ("b", -2.0)],
        ("a",): [("EOS", -4.0), ("x", -5.0)],
        ("b",): [("EOS", -1.0), ("y", -3.0)],
    }
    def table_fn(prefix):
        return TABLE.get(prefix, [("EOS", -0.5)])
    calls = []
    def fn(prefix):
        calls.append(prefix)
        return table_fn(prefix)
    beam_search(fn, 2, 5, "EOS")
    assert all(not p or p[-1] != "EOS" for p in calls), "never expand a finished beam"
    assert calls.count(()) == 1
