id: model-registry-versioning
title: Model Registry with Versioning
bar_level: 2
target_minutes: 25
patterns:
- model-registry
- versioning
- stage-promotion
- rollback
- defensive-copy
firm_tags:
- ai-infra
anki_queries: []
statement: |
  Implement a small model registry like the one ML teams use to track which trained artifact is serving.

  `ModelRegistry()`:
  - `register(name, uri, metadata=None) -> int`: add a new version of model `name`; versions are
    `1, 2, 3, ...` per model. The record is `{"name", "version", "uri", "stage", "metadata"}` with stage
    `"none"` and metadata (a deep copy of the argument, `{}` if None). `ValueError` for an empty `uri`.
  - `get(name, version=None) -> dict`: that version, or the highest version when `None`. Returns a COPY
    (mutating it never changes the registry). `KeyError` for an unknown name or version.
  - `list_versions(name) -> list[dict]`: copies, ascending by version.
  - `promote(name, version, stage)`: stages are `"none"`, `"staging"`, `"production"`, `"archived"`
    (`ValueError` otherwise, `KeyError` for unknown name/version). At most one version holds `"staging"`
    and at most one holds `"production"`: promoting another version into one of those stages moves the
    previous holder to `"archived"`. Moving a version out of a stage frees that stage. Promoting to its
    current stage is a no-op.
  - `get_stage(name, stage) -> dict | None`: the version holding `"staging"` or `"production"` (copy),
    or `None`; `ValueError` for other stage names.
  - `rollback(name) -> int`: make the previous production version production again. Production versions
    form a history in promotion order; rollback archives the current one, restores the one before it
    and returns that version number. `ValueError` if there is no current production version or no
    earlier one. Repeated rollbacks keep walking back.

  `get_stage`, `get` and `promote` must be O(1) in the number of versions (no scanning).
starter: |
