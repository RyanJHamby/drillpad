id: bpe-tokenizer
title: Byte-pair-encoding Tokenizer
bar_level: 3
target_minutes: 35
patterns:
- bpe
- tokenizer
- pair-counting
- string-processing
- word-frequency-dedup
firm_tags:
- ai-infra
anki_queries: []
statement: |
  Implement the core of a byte-pair-encoding (BPE) tokenizer on characters.

  - `train_bpe(text, num_merges) -> list[tuple[str, str]]`: split `text` on whitespace into words and
    treat each word as a sequence of single characters (no end-of-word marker). Repeat up to
    `num_merges` times: count adjacent token pairs over all words (each word counts as many times as
    it occurs), pick the pair with the highest count (ties: the lexicographically smallest pair
    `(a, b)` by tuple comparison), record it, and replace every occurrence of it in every word by the
    single merged token `a + b`. Merging a word is left to right and non-overlapping (`a a a` with merge
    `(a, a)` becomes `aa a`). Stop early when no word has two or more tokens.
  - `encode_word(word, merges) -> list[str]`: tokenize one word. Start from its characters and
    repeatedly apply the pair that has the lowest rank (earliest in `merges`) among the adjacent
    pairs present, merging all its non-overlapping occurrences left to right, until no listed pair is
    present. Unknown characters stay as single tokens. `""` encodes to `[]`.
  - `tokenize(text, merges) -> list[str]`: split on whitespace and concatenate `encode_word` of every
    word.

  Example: `train_bpe("ab ab ab cd", 1) == [("a", "b")]`, and with merges `[("a","a"),("a","b")]`,
  `encode_word("aaab", ...) == ["aa", "ab"]`.

  Training must work on the distinct words with their counts, not on every occurrence separately.
