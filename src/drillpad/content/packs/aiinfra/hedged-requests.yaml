anki_queries: []
statement: |
  Hedging cuts tail latency: if a request has not answered after a delay (usually a high percentile of
  recent latencies), send a duplicate to another replica and take whichever answers first. Build the
  simulation and the delay estimator.

  1. `hedged_request(latencies, hedge_delay, max_hedges=1) -> (winner_index, finish_time, attempts)`:
     `latencies[k]` is how long attempt `k` would take if launched (use `float("inf")` for an attempt that
     never answers). Attempt `0` launches at time 0; attempt `k` launches at `k * hedge_delay`, but only if
     `k <= max_hedges`, an attempt `k` exists, AND no earlier attempt has finished by then (an attempt
     finishing exactly at `k * hedge_delay` already answered, so no hedge is sent). Attempt `k` finishes
     at `k * hedge_delay + latencies[k]`. The winner is the earliest finish (ties: lower index). Return
     the winner index, its finish time and the number of attempts launched. If every launched attempt is
     `inf` return `(None, inf, attempts)`.
  2. `percentile(samples, p)`: nearest-rank percentile, `sorted(samples)[ceil(p/100*n) - 1]`;
     `ValueError` for empty samples or `p` outside `(0, 100]`.
  3. `LatencyTracker(window)`: keeps the last `window` latencies (`ValueError` if `window < 1`).
     `record(x)` adds one; `hedge_delay(p)` returns the nearest-rank percentile of the window, or `None`
     if empty. It will be called after every record, so do not sort the window on every query.

  Example: `hedged_request([10, 3], 4) == (1, 7, 2)`: the original would take 10, the hedge launched at
  time 4 finishes at 7.
