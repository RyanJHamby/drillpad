extensions:
- q: 'Level 2: add a hedge budget: allow a hedge only if hedges_sent / requests_seen over the last N requests
    is below `max_rate`.'
  kind: code
  key_points:
  - Maintain a counter pair over a sliding window of requests (a deque of booleans or a ring buffer)
  - The budget check happens at hedge launch time, using only information available then
  - Under overload the budget stops hedging from amplifying load
- q: When is hedging harmful, and how do you mitigate it for LLM inference?
  kind: design
  key_points:
  - Hedging duplicates expensive GPU work; during overload it amplifies load and can cause a retry storm
  - Only hedge idempotent, short or time-to-first-token requests, cap the extra-load budget and cancel
    the loser promptly
  - Hedge to a different replica or provider (see provider-pool-failover), and prefer hedging the queueing
    stage not the long decode
- q: Why choose a high percentile such as p95 as the hedge delay?
  kind: reasoning
  key_points:
  - Only the slowest ~5% of requests are duplicated, so extra load is ~5% yet the tail is cut to about
    delay + typical latency
  - A lower percentile hedges too often; a higher one barely helps p99
  - Recompute from a recent window so the delay follows load and deployments
- q: Cost of the tracker operations and of the percentile query.
  kind: complexity
  key_points:
  - record is O(log W) to locate plus O(W) memmove for insort and delete, tiny in practice; query is O(1)
    on a sorted list
  - Sorting per query would be O(W log W)
  - An order-statistic tree or two heaps give O(log W) for both, or a histogram with fixed buckets O(B)
narration: []
state_aloud:
- 'Define when a hedge fires: delay elapsed AND nothing finished yet (>= boundary).'
- Ties between attempts go to the earlier launch.
- inf latency means the attempt never answers.
- 'Percentile definition: nearest rank; empty window returns None.'
- Fewer attempts than max_hedges is fine.
walkthrough: |
  hedged_request iterates attempts, launching attempt k at k*delay only while the best finish so far is strictly later than that launch time, and keeps the minimum finish with a strict comparison so ties favour the earlier attempt. The tracker keeps a FIFO deque for eviction and a sorted list maintained with bisect so the nearest-rank percentile is an index lookup. Standard hedged-request formulation (send a second copy after a high percentile delay); the code is the problem's own.
