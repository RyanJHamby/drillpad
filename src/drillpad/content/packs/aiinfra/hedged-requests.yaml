hints:
- Walk attempts in order; stop launching as soon as the best finish so far is <= the next launch time
  (>=, because finishing at the exact delay means no hedge).
- Track the best (finish, index) with a strict < so ties keep the earlier attempt.
- For the tracker keep a deque (eviction order) plus a sorted list updated with bisect.insort and a bisect_left
  delete.
follow_ups:
- Cancel the loser and account for its wasted work.
- Only hedge idempotent requests and cap the hedge rate (for example 5% of traffic).
- Adaptive hedge delay that targets a budget of extra load.
tests:
- name: hedge launches when the first attempt is slow
  code: |
    assert hedged_request([10, 3], 4) == (1, 7, 2)
    assert hedged_request([10, 3], 12) == (0, 10, 1), "first attempt finishes before the hedge fires"
  hidden: false
  tags:
  - time
  - ordering
- name: hedge not launched when the first attempt completes exactly at the delay
  code: |
    assert hedged_request([4, 1], 4) == (0, 4, 1)
    assert hedged_request([6, 1], 4) == (1, 5, 2)
  hidden: false
  tags:
  - boundary
  - time
- name: original can still win after a hedge is sent; ties go to the earlier attempt
  code: |
    assert hedged_request([6, 5], 4) == (0, 6, 2), "hedge would finish at 9"
    assert hedged_request([8, 4], 4) == (0, 8, 2), "tie at 8: attempt 0 wins"
  hidden: false
  tags:
  - ordering
  - duplicate
- name: multiple hedges chain on the delay
  code: |
    # attempts launch at 0, 3, 6; finish at 20, 13, 8 -> third wins
    assert hedged_request([20, 10, 2], 3, max_hedges=2) == (2, 8, 3)
    assert hedged_request([20, 10, 2], 3, max_hedges=1) == (1, 13, 2)
    assert hedged_request([20, 10, 2], 3, max_hedges=0) == (0, 20, 1)
    # a later hedge is skipped once an earlier attempt has already completed
    assert hedged_request([4, 50, 1], 5, max_hedges=2) == (0, 4, 1)
  hidden: true
  tags:
  - time
  - boundary
- name: failed attempts (inf) and all failing
  code: |
    inf = float("inf")
    assert hedged_request([inf, 2], 5) == (1, 7, 2)
    assert hedged_request([inf, inf], 5) == (None, inf, 2)
    assert hedged_request([3], 5, max_hedges=3) == (0, 3, 1), "fewer attempts than allowed hedges"
  hidden: true
  tags:
  - invalid
  - single
- name: percentile uses the nearest-rank method
  code: |
    xs = [15, 20, 35, 40, 50]
    assert percentile(xs, 50) == 35 and percentile(xs, 100) == 50 and percentile(xs, 20) == 15
    assert percentile(xs, 95) == 50 and percentile([7], 99) == 7
    for args in [([], 50), (xs, 0), (xs, 101)]:
        try:
            percentile(*args)
        except ValueError:
            pass
        else:
            raise AssertionError(args)
  hidden: false
  tags:
  - boundary
  - empty
- name: tracker keeps a sliding window
  code: |
    t = LatencyTracker(3)
    assert t.hedge_delay(95) is None
    for x in [100, 1, 2, 3]:
        t.record(x)                     # 100 has slid out
    assert t.hedge_delay(100) == 3 and t.hedge_delay(50) == 2
    t.record(500)
    assert t.hedge_delay(100) == 500 and t.hedge_delay(1) == 2
  hidden: true
  tags:
  - state-reuse
  - time
- name: 100k records and 100k percentile queries on a 10k window
  code: |
    import random
    rng = random.Random(9)
    t = LatencyTracker(10000)
    last = None
    for i in range(100000):
        t.record(rng.random() * 100)
        last = t.hedge_delay(95)
    assert 90 < last < 99
  hidden: true
  tags:
  - scale
