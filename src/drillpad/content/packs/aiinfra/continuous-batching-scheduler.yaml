hints:
- Keep a deque for waiting requests and a list of [id, remaining, reserved] for active ones; track the
  reserved total incrementally instead of summing.
- 'Do the three phases in order inside step(): admit, decode one token, evict finished. Evicting at the
  end is what frees the slot for the next step.'
- FIFO admission means a single `while` loop that stops at the first head that does not fit; never scan
  past it.
follow_ups:
- Charge prefill separately from decode (chunked prefill).
- Add priorities and preemption of running sequences.
- Replace up-front reservation with on-demand block allocation (see paged-kv-cache-allocator).
tests:
- name: requests join and leave between steps
  code: |
    b = ContinuousBatcher(max_slots=2, kv_budget=100)
    b.submit("a", 10, 2); b.submit("b", 10, 5); b.submit("c", 10, 1)
    assert b.step() == []
    assert b.active_ids() == ["a", "b"] and b.waiting_ids() == ["c"]
    assert b.step() == ["a"]
    assert b.active_ids() == ["b"]
    assert b.step() == ["c"], "c is admitted at the start of step 3 and finishes in it"
    assert b.step() == [] and b.step() == ["b"]
    assert b.active_ids() == [] and b.waiting_ids() == []
  hidden: false
  tags:
  - ordering
  - boundary
- name: 'strict FIFO: a blocked head blocks smaller requests behind it'
  code: |
    b = ContinuousBatcher(max_slots=4, kv_budget=30)
    b.submit("a", 10, 10)     # reserves 20
    b.submit("b", 10, 10)     # reserves 20, does not fit next to a
    b.submit("c", 1, 1)       # reserves 2, would fit but is behind b
    b.step()
    assert b.active_ids() == ["a"] and b.waiting_ids() == ["b", "c"]
    assert b.kv_used() == 20
    for _ in range(9):
        b.step()
    assert b.active_ids() == [] and b.kv_used() == 0
    assert b.step() == ["c"], "b and c are both admitted at step 11; c needs one token"
    assert b.active_ids() == ["b"]
  hidden: false
  tags:
  - ordering
  - boundary
- name: new request joins a batch already in flight
  code: |
    b = ContinuousBatcher(2, 100)
    b.submit("a", 1, 3)
    b.step()
    b.submit("b", 1, 1)
    assert b.step() == ["b"]
    assert b.step() == ["a"]
  hidden: false
  tags:
  - state-reuse
  - time
- name: invalid arguments
  code: |
    for bad in [(0, 10), (2, 0)]:
        try:
            ContinuousBatcher(*bad)
        except ValueError:
            pass
        else:
            raise AssertionError(bad)
    b = ContinuousBatcher(2, 20)
    b.submit("a", 5, 5)
    for args in [("a", 1, 1), ("x", 1, 0), ("y", -1, 3), ("z", 15, 6)]:
        try:
            b.submit(*args)
        except ValueError:
            pass
        else:
            raise AssertionError(args)
    assert b.waiting_ids() == ["a"], "rejected submits must not enqueue"
  hidden: false
  tags:
  - invalid
  - zero-capacity
- name: idle step on an empty scheduler
  code: |
    b = ContinuousBatcher(3, 10)
    assert b.step() == [] and b.active_ids() == [] and b.waiting_ids() == []
    assert b.kv_used() == 0
    assert b.run_until_drained() == {}
  hidden: true
  tags:
  - empty
- name: reservation that exactly fills the budget is admitted
  code: |
    b = ContinuousBatcher(4, 20)
    b.submit("a", 10, 10)
    b.submit("b", 1, 1)
    b.step()
    assert b.active_ids() == ["a"] and b.kv_used() == 20
  hidden: true
  tags:
  - boundary
  - single
- name: requests finishing in the same step are reported in admission order
  code: |
    b = ContinuousBatcher(4, 100)
    for rid in ["x", "y", "z"]:
        b.submit(rid, 2, 1)
    assert b.step() == ["x", "y", "z"]
  hidden: true
  tags:
  - ordering
- name: run_until_drained reports completion steps
  code: |
    b = ContinuousBatcher(2, 100)
    b.submit("a", 1, 2); b.submit("b", 1, 5); b.submit("c", 1, 1)
    assert b.run_until_drained() == {"a": 2, "c": 3, "b": 5}
  hidden: true
  tags:
  - state-reuse
  - time
- name: 200k requests keep the slots full
  code: |
    b = ContinuousBatcher(64, 10**9)
    work = 0
    for i in range(200000):
        m = 1 + i % 4
        work += m
        b.submit(i, 5, m)
    done = b.run_until_drained()
    assert len(done) == 200000
    assert b.steps <= (work + 63) // 64 + 4, "freed slots must be refilled on the very next step"
  hidden: true
  tags:
  - scale
  - ordering
complexity:
- op: step
  time: O(A + K)
  space: O(1)
- op: run_until_drained
  time: O(T)
  space: O(R)
extensions:
- q: 'Level 2: model prefill. A request first needs ceil(prompt_len / chunk) prefill steps (at most `prefill_budget`
    prompt tokens per step across all requests) before it starts decoding. How does step() change?'
  kind: code
  key_points:
  - 'Per-request state machine: PREFILL(remaining prompt tokens) -> DECODE(remaining new tokens)'
  - A per-step token budget shared between prefill chunks and one decode token per decoding sequence
  - Decode sequences are scheduled first so a long prompt cannot stall them
- q: Reserving prompt_len + max_new up front wastes memory when generations stop early. What would you
    do instead, and what new failure appears?
  kind: design
  key_points:
  - Allocate KV blocks on demand as sequences grow (paged allocation, see the paged-kv-cache-allocator
    problem)
  - 'On-demand growth can exhaust memory mid-batch, so a policy is needed: preempt the lowest-priority
    sequence and either swap its KV out or drop it and recompute'
  - Admission uses a watermark of free blocks so running sequences have headroom to grow
- q: Strict FIFO lets one huge request block many small ones. How would you reduce head-of-line blocking
    without starving the big request?
  kind: design
  key_points:
  - Allow bounded skipping (small requests may pass the head at most N times) or aging so the head's effective
    priority rises
  - Separate queues by size or tenant with weighted admission (see weighted-fair-queue)
  - 'State the trade: utilization improves, but fairness and tail latency of the big request need an explicit
    bound'
- q: What does one step cost and what state do you keep? Why must kv_used be tracked incrementally?
  kind: complexity
  key_points:
  - O(A) to decode and evict plus O(admitted) per step, where A is the number of active sequences; A <=
    max_slots
  - Waiting queue is O(1) per enqueue and dequeue with a deque; list.pop(0) would make draining N requests
    O(N^2)
  - Space is O(active + waiting); recomputing the reserved sum on every admission would add O(A) per candidate
narration: []
state_aloud:
- 'Ask: is a request''s KV cost known up front (prompt_len + max_new) or does it grow? I reserve up front
  here.'
- Strict FIFO means head-of-line blocking; say it and name the alternative.
- Slot freed at the end of step t is usable at the start of step t+1; a single-token request admitted
  at step t also finishes at step t.
- Rejected submits (duplicate, oversize) must leave the queues untouched; an oversize request would otherwise
  block the queue forever.
- Budget exactly equal to a reservation is admitted (<=, not <).
walkthrough: |
  Waiting requests sit in a FIFO deque; active ones in a list of [id, remaining, reserved]. step() first admits from the head while a slot is free and the head's reservation fits, stopping at the first head that does not fit (strict FIFO). It then decodes one token for every active sequence and evicts finished ones, releasing their reservation, so membership changes every step and a short request never waits for a long neighbor. The reserved total is maintained incrementally so admission is O(1) per candidate. This follows the user's own note on continuous / in-flight batching (interview-prep/11-scheduling-batching.md, section 3): batch at the decode-step level, check a KV-block budget rather than only a slot count, evict on EOS or max length. The reservation-up-front simplification replaces the note's per-token KV growth.
