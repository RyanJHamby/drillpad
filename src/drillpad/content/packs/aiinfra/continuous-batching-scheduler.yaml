id: continuous-batching-scheduler
title: Continuous / Dynamic Batching Scheduler
bar_level: 3
target_minutes: 35
patterns:
- continuous-batching
- scheduler
- simulation
- kv-cache-budget
- fifo-queue
firm_tags:
- ai-infra
anki_queries: []
statement: |
  Simulate the scheduling loop of an LLM inference server that batches at the *decode step*
  level (continuous / in-flight batching). Every step each active sequence generates exactly one
  token; sequences that finish leave immediately and waiting requests join immediately, so the
  batch is never held until its slowest member finishes.

  Implement `ContinuousBatcher(max_slots, kv_budget)`:

  - `submit(req_id, prompt_len, max_new)`: enqueue a request (FIFO). It needs one decode slot and
    `prompt_len + max_new` KV-cache units (reserved up front, released when it finishes).
    Raise `ValueError` if `req_id` was ever used before, `prompt_len < 0`, `max_new < 1`, or the
    reservation alone exceeds `kv_budget`. Rejected submits change nothing.
  - `step() -> list[req_id]`: one scheduler step.
    1. Admit from the head of the waiting queue while `len(active) < max_slots` and the head's
       reservation fits in the remaining budget. Admission is strictly FIFO: if the head does not
       fit, nothing behind it is admitted (no skipping).
    2. Every active request generates one token (`max_new` decreases by 1).
    3. Requests with no tokens left finish and release their reservation. Return their ids in
       admission order. A freed slot is therefore reusable at the START of the next step.
  - `active_ids()` / `waiting_ids()`: current ids (active in admission order, waiting in FIFO order).
  - `kv_used()`: total reserved KV units of active requests.
  - `run_until_drained() -> dict`: call `step()` until nothing is active or waiting; return
    `{req_id: step_number}` where step numbers are the cumulative `step()` call count (the first
    call ever is step 1).
  - `ValueError` from the constructor if `max_slots < 1` or `kv_budget < 1`.

  Example: slots=2, budget=100, submit a(prompt 10, max_new 2), b(10, 5), c(10, 1).
  Step 1 admits a,b. Step 2 finishes a. Step 3 admits c and finishes it. Step 5 finishes b.
