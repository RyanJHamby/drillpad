anki_queries: []
statement: |
  Implement the decision logic of a canary rollout for a new model version: traffic moves through
  stages (for example 1% -> 10% -> 50% -> 100%), the controller compares the canary's error rate with
  the stable version's, and it promotes, holds or rolls back.

  `CanaryRollout(stages, min_requests, tolerance)`:
  - `stages`: strictly increasing percentages in `(0, 100]`, non-empty. `min_requests >= 1`,
    `tolerance >= 0` (absolute error-rate margin). Otherwise `ValueError`.
  - Starts in state `"running"` at stage 0.
  - `weight() -> int`: current canary traffic percentage (`0` after a rollback).
  - `state() -> "running" | "rolled_back" | "complete"`.
  - `report(canary_reqs, canary_errs, base_reqs, base_errs) -> str`: counts observed during the current
    stage (the caller passes fresh counts each stage).
    `ValueError` for negative counts or errors greater than requests. `RuntimeError` if the rollout
    already finished.
    * `canary_reqs < min_requests` -> `"hold"` (not enough evidence; nothing changes).
    * canary rate = errs/reqs; baseline rate = base_errs/base_reqs, or `0.0` when `base_reqs == 0`.
      If `canary_rate > baseline_rate + tolerance` -> state `"rolled_back"`, return `"rollback"`.
    * otherwise at the last stage -> state `"complete"`, return `"complete"`; else advance one stage and
      return `"promote"`.
  - `route(key) -> "canary" | "stable"`: `bucket = int(md5(key.encode()).hexdigest()[:8], 16) % 100`;
    canary iff `bucket < weight()`. The same key always lands on the same side and a key that is canary at
    some weight stays canary at every higher weight.

  Example: stages `[10, 50, 100]`, `min_requests=100`: `report(200, 1, 1800, 18)` promotes to 50.
starter: |
  class CanaryRollout:
