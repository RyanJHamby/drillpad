id: rolling-canary-deploy
title: Rolling / Canary Deploy Simulator
bar_level: 3
target_minutes: 35
patterns:
- canary
- progressive-delivery
- state-machine
- hash-bucketing
- rollback
firm_tags:
- ai-infra
