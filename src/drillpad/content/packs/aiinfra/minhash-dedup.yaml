id: minhash-dedup
title: MinHash Near-duplicate Detection
bar_level: 3
target_minutes: 40
patterns:
- minhash
- locality-sensitive-hashing
- jaccard-similarity
- deduplication
- banding
- data-pipeline
firm_tags:
- ai-infra
anki_queries: []
statement: |
  Training-data pipelines remove near-duplicate documents. Exact pairwise Jaccard comparison is O(N^2),
  so use MinHash signatures with LSH banding. Everything is specified so results are deterministic.

  - `shingles(text, k=3) -> set[str]`: split `text` on whitespace; the k-word shingles are the windows of
    `k` consecutive words joined by one space. No words -> empty set; fewer than `k` words -> a set with
    the single shingle made of all words. `ValueError` if `k < 1`.
  - Hashing: `P = 2**61 - 1`. `base(s) = int.from_bytes(hashlib.blake2b(s.encode(), digest_size=8).digest(), "big")`.
    Hash function `i` is `h_i(x) = (a_i * base(x) + b_i) % P` where, with `rng = random.Random(seed)`, the
    pairs are drawn in order `for i in range(num_perm): a_i = rng.randrange(1, P); b_i = rng.randrange(0, P)`.
  - `minhash_signature(shingle_set, num_perm=64, seed=0) -> list[int]`: element `i` is the minimum of `h_i`
    over the set. The signature of the empty set is `[P] * num_perm`. `ValueError` if `num_perm < 1`.
  - `estimate_jaccard(sig_a, sig_b) -> float`: the fraction of positions that are equal; `ValueError` if
    the lengths differ or are 0.
  - `near_duplicates(docs, k=3, num_perm=64, bands=16, threshold=0.5, seed=0) -> list[(i, j)]`: indices
    `i < j` of document pairs that share at least one LSH band (a band is `num_perm // bands` consecutive
    signature entries and two documents collide in band `b` when those entries are identical) AND whose
    estimated Jaccard is `>= threshold`. Documents with no shingles are ignored. Result sorted ascending.
    `ValueError` if `bands < 1` or `bands` does not divide `num_perm`.

  With 1,500 documents all-pairs comparison is too slow for the time limit; use band buckets to find
  candidates and compute the shingle hashes once per shingle, not once per hash function.
starter: |
  def shingles(text, k=3):
