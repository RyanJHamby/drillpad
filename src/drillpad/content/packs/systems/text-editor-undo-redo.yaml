id: text-editor-undo-redo
title: Text Editor with Undo/Redo
bar_level: 2
target_minutes: 22
patterns:
- command-pattern
- undo-redo
- two-stacks
firm_tags:
- ai-infra
statement: |
  Implement a `TextEditor` with unlimited undo/redo using the command pattern.

  - `insert(pos, text)`: insert `text` so it starts at index `pos` (`0 <= pos <= len(text_now)`).
  - `delete(pos, length)`: delete `length` characters starting at `pos`
    (`length >= 1`, `pos >= 0`, `pos + length <= len(text_now)`).
  - Invalid positions/lengths raise `IndexError` and change nothing (and add no undo history).
    Inserting the empty string is a no-op that adds no history.
  - `undo()` -> `bool`: reverse the most recent edit; `False` if nothing to undo.
  - `redo()` -> `bool`: re-apply the most recently undone edit; `False` if nothing to redo.
  - Any new `insert`/`delete` clears the redo history.
  - `text` property returns the current string.

  Example
  ```python
  e = TextEditor(); e.insert(0, "hello"); e.insert(5, " world"); e.delete(0, 6)
  e.text == "world"; e.undo(); e.text == "hello world"; e.redo(); e.text == "world"
  ```
