statement: |
  Implement `Table(columns)`, a tiny in-memory table. `columns` is a list of column names.

  - `insert(row)` -> int row id (1, 2, 3, ...). `row` is a dict whose keys must be exactly the
    columns, otherwise `ValueError`. The table stores a copy.
  - `select(where=None, order_by=None, desc=False, limit=None, columns=None)` -> list of dict
    copies.
    - `where`: list of `(column, op, value)` conditions ANDed together; `op` is one of
      `"="`, `"!="`, `"<"`, `"<="`, `">"`, `">="`. `None` or `[]` matches all rows.
    - Results are in insertion order unless `order_by` (a column) is given; sorting is stable
      (ties keep insertion order, also when `desc=True`). `limit` applies after sorting.
    - `columns` projects to those columns.
    - Unknown column in `where`/`order_by`/`columns` raises `KeyError`; unknown op `ValueError`.
  - `update(where, changes)` -> number of rows changed (`changes` is a dict of column -> value).
  - `delete(where)` -> number of rows deleted.
  - `create_index(column)`: build a hash index used for `"="` conditions. It must be kept in sync
    by insert/update/delete. After every `select`, `self.last_scanned` is the number of rows
    examined: with an index on an `=` condition column it is the size of the matching bucket,
    otherwise the whole table.

  Example
  ```python
  t = Table(["id", "name", "age"]); t.insert({"id": 1, "name": "a", "age": 30})
  t.select(where=[("age", ">=", 18)], order_by="name", limit=5, columns=["name"])
  ```
