statement: |
  Implement `BloomFilter(capacity, error_rate=0.01)`.

  Sizing (use exactly these formulas so results are comparable)
  - `m = ceil(-capacity * ln(error_rate) / (ln 2)^2)` bits, exposed as `self.m`
  - `k = max(1, round(m / capacity * ln 2))` hash functions, exposed as `self.k`
  - Raise `ValueError` if `capacity <= 0` or `error_rate` is not strictly between 0 and 1.

  API
  - `add(item)`: `item` is a string. Set `k` bit positions derived by double hashing from a
    deterministic hash (e.g. `hashlib.blake2b`/`md5`; never built-in `hash`):
    `pos_i = (h1 + i * h2) % m`.
  - `might_contain(item)` -> bool, and `item in bf` works too: never a false negative.
  - `count_set_bits()` -> number of 1 bits.

  Example
  ```python
  bf = BloomFilter(1000, 0.01); bf.m, bf.k   # (9586, 7)
  bf.add("apple"); "apple" in bf   # True
  "zzz" in bf                      # almost certainly False
  ```
