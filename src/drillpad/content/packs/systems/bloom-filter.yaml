hints:
- Compute m and k from the formulas, store bits in a bytearray.
- Derive two base hashes from one digest and generate k positions as h1 + i*h2 mod m.
- Membership requires all k bits set; any zero bit proves absence.
follow_ups:
- How does the false-positive rate behave as you insert more than capacity items?
- How would you size the filter if you only know the memory budget?
tests:
- name: sizing formulas
  tags:
  - boundary
  - single
  code: |
    bf = BloomFilter(1000, 0.01)
    assert (bf.m, bf.k) == (9586, 7)
    bf2 = BloomFilter(100, 0.001)
    assert (bf2.m, bf2.k) == (1438, 10)
- name: no false negatives
  tags:
  - scale
  - duplicate
  code: |
    bf = BloomFilter(1000, 0.01)
    items = ["item-%d" % i for i in range(1000)]
    for it in items:
        bf.add(it)
        bf.add(it)           # idempotent
    assert all(it in bf and bf.might_contain(it) for it in items)
- name: empty filter contains nothing
  tags:
  - empty
  - state-reuse
  code: |
    bf = BloomFilter(100)
    assert bf.count_set_bits() == 0
    assert not any(("x%d" % i) in bf for i in range(200))
    bf.add("a")
    assert "a" in bf and 1 <= bf.count_set_bits() <= bf.k
- name: invalid parameters
  tags:
  - invalid
  - zero-capacity
  code: |
    for args in ((0, 0.01), (-5, 0.01), (10, 0.0), (10, 1.0), (10, 1.5)):
        try:
            BloomFilter(*args)
        except ValueError:
            continue
        raise AssertionError("expected ValueError for %r" % (args,))
    assert "ok" and BloomFilter(1, 0.5).k >= 1
- name: false positive rate near target
  hidden: true
  tags:
  - scale
  - boundary
  code: |
    bf = BloomFilter(2000, 0.01)
    for i in range(2000):
        bf.add("member-%d" % i)
    fp = sum(1 for i in range(20000) if ("other-%d" % i) in bf)
    assert fp / 20000 < 0.025, fp / 20000
    assert fp > 0 or True
    bits = bf.count_set_bits()
    assert 0.35 * bf.m < bits < 0.65 * bf.m, bits
- name: deterministic across instances
  hidden: true
  tags:
  - duplicate
  - ordering
  code: |
    a = BloomFilter(100); b = BloomFilter(100)
    for w in ("x", "y", "z"):
        a.add(w); b.add(w)
    assert a.count_set_bits() == b.count_set_bits() > 0
    assert bytes(a.bits) == bytes(b.bits)
complexity:
- op: add
  time: O(1)
  space: O(n)
- op: might_contain
  time: O(1)
  space: O(n)
extensions:
- q: What are the time and space costs, and how does space scale with accuracy?
  kind: complexity
  key_points:
  - 'add and lookup cost k hash computations: O(k), constant for fixed error rate'
  - Space is m = -n ln p / (ln2)^2 bits, about 1.44 log2(1/p) bits per item
  - 'Compare with a hash set that stores whole keys: much larger, but exact'
- q: Can you support deletion, or merging two filters?
  kind: design
  key_points:
  - 'Plain Bloom cannot delete: clearing a bit may remove other items'
  - Counting Bloom uses small counters per slot at 3-4x the space; cuckoo filters are an alternative
  - Union of same-parameter filters is a bitwise OR; intersection only approximates
- q: Where would you use one in a system, and what happens as it fills past capacity?
  kind: design
  key_points:
  - Guard expensive lookups (LSM-tree SSTables, cache penetration, crawler seen-sets)
  - False positive rate climbs quickly past design capacity; use scalable (stacked) Bloom filters
  - Persist by serialising the bit array; hash functions must stay identical across versions
- q: Why double hashing, and why not Python's hash()?
  kind: reasoning
  key_points:
  - k independent hashes are costly; h1 + i*h2 gives comparable false-positive rates
  - hash() of str is randomised per process so a persisted/shared filter would break
  - Odd h2 (or coprime to m) avoids short probe cycles
narration: []
state_aloud:
- Never a false negative, only false positives.
- No deletion support in the basic version.
- Deterministic hashing so the filter can be persisted/shared.
- 'Parameters validated: capacity > 0 and 0 < p < 1.'
walkthrough: Size m and k from the standard formulas and keep the bits in a bytearray. One blake2b digest
  supplies two 64-bit hashes; the k positions are h1 + i*h2 mod m. add sets those bits and might_contain
  checks that all are set, so there are no false negatives and a tunable false-positive rate. Operations
  are O(k) time and the filter uses O(m) bits.
