id: parking-lot
title: Parking Lot
bar_level: 2
target_minutes: 22
patterns:
- object-oriented-design
- best-fit-allocation
- pricing
firm_tags: []
statement: |
  Implement `ParkingLot(spots)` where `spots` is a dict like `{"small": 1, "medium": 2, "large": 1}`
  (missing sizes mean 0).

  Vehicle types and the spot sizes they fit:
  - `"motorcycle"`: small, medium or large
  - `"car"`: medium or large
  - `"truck"`: large only
  Always assign the *smallest* spot size that fits (best fit).

  API
  - `park(plate, vehicle_type, now)` -> int ticket id (1, 2, ...), or `None` if no fitting spot is
    free. Parking a plate that is already parked raises `ValueError`; an unknown vehicle type
    raises `ValueError`.
  - `unpark(ticket_id, now)` -> fee (int): `rate[size] * hours` where hours is the elapsed
    seconds divided by 3600 rounded UP, minimum 1; rates per hour: small 1, medium 2, large 4,
    by the size of the spot used. The spot becomes free. Unknown/already-used ticket raises
    `KeyError`.
  - `available()` -> dict of free spots per size (all three sizes present).
  - `spot_of(ticket_id)` -> the spot size assigned.

  Example
  ```python
  lot = ParkingLot({"small": 1, "medium": 1}); t = lot.park("AB1", "motorcycle", now=0)  # small
  lot.unpark(t, now=3601) == 2     # 2 started hours at rate 1
  ```
starter: |
