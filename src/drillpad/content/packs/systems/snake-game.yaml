id: snake-game
title: Snake Game
bar_level: 2
target_minutes: 22
patterns:
- deque
- simulation
- hash-set
- grid
firm_tags: []
statement: |
  Implement `SnakeGame(width, height, food)` (LeetCode 353). The snake starts at `(0, 0)` with
  length 1 on a `height x width` grid; coordinates are `(row, col)`. `food` is a list of
  `[row, col]` positions that appear one at a time: the next food only appears after the previous
  one has been eaten (it never appears on the snake).

  `move(direction)` with `direction` in `"U"`, `"D"`, `"L"`, `"R"` returns the score after the
  move, or `-1` if the game is over (hit a wall, or ran into its own body). Eating food grows the
  snake by one and increases the score by one. The tail cell is vacated by the move, so moving into
  the cell the tail is leaving is legal (unless the snake just ate, in which case the tail does
  not move). After the game is over every further `move` returns `-1`.

  Example
  ```python
  g = SnakeGame(3, 2, [[1, 2], [0, 1]])
  g.move("R") -> 0; g.move("D") -> 0; g.move("R") -> 1; g.move("U") -> 1; g.move("L") -> 2; g.move("U") -> -1
  ```
starter: |
