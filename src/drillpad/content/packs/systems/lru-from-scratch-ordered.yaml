id: lru-from-scratch-ordered
title: Hash Map + Doubly Linked List Primitives
bar_level: 2
target_minutes: 22
patterns:
- doubly-linked-list
- hash-map
- sentinels
- lru
firm_tags:
- ai-infra
statement: |
  Build an LRU cache from primitives you write yourself: no `OrderedDict`, no `collections.deque`.

  `Node(key, val)` has attributes `key`, `val`, `prev`, `next`.

  `DList` is a doubly linked list with sentinel head and tail (front = least recent, back = most
  recent):
  - `push_back(node)`: append a detached node.
  - `unlink(node)`: remove a node that is in the list (O(1), no search).
  - `pop_front()` -> the removed front node, or `None` if empty.
  - `move_to_back(node)`: unlink then push_back.
  - `len(dl)` and `keys()` -> list of keys from front to back.

  `LRUCache(capacity)` uses a dict plus a `DList`:
  - `get(key)` -> value or `-1`; a hit becomes most recent.
  - `put(key, val)`: insert/update (becomes most recent); when size exceeds `capacity` evict the
    front node. `capacity <= 0` stores nothing.
  - `order()` -> keys from least to most recent.

  Example
  ```python
  c = LRUCache(2); c.put(1, 1); c.put(2, 2); c.get(1); c.put(3, 3)
  c.get(2) == -1; c.order() == [1, 3]
  ```
