tests:
- name: dlist primitives
  tags:
  - ordering
  - empty
  code: |
    d = DList()
    assert len(d) == 0 and d.keys() == [] and d.pop_front() is None
    a, b, c = Node("a", 1), Node("b", 2), Node("c", 3)
    for n in (a, b, c):
        d.push_back(n)
    assert d.keys() == ["a", "b", "c"] and len(d) == 3
    d.unlink(b)
    assert d.keys() == ["a", "c"] and b.prev is None and b.next is None
    d.move_to_back(a)
    assert d.keys() == ["c", "a"]
    assert d.pop_front() is c and d.keys() == ["a"]
    assert d.pop_front() is a and len(d) == 0 and d.pop_front() is None
    d.push_back(b)
    assert d.keys() == ["b"]
- name: lru example
  tags:
  - ordering
  - boundary
  code: |
    c = LRUCache(2)
    c.put(1, 1); c.put(2, 2)
    assert c.get(1) == 1
    c.put(3, 3)
    assert c.get(2) == -1
    assert c.order() == [1, 3]
    c.put(4, 4)
    assert c.get(1) == -1 and c.get(3) == 3 and c.get(4) == 4
    assert c.order() == [3, 4]
- name: update existing key
  tags:
  - duplicate
  - state-reuse
  code: |
    c = LRUCache(2)
    c.put("a", 1); c.put("b", 2)
    c.put("a", 10)
    assert c.order() == ["b", "a"]
    c.put("c", 3)
    assert c.get("b") == -1 and c.get("a") == 10
    assert len(c.map) == 2
- name: capacity edge cases
  tags:
  - zero-capacity
  - single
  code: |
    z = LRUCache(0)
    z.put(1, 1)
    assert z.get(1) == -1 and z.order() == []
    o = LRUCache(1)
    o.put(1, 1); o.put(2, 2)
    assert o.get(1) == -1 and o.get(2) == 2 and o.order() == [2]
- name: heavy churn stays consistent
  hidden: true
  tags:
  - scale
  - ordering
  code: |
    import random
    r = random.Random(4)
    c = LRUCache(50)
    model = []
    for _ in range(20000):
        k = r.randrange(120)
        if r.random() < 0.5:
            v = c.get(k)
            assert (v != -1) == (k in model)
            if k in model:
                model.remove(k); model.append(k)
        else:
            c.put(k, k)
            if k in model: model.remove(k)
            model.append(k)
            if len(model) > 50: model.pop(0)
    assert c.order() == model and len(model) == 50
complexity:
- op: get
  time: O(1)
  space: O(n)
- op: put
  time: O(1)
  space: O(n)
- op: unlink
  time: O(1)
  space: O(1)
extensions:
- q: Why can't a singly linked list or array do this in O(1)?
  kind: complexity
  key_points:
  - 'Unlinking an arbitrary node needs its predecessor: a doubly linked list gives it in O(1)'
  - The dict provides O(1) key -> node, so no search is needed
  - 'Space is O(capacity): one node and one dict entry per key'
- q: Why sentinel nodes?
  kind: design
  key_points:
  - They remove empty-list and end-of-list branches from push, unlink and pop
  - Fewer branches means fewer pointer bugs
  - A circular list with a single sentinel is an equivalent trick
- q: Make it thread-safe, and then scale it.
  kind: design
  key_points:
  - One lock around get/put is correct because get mutates order
  - Sharded caches (hash key -> shard) with a lock per shard
  - Approximate LRU (CLOCK, sampling) avoids list updates on every read
- q: Where do pointer bugs usually appear?
  kind: reasoning
  key_points:
  - Order of pointer updates when splicing; clear the removed node's links
  - Forgetting to delete the evicted key from the dict (node.key exists for exactly this reason)
  - Updating an existing key must move it, not insert a duplicate node
narration: []
state_aloud:
- Existing key put refreshes recency without growing the list.
- Evicted key must leave the dict too.
- Capacity 0 and 1 edge cases.
- State that get counts as a use.
walkthrough: A doubly linked list with sentinel head/tail keeps keys in recency order (front is least
  recent) and a dict maps keys to their nodes. get and put move the touched node to the back in O(1) by
  unlinking it using its own prev/next pointers; when the size exceeds capacity the front node is popped
  and its key deleted from the dict. All operations are O(1).
