id: insert-delete-getrandom-o1
title: Insert Delete GetRandom O(1)
bar_level: 2
target_minutes: 22
patterns:
- hash-map
- array-swap-delete
- randomized
firm_tags: []
statement: |
  Implement `RandomizedSet(rng=None)` (LeetCode 380) with average O(1) operations. `rng` is a
  `random.Random` instance (default: a new `random.Random()`); use only `self.rng` for randomness.

  - `insert(val)` -> `True` if `val` was absent and is now added, else `False`.
  - `remove(val)` -> `True` if present and now removed, else `False`.
  - `get_random()` -> a uniformly random current element (each element equally likely). Calling
    it on an empty set raises `IndexError`.
  - `len(s)` returns the number of elements.

  Example
  ```python
  s = RandomizedSet(random.Random(0)); s.insert(1) -> True; s.insert(1) -> False
  s.insert(2); s.remove(1) -> True; s.get_random() -> 2
  ```
starter: |
  import random

  class RandomizedSet:
      def __init__(self, rng=None):
