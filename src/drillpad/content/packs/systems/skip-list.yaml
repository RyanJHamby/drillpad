tests:
- name: basic ordered set
  tags:
  - ordering
  - duplicate
  code: |
    import random
    sl = SkipList(rng=random.Random(1))
    assert len(sl) == 0 and list(sl) == []
    assert [sl.add(x) for x in (5, 1, 3, 3, 5)] == [True, True, True, False, False]
    assert list(sl) == [1, 3, 5] and len(sl) == 3
    assert 3 in sl and 4 not in sl
    assert sl.remove(3) is True and sl.remove(3) is False and 3 not in sl
    assert list(sl) == [1, 5]
- name: ceiling and range
  tags:
  - boundary
  - ordering
  code: |
    import random
    sl = SkipList(rng=random.Random(2))
    for x in (10, 20, 30, 40):
        sl.add(x)
    assert sl.ceiling(5) == 10 and sl.ceiling(20) == 20 and sl.ceiling(21) == 30
    assert sl.ceiling(41) is None
    assert sl.range_query(10, 40) == [10, 20, 30]
    assert sl.range_query(11, 20) == []
    assert sl.range_query(0, 100) == [10, 20, 30, 40]
    assert sl.range_query(50, 60) == []
- name: empty and single
  tags:
  - empty
  - single
  code: |
    import random
    sl = SkipList(rng=random.Random(3))
    assert sl.ceiling(1) is None and sl.range_query(0, 10) == [] and sl.remove(1) is False
    assert 1 not in sl
    sl.add(1)
    assert list(sl) == [1] and sl.ceiling(0) == 1
    sl.remove(1)
    assert len(sl) == 0 and list(sl) == []
    sl.add(2)
    assert list(sl) == [2]
- name: matches sorted model
  hidden: true
  tags:
  - scale
  - state-reuse
  code: |
    import random
    r = random.Random(11)
    sl = SkipList(rng=random.Random(5))
    model = set()
    for _ in range(4000):
        x = r.randrange(300)
        if r.random() < 0.55:
            assert sl.add(x) == (x not in model); model.add(x)
        else:
            assert sl.remove(x) == (x in model); model.discard(x)
        if r.random() < 0.05:
            assert list(sl) == sorted(model) and len(sl) == len(model)
    lo, hi = 50, 120
    assert sl.range_query(lo, hi) == sorted(k for k in model if lo <= k < hi)
    assert all((k in sl) == (k in model) for k in range(300))
    c = sl.ceiling(77)
    assert c == min((k for k in model if k >= 77), default=None)
    assert len(model) > 10
- name: correct for degenerate rng
  hidden: true
  tags:
  - boundary
  - ordering
  code: |
    class Const:
        def __init__(self, v): self.v = v
        def random(self): return self.v
    for v in (0.99, 0.0):         # all level 1 (a linked list) and all max level
        sl = SkipList(max_level=4, rng=Const(v))
        for x in (4, 2, 9, 7, 1):
            sl.add(x)
        assert list(sl) == [1, 2, 4, 7, 9] and sl.ceiling(5) == 7
        sl.remove(4); sl.remove(9)
        assert list(sl) == [1, 2, 7] and 9 not in sl
- name: sorted insert is logarithmic
  hidden: true
  tags:
  - scale
  - ordering
  code: |
    import random, time
    sl = SkipList(rng=random.Random(9))
    t0 = time.monotonic()
    for i in range(20000):
        sl.add(i)
    assert len(sl) == 20000 and sl.ceiling(19999) == 19999
    assert all(i in sl for i in range(0, 20000, 97))
    assert time.monotonic() - t0 < 6
