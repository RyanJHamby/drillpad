extensions:
- q: Expected and worst-case costs, and the space overhead?
  kind: complexity
  key_points:
  - Search/insert/delete are O(log n) expected; worst case is O(n) if the random levels degenerate
  - 'Expected space O(n): average pointers per node is 1/(1-p) = 2 for p = 0.5'
  - range_query is O(log n + k) because it seeks once then walks level 0
- q: Why do databases (Redis sorted sets, LevelDB memtables) use skip lists instead of balanced trees?
  kind: design
  key_points:
  - 'Simpler code: no rotations; ordered iteration and range scans are a linked-list walk'
  - 'Concurrent versions are easier: lock-free insertion by CAS on individual next pointers'
  - 'Trade-off: worse cache locality than B-trees and probabilistic rather than guaranteed bounds'
- q: How would you make it thread-safe?
  kind: design
  key_points:
  - Coarse reader-writer lock is correct but limits scalability
  - Lock-free (CAS on next pointers with marked-for-deletion bits, as in Java's ConcurrentSkipListMap)
  - Readers can traverse without locks if nodes are never freed while visible (epoch-based reclamation)
- q: How do you pick p and max_level?
  kind: reasoning
  key_points:
  - p = 1/2 or 1/4; smaller p means fewer pointers but longer expected search
  - max_level ~ log_{1/p}(N_max); 16 levels covers about 65k keys at p=1/2, 32 for billions
  - Inject the RNG so tests are deterministic
narration: []
state_aloud:
- Expected, not worst-case, O(log n).
- Duplicate adds return False.
- Correctness must not depend on the random levels.
- Update array defaults to head for levels above the current height.
walkthrough: Nodes carry a random height and an array of forward pointers; a head sentinel has the maximum
  height. Every operation walks from the highest active level downwards, moving right while the next key
  is smaller, and records the predecessor at each level. add and remove splice nodes into or out of each
  level they occupy using those predecessors; membership, ceiling and range queries use the level-0 successor.
  Expected O(log n) per operation.
