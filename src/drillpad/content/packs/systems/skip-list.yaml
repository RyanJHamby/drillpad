statement: |
  Implement `SkipList(p=0.5, max_level=16, rng=None)`, an ordered set of comparable keys. `rng` is
  a `random.Random` (default `random.Random()`); use only `rng.random()` for coin flips: a new node
  gets level 1, and while `rng.random() < p` and level < `max_level` its level increases by one.

  - `add(key)` -> `True` if inserted, `False` if already present.
  - `remove(key)` -> `True` if removed, `False` if absent.
  - `key in sl` (`__contains__`), `len(sl)`, iteration in ascending order (`__iter__`).
  - `ceiling(key)` -> smallest stored key `>= key`, or `None`.
  - `range_query(lo, hi)` -> list of keys with `lo <= k < hi` in ascending order.
  - Search must start from the highest level and drop down (expected O(log n)); correctness must
    not depend on the random levels (even if `rng.random()` is constant).

  Example
  ```python
  sl = SkipList(rng=random.Random(1)); [sl.add(x) for x in (5, 1, 3)]
  list(sl) == [1, 3, 5]; sl.ceiling(2) == 3; sl.range_query(1, 5) == [1, 3]
  ```
