prelude: |
  import threading

  _MISSING = object()


  class FakeClock:
      def __init__(self):
          self.t = 0

      def __call__(self):
          return self.t

      def advance(self, dt):
          self.t += dt


  class FakeBackend:
      """fetch(key) -> value, raises KeyError for absent keys. Records every call."""

      def __init__(self, data=None):
          self.data = dict(data or {})
          self.calls = []
          self.stores = []
          self.fail = None
          self.store_fail = None
          self.gate = None
          self.entered = threading.Event()
          self._lock = threading.Lock()

      def fetch(self, key):
          with self._lock:
              self.calls.append(key)
          self.entered.set()
          err = self.fail
          val = self.data.get(key, _MISSING)
          if self.gate is not None:
              self.gate.wait(5)
          if err is not None:
              raise err
          if val is _MISSING:
              raise KeyError(key)
          return val

      def store(self, key, value):
          if self.store_fail is not None:
              raise self.store_fail
          self.stores.append((key, value))
          self.data[key] = value
statement: |
  **Interview prompt (deliberately vague):** "A service reads from a slow backend. Design a cache in front of it."

  In a real interview you would spend the first minutes asking questions: how big is the key space, how stale may data be, who writes, what happens when the backend is down or a hot key expires. The *extensions* below are those questions and the trade-offs behind them; read them before you start coding. To make the exercise gradable, assume these answers and implement the class:

  ```python
  class Cache:
      def __init__(self, backend, capacity, ttl, clock): ...
      def get(self, key): ...          # value, or raises KeyError if the backend has no such key
      def write(self, key, value): ... # write-through
      def invalidate(self, key): ...
      def stats(self): ...             # {"hits": int, "misses": int}
  ```

  `backend.fetch(key)` returns the value, raises `KeyError` for an absent key, and may raise any other exception. `backend.store(key, value)` persists a value. `clock()` returns the current time (a number); the tests inject a fake one.

  - **Hit / TTL.** A fresh entry is served without calling the backend. An entry stored at time `t0` is expired when `clock() - t0 >= ttl`. Hits do not extend the TTL.
  - **Bounded capacity.** At most `capacity` entries (negative entries included). Evict the least recently used entry (a hit or insert counts as use). `capacity < 1` raises `ValueError`.
  - **Negative caching.** If the backend raises `KeyError`, cache that absence for `ttl` too and re-raise `KeyError` on later gets without calling the backend.
  - **Errors.** Any other backend exception propagates to the caller and is never cached; the next get tries the backend again.
  - **Single flight.** Concurrent `get`s for the same missing key must trigger exactly one backend fetch. The waiters receive the leader's value, or the leader's exception if it failed. Never hold your lock while calling the backend.
  - **Writes.** `write` calls `backend.store`, then caches the new value with a fresh TTL. If `store` raises, the cache is unchanged and the error propagates. `invalidate` drops the entry (positive or negative). A fetch that was already in flight when `write` or `invalidate` happened must not install its stale result into the cache.
  - **Metrics.** `misses` counts gets that started a backend fetch; `hits` counts every other get (fresh entry, negative entry, or joining an in-flight fetch).
