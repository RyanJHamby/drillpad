extensions:
- q: What do acquire/release cost and how does the pool bound memory?
  kind: complexity
  key_points:
  - 'Both O(1): list pop/append plus a dict update under the lock'
  - Live connections are capped at max_size so space is O(max_size)
  - Validation on checkout adds a cost per borrow (a network round trip if it pings)
- q: How do you handle broken connections, idle timeouts and warm-up?
  kind: design
  key_points:
  - Validate on borrow or in a background reaper; discard and replace stale connections
  - min_idle keeps some connections warm; max idle time shrinks the pool after load
  - Max lifetime recycles connections so load balancers and DNS changes take effect
- q: 'Fairness and starvation: who gets a released connection?'
  kind: design
  key_points:
  - Condition.notify wakes an arbitrary waiter; use a FIFO queue of waiters for strict fairness
  - LIFO reuse of idle connections keeps hot ones hot and lets cold ones expire
  - Per-tenant limits prevent one caller from taking the whole pool
- q: What are the classic pool bugs?
  kind: reasoning
  key_points:
  - 'Leaked connections when release is skipped on exceptions: use a context manager'
  - Releasing a connection twice or one from another pool corrupts accounting
  - Failed factory calls must roll back the live count or the pool shrinks permanently
narration: []
state_aloud:
- Never exceed max_size even when factory is slow or fails.
- Timeout raises TimeoutError, not None.
- 'Double or foreign release is a bug: raise.'
- Validate stale idle connections before handing them out.
walkthrough: One Condition protects an idle list, a map of checked-out connections and a live count. acquire
  first reuses a valid idle connection (discarding invalid ones), then creates a new one while the live
  count is below max_size, and otherwise waits until a release or the deadline. release validates ownership,
  pushes the connection back and notifies one waiter. close_all closes idle connections and releases later
  returns close immediately.
