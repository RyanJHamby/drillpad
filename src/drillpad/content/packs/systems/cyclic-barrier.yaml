id: cyclic-barrier
title: Barrier / Latch
bar_level: 4
target_minutes: 42
patterns:
- barrier
- latch
- condition-variable
- generation-counter
firm_tags:
- distsys
- ai-infra
statement: |
  Implement two synchronisers from `threading.Condition` (do not use `threading.Barrier`):

  `CyclicBarrier(parties, action=None)`
  - `wait(timeout=None)` -> int: block until `parties` threads have called `wait`. Returns this
    caller's arrival index: the first arriver gets `parties - 1`, the last gets `0`.
  - When the last thread arrives it runs `action()` (if given) exactly once, in its own thread,
    BEFORE any waiter is released.
  - The barrier is reusable: after all are released it starts a new generation, and threads of
    one generation must never be released by arrivals of the next.
  - If `timeout` expires, the barrier is broken: this and all other waiting threads (and any later
    callers) get `BrokenBarrierError`. `parties < 1` raises `ValueError`.

  `CountDownLatch(count)`
  - `count_down()`: decrement (never below 0); at 0 all waiters are released.
  - `wait(timeout=None)` -> `True` once the count is 0, `False` if the timeout expires first.
  - `get_count()` -> current count.

  Example
  ```python
  b = CyclicBarrier(3)          # three threads each call b.wait()
  l = CountDownLatch(2); l.count_down(); l.count_down(); l.wait() -> True
  ```
starter: |
  import threading

  class BrokenBarrierError(Exception):
      pass

  class CyclicBarrier:
      def __init__(self, parties, action=None):
          pass

      def wait(self, timeout=None):
          pass

  class CountDownLatch:
      def __init__(self, count):
          pass

      def count_down(self):
          pass

      def wait(self, timeout=None):
          pass

      def get_count(self):
          pass
hints:
- Use one Condition; count arrivals and keep a generation number that increments each time the barrier
  trips.
- Waiters loop until the generation changes (or the barrier is broken), with a deadline for timeouts.
- arrival index = parties - 1 - number already arrived. Latch is a counter with notify_all at 0.
