id: non-overlapping-intervals
title: Non-overlapping Intervals
bar_level: 2
target_minutes: 25
patterns:
- intervals
- greedy
firm_tags: []
categories:
- leetcode
anki_queries:
- deck:"HFT LeetCode 150" "Front:Non-overlapping Intervals (LC 435)"
statement: |
  Given a list of intervals `[start, end]`, return the minimum number of intervals to remove so the rest do not overlap. Intervals that merely touch (one ends exactly where another starts) do not overlap.

  Example: `erase_overlap_intervals([[1,2],[2,3],[3,4],[1,3]])` returns `1` (remove `[1,3]`).
starter: |
  def erase_overlap_intervals(intervals):
      pass
hints:
- 'Equivalent: keep the maximum number of mutually non-overlapping intervals; the answer is n minus that.'
- This is activity selection. Which sort key lets a single left-to-right pass pick correctly?
- Sort by end. Keep an interval if its start >= the last kept end; otherwise count a removal.
follow_ups:
- Return the removed intervals.
- 'Weighted version: maximise total weight kept.'
tests:
- name: classic
  tags:
  - ordering
  code: |
    assert erase_overlap_intervals([[1,2],[2,3],[3,4],[1,3]]) == 1
- name: all identical
  tags:
