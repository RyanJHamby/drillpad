anki_queries:
- deck:"HFT LeetCode 150" "Front:Coin Change II (LC 518)"
statement: |
  Given `amount` and a list of coin denominations `coins` (unlimited supply of each), return the number of distinct combinations that sum to `amount`. Order does not matter: `1+2` and `2+1` are the same combination. Amount 0 has exactly one combination (use nothing).

  Example: `coin_change_ii(5, [1,2,5])` returns `4`.
starter: |
  def coin_change_ii(amount, coins):
      pass
hints:
- 'Decide coin by coin: for each coin type, how many copies go in?'
- 'State: ways[i][a] = combinations using the first i coin types to make a. Collapses to one row.'
- ways[0] = 1; loop coins in the OUTER loop and amounts ascending to count combinations, not permutations.
follow_ups:
- Count ordered sequences instead.
- Fewest coins (Coin Change)?
