complexity:
- op: overall
  time: O(amount * n)
  space: O(amount)
  accepted_space:
  - O(amount * n)
extensions:
- q: Complexity
  kind: complexity
  key_points:
  - amount times number of coin types
  - One array of size amount+1
  - 2D table is O(amount*n) space
- q: Why coin loop is outer
  kind: code
  key_points:
  - Fixing the coin order counts each multiset once
  - Swapping loops counts ordered sequences
  - dp[a] += dp[a-c] with ascending a allows reuse
- q: Huge amounts
  kind: design
  key_points:
  - Counts are polynomial in amount so big ints grow
  - Use a modulus if asked
  - For many queries, reuse the table up to the max amount
narration: []
state_aloud:
- Amount 0 has one way.
- Combinations, not permutations.
- No coins and positive amount gives 0.
walkthrough: Let `ways[a]` count the combinations of the coins processed so far that sum to `a`, with `ways[0] = 1`. Process one coin type at a time and for each amount ascending do `ways[a] += ways[a - c]`; that allows reusing the coin while the outer loop over coins fixes an order so each multiset is counted once. Time O(amount * coins), space O(amount).
