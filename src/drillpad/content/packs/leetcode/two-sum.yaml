  hidden: true
  code: |
    nums=list(range(1,200001))
    r=two_sum(nums,399999)
    assert r==[199998,199999]
complexity:
- op: overall
  time: O(n)
  space: O(n)
extensions:
- q: Sorted input and O(1) extra space?
  kind: design
  key_points:
  - Two pointers from both ends
  - Move left up when sum too small, right down when too large
  - O(n) time, O(1) space, but returns values/positions only in sorted order
- q: Why is the one-pass hash map O(n)?
  kind: complexity
  key_points:
  - Each element does one O(1) average lookup and one insert
  - Worst-case hash collisions degrade to O(n^2) in theory
  - Space is O(n) for the map
- q: Return all distinct pairs instead?
  kind: reasoning
  key_points:
  - Track seen values and a set of emitted pairs to avoid duplicates
  - Counts matter when the complement equals the element itself
  - Output size can be O(n^2) so complexity changes
narration: []
state_aloud:
- Duplicates that pair with each other (3+3).
- Negative numbers and zeros.
- Same index must not be reused.
- Whether a guaranteed answer exists; what to return otherwise.
walkthrough: |
  Scan once, keeping a map from value to index for everything seen so far. For each element compute the complement `target - x`; if it is already in the map, the stored index and the current index are the answer. Otherwise record the current element. Looking up before inserting prevents pairing an element with itself and still handles duplicate pairs like `[3, 3]`.
