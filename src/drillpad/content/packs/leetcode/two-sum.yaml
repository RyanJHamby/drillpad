anki_queries:
- deck:"HFT LeetCode 150" "Front:Two Sum (LC 1)"
statement: |
  Given a list of integers `nums` and an integer `target`, return the indices `[i, j]` (with `i < j`) of the two entries that add up to `target`. Exactly one valid pair exists in every input. You may not use the same element twice.

  Example: `two_sum([2, 7, 11, 15], 9)` returns `[0, 1]` because `2 + 7 == 9`.
starter: |
  def two_sum(nums, target):
      pass
hints:
- For each number, what single value would complete the pair?
- Checking 'have I seen the complement?' in a hash map is O(1) instead of rescanning the list.
- Look up the complement before inserting the current element so an element can't pair with itself.
follow_ups:
- What if the array is sorted and you must use O(1) space?
- What if several pairs may exist and you must return all of them?
tests:
- name: basic
  tags:
  - ordering
  code: |
    assert two_sum([2,7,11,15],9)==[0,1]
- name: pair not at the front
  tags:
  - boundary
  code: |
    assert two_sum([3,2,4],6)==[1,2]
- name: duplicate values form the pair
  tags:
  - duplicate
  code: |
