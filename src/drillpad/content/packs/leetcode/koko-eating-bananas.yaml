anki_queries:
- deck:"HFT LeetCode 150" "Front:Koko Eating Bananas (LC 875)"
statement: |
  There are piles of bananas, `piles[i]` in pile i, and `h` hours. Each hour Koko picks one pile and eats up to `k` bananas from it (if the pile has fewer, she finishes it and wastes the rest of the hour). Return the smallest integer eating speed `k` that finishes everything within `h` hours. It is guaranteed `h >= len(piles)`.

  Example: `min_speed([3,6,7,11], 8)` returns `4`.
starter: |
  def min_speed(piles, h):
      pass
hints:
- Time needed is non-increasing as k grows, so the feasibility is monotonic.
- Binary search over the answer k between 1 and max(piles).
- feasible(k) sums ceil(pile / k) and compares with h.
follow_ups:
- Where else does 'binary search on the answer' apply?
- What if the hours were fractional?
