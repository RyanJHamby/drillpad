complexity:
- op: overall
  time: O(n log m)
  space: O(1)
extensions:
- q: Complexity?
  kind: complexity
  key_points:
  - log(max pile) iterations of binary search
  - Each feasibility check is O(n)
  - Space O(1)
- q: Recognizing binary search on answer
  kind: reasoning
  key_points:
  - Answer space is ordered and feasibility is monotonic
  - Search the answer range instead of an array
  - 'Same shape: shipping capacity, split array largest sum'
- q: 'Design: batching GPU jobs with a throughput limit'
  kind: design
  key_points:
  - Treat max throughput as the searched parameter
  - feasible() simulates the schedule against a deadline
  - Use real-valued bounds with an epsilon or integer ticks
narration: []
state_aloud:
- Single pile.
- h exactly equals the number of piles (answer is the largest pile).
- Ceiling division, not floor.
- 'Large values: avoid float division.'
walkthrough: |
  The minimum speed lies between 1 and the largest pile, and finishing time never increases as the speed rises. Binary search that range with a feasibility check that sums `ceil(pile / k)` hours over all piles. If it fits within `h`, try a smaller speed; otherwise go higher. The first feasible speed is the answer.
