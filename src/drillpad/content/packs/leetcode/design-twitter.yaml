id: design-twitter
title: Design Twitter
bar_level: 3
target_minutes: 40
patterns:
- heap-top-k
- hash-map
firm_tags:
- distsys
categories:
- leetcode
anki_queries:
- deck:"HFT LeetCode 150" "Front:Design Twitter (LC 355)"
statement: |
  Implement a simplified Twitter class with these operations (all user and tweet ids are integers):

  - `post_tweet(user_id, tweet_id)`: the user posts a tweet. Tweet ids are unique.
  - `get_news_feed(user_id)`: return the ids of the 10 most recent tweets in the user's feed, newest first. The feed contains the user's own tweets and tweets from users they follow.
  - `follow(follower_id, followee_id)` and `unfollow(follower_id, followee_id)`.

  Following yourself or unfollowing someone you do not follow is a no-op. A user always sees their own tweets.

  Example: user 1 posts 5; `get_news_feed(1)` is `[5]`; user 1 follows 2 who posted 6 later; the feed becomes `[6, 5]`.
starter: |
  class Twitter:
      def __init__(self):
          pass

      def post_tweet(self, user_id, tweet_id):
          pass

      def get_news_feed(self, user_id):
          pass

      def follow(self, follower_id, followee_id):
          pass

      def unfollow(self, follower_id, followee_id):
          pass
hints:
- Store each user's tweets in order with a global timestamp, and each user's followee set.
- The feed is a merge of already-sorted per-user lists, newest first.
- Use a heap holding one candidate (the newest unread tweet) per followed user and pop 10 times.
follow_ups:
- 'Feeds are read far more often than tweets are written: how would you change the design?'
- How would you shard this across machines?
tests:
- name: example from the statement
  tags:
  - ordering
  code: |
    t = Twitter()
    t.post_tweet(1, 5)
    assert t.get_news_feed(1) == [5]
    t.post_tweet(2, 6)
    t.follow(1, 2)
    assert t.get_news_feed(1) == [6, 5]
    t.unfollow(1, 2)
    assert t.get_news_feed(1) == [5]
- name: unknown user has an empty feed
  tags:
  - empty
  code: |
    t = Twitter()
    assert t.get_news_feed(99) == []
    t.follow(99, 1)
    assert t.get_news_feed(99) == []
- name: feed limited to 10 newest
  tags:
  - boundary
  code: |
    t = Twitter()
    for i in range(1, 16):
        t.post_tweet(1, i)
    assert t.get_news_feed(1) == list(range(15, 5, -1))
- name: interleaves followees by time
  tags:
  - ordering
  code: |
    t = Twitter()
    t.follow(1, 2); t.follow(1, 3)
    t.post_tweet(2, 10); t.post_tweet(3, 11); t.post_tweet(1, 12); t.post_tweet(2, 13)
    assert t.get_news_feed(1) == [13, 12, 11, 10]
    assert t.get_news_feed(2) == [13, 10]
- name: self follow and repeated follow are harmless
  tags:
  - duplicate
  code: |
    t = Twitter()
    t.post_tweet(1, 1)
    t.follow(1, 1)
    t.follow(1, 2); t.follow(1, 2)
    t.post_tweet(2, 2)
    assert t.get_news_feed(1) == [2, 1]
    t.unfollow(1, 2)
    assert t.get_news_feed(1) == [1]
- name: unfollow edge cases keep own tweets
  tags:
  - invalid
  code: |
    t = Twitter()
    t.post_tweet(1, 7)
    t.unfollow(1, 1)
    t.unfollow(1, 5)
    assert t.get_news_feed(1) == [7]
    t.follow(2, 1)
    t.unfollow(2, 1)
    t.unfollow(2, 1)
    assert t.get_news_feed(2) == []
- name: re-follow after unfollow
  tags:
  - state-reuse
  code: |
    t = Twitter()
    t.post_tweet(2, 1)
    t.follow(1, 2)
    t.unfollow(1, 2)
    t.follow(1, 2)
    assert t.get_news_feed(1) == [1]
- name: big fan-out feed
  hidden: true
  tags:
  - scale
  code: |
    t = Twitter()
    U, R = 1000, 100
    for r in range(R):
        for u in range(1, U + 1):
            t.post_tweet(u, r * U + u)
    for u in range(1, U + 1):
        t.follow(0, u)
    exp = list(range(100000, 99990, -1))
    for _ in range(300):
        assert t.get_news_feed(0) == exp
complexity:
- op: post_tweet
  time: O(1)
  space: O(1)
- op: get_news_feed
  time: O(f + 10 log f)
  space: O(f)
- op: follow
  time: O(1)
  space: O(1)
- op: unfollow
  time: O(1)
  space: O(1)
extensions:
- q: Why not merge and sort all tweets for a feed?
  kind: complexity
  key_points:
  - That touches every tweet of every followee
  - Cost is O(T log T) per read for T total tweets
  - The heap merge reads only about 10 tweets plus f seeds
- q: Read-heavy workload design?
  kind: design
  key_points:
  - 'Fan-out on write: push each tweet into followers'' feed caches'
  - 'Hybrid for celebrity accounts: fan-out on read for them'
  - Trade write amplification against read latency
- q: Why a global timestamp, not wall-clock time?
  kind: reasoning
  key_points:
  - Ordering needs a strict total order on tweets
  - A counter never ties, unlike coarse timestamps
  - In a distributed system use sortable ids (e.g. Snowflake style)
narration: []
state_aloud:
- Fewer than 10 tweets in the feed.
- Users who never posted or do not exist.
- Self follow/unfollow and duplicate follows.
- Unfollow must not hide your own tweets.
walkthrough: |
  Keep a global counter for ordering, a dict of per-user tweet lists (timestamp, id) and a dict of followee sets. For a feed, take the user plus their followees, seed a max-heap (negated timestamp) with each user's newest tweet, and pop up to 10 times, pushing the popped user's next older tweet each time. This is a k-way merge of sorted lists that never reads more than needed.
