complexity:
- op: overall
  time: O(n)
  space: O(1)
extensions:
- q: Complexity
  kind: complexity
  key_points:
  - Single pass over the digits
  - O(1) space with two rolling values
  - Table form is O(n) space
- q: Wildcard '*' (Decode Ways II)
  kind: code
  key_points:
  - Each state now multiplies by the count of digits a chunk can take
  - Track 1-digit and 2-digit multipliers for '*'
  - Apply a modulus
- q: Enumerate the decodings
  kind: design
  key_points:
  - Count is exponential so output is too
  - Use backtracking guided by the DP to prune dead branches
  - Generate lazily to bound memory
narration: []
state_aloud:
- Empty string returns 0 here.
- A zero can only be the second digit of 10 or 20.
- Two-digit chunk must be 10..26.
walkthrough: Let `ways[i]` be the number of decodings of the first `i` characters, with `ways[0] = 1`. If `s[i-1]` is not `'0'` add `ways[i-1]`; if the two characters ending at `i` form 10..26 add `ways[i-2]`. A lone zero adds nothing, which naturally yields 0 for invalid strings. Two rolling variables give O(n) time and O(1) space.
