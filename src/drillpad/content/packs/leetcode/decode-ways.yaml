anki_queries:
- deck:"HFT LeetCode 150" "Front:Decode Ways (LC 91)"
statement: |
  Letters map to numbers: `A=1, B=2, ..., Z=26`. Given a string `s` of digits, return how many ways it can be split into valid codes (no leading zeros, each part between 1 and 26). Return 0 if none, and 0 for an empty string.

  Example: `num_decodings("226")` returns `3` (`2 2 6`, `22 6`, `2 26`).
starter: |
  def num_decodings(s):
      pass
hints:
- The last chunk is either one digit (1-9) or two digits (10-26).
- 'State: ways[i] = number of decodings of the first i characters.'
- ways[0] = 1 (empty prefix); a '0' alone contributes nothing and must pair with the digit before it.
follow_ups:
- What if '*' can stand for any digit 1-9 (Decode Ways II)?
- Return the count modulo 10^9+7.
