id: rotate-image
title: Rotate Image
bar_level: 2
target_minutes: 20
patterns:
- matrix-simulation
firm_tags: []
categories:
- leetcode
anki_queries: []
statement: |
  Rotate an `n x n` matrix (list of lists) 90 degrees clockwise **in place**. The function must modify `matrix` itself and return `None`; do not allocate a second matrix.

  Example: `[[1,2,3],[4,5,6],[7,8,9]]` becomes `[[7,4,1],[8,5,2],[9,6,3]]`.
starter: |
  def rotate(matrix):
      pass
hints:
- Where does element (r, c) end up after a clockwise rotation? Write the mapping.
- A rotation equals a transpose followed by reversing each row.
- Or rotate layer by layer, cycling four cells at a time. Mind the loop bounds.
follow_ups:
- Rotate counter-clockwise.
- Rotate a non-square matrix (needs a new shape).
tests:
- name: 3x3
  tags:
  - boundary
  code: |
    m=[[1,2,3],[4,5,6],[7,8,9]]
    assert rotate(m) is None
    assert m==[[7,4,1],[8,5,2],[9,6,3]]
- name: 4x4
  tags:
  - boundary
  code: |
    m=[[5,1,9,11],[2,4,8,10],[13,3,6,7],[15,14,12,16]]
    assert rotate(m) is None
    assert m==[[15,13,2,5],[14,3,4,1],[12,6,8,9],[16,7,10,11]]
- name: 1x1
  tags:
  - single
  code: |
    m=[[7]]
    rotate(m)
    assert m==[[7]]
    m=[[1,2],[3,4]]
    rotate(m)
    assert m==[[3,1],[4,2]]
- name: 2x2
  tags:
  - boundary
  code: |
    m=[[1,2],[3,4]]
    rotate(m)
    assert m==[[3,1],[4,2]]
- name: empty matrix
  tags:
  - empty
  code: |
    m=[]
    assert rotate(m) is None
    assert m==[]
    m=[[1,2],[3,4]]
    rotate(m)
    assert m==[[3,1],[4,2]]
  hidden: true
- name: duplicates and negatives
  tags:
  - duplicate
  - invalid
  code: |
    m=[[0,0],[-1,0]]
    rotate(m)
    assert m==[[-1,0],[0,0]]
  hidden: true
- name: same outer list object and four rotations restore
  tags:
  - state-reuse
  code: |
    m=[[1,2,3],[4,5,6],[7,8,9]]
    o=m
    orig=[r[:] for r in m]
    rotate(m)
    assert m==[[7,4,1],[8,5,2],[9,6,3]]
    for _ in range(3):
        rotate(m)
    assert m is o and m==orig
  hidden: true
- name: large matrix
  tags:
  - scale
  code: |
    n = 700
    m = [[i * n + j for j in range(n)] for i in range(n)]
    exp = [list(r) for r in zip(*m[::-1])]
    rotate(m)
    assert m == exp
  hidden: true
complexity:
- op: overall
  time: O(n^2)
  space: O(1)
extensions:
- q: Derive the index mapping and the layer-cycle approach.
  kind: reasoning
  key_points:
  - (r, c) goes to (c, n-1-r) for a clockwise turn
  - 'Each cell belongs to a 4-cycle: (r,c),(c,n-1-r),(n-1-r,n-1-c),(n-1-c,r)'
  - Process layer by layer, rotating each of the n/2 layers' non-corner-duplicated cells
- q: 'Transpose plus reverse: why does it work and what is the cost?'
  kind: complexity
  key_points:
  - Transpose swaps (r,c) with (c,r), then reversing each row maps to (c, n-1-r)
  - 'Two passes of n^2/2 and n^2 operations: O(n^2) time'
  - O(1) extra space since both are in place
- q: 'Design: matrix is huge and stored on disk or tiled; how would you rotate?'
  kind: design
  key_points:
  - 'Rotate tile by tile: each tile moves to a mapped tile position and is rotated locally'
  - Read/write tiles in blocks to preserve locality
  - Out-of-place tile copies need O(tile) memory
- q: 'Counter-clockwise or 180 degrees: what changes?'
  kind: reasoning
  key_points:
  - 'CCW: transpose then reverse the column order (reverse the rows list first, then transpose)'
  - '180: reverse rows and reverse each row'
  - Mapping formulas change but complexity is the same
narration: []
state_aloud:
- Must be in place and return None.
- Empty and 1x1 matrices.
- Square matrix only.
walkthrough: |
  A clockwise quarter turn is a transpose followed by reversing each row. Swap `m[i][j]` with `m[j][i]` for j > i, then reverse every row. All work happens inside the existing lists, so no extra matrix is allocated; each cell is touched a constant number of times.
