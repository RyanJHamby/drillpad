id: median-of-two-sorted-arrays
title: Median of Two Sorted Arrays
bar_level: 3
target_minutes: 40
patterns:
- binary-search
firm_tags: []
categories:
- leetcode
anki_queries:
- deck:"HFT LeetCode 150" "Front:Median Two Sorted Arrays (LC 4)"
statement: |
  Given two sorted lists `a` and `b` (either may be empty, not both), return the median of all their elements combined as a float. If the combined count is even, the median is the mean of the two middle values. The target running time is O(log(min(m, n))).

  Example: `find_median_sorted_arrays([1,3], [2])` returns `2.0`; `find_median_sorted_arrays([1,2], [3,4])` returns `2.5`.
starter: |
  def find_median_sorted_arrays(a, b):
      pass
hints:
- Merging both lists and taking the middle is O(m + n); the goal is logarithmic.
- 'Binary search a partition of the smaller array: choose i elements from a and (half - i) from b for
  the left half.'
- The partition is correct when max(left of a, left of b) <= min(right of a, right of b); use +/- infinity
  at the edges.
follow_ups:
- How would you find the k-th smallest element of two sorted arrays?
- How would you handle k sorted arrays?
tests:
- name: odd total
  tags:
  - ordering
  code: |
    assert find_median_sorted_arrays([1,3],[2])==2.0
- name: even total
  tags:
  - boundary
  code: |
    assert find_median_sorted_arrays([1,2],[3,4])==2.5
- name: one empty array
  tags:
  - empty
  code: |
    assert find_median_sorted_arrays([],[1])==1.0
    assert find_median_sorted_arrays([2,4],[])==3.0
- name: both single
  tags:
  - single
  code: |
    assert find_median_sorted_arrays([1],[2])==1.5
- name: disjoint ranges
  tags:
  - invalid
  code: |
    assert find_median_sorted_arrays([1,2,3],[10,11,12])==6.5
    assert find_median_sorted_arrays([10,11,12],[1,2,3])==6.5
- name: duplicates across arrays
  tags:
  - duplicate
  code: |
    assert find_median_sorted_arrays([2,2,2],[2,2])==2.0
    assert find_median_sorted_arrays([1,1],[1,1,1,2])==1.0
- name: a million elements each
  tags:
  - scale
  hidden: true
  code: |
    a=list(range(0,2000000,2))
    b=list(range(1,2000000,2))
    assert find_median_sorted_arrays(a,b)==999999.5
    assert find_median_sorted_arrays(a,[])==999999.0
complexity:
- op: overall
  time: O(log(min(m, n)))
  space: O(1)
extensions:
- q: Why search only the smaller array?
  kind: complexity
  key_points:
  - Bounds the binary search to log(min(m,n))
  - Guarantees the other partition index is non-negative and in range
  - Swap the arrays at the start
- q: Generalise to the k-th smallest element.
  kind: design
  key_points:
  - Discard k/2 elements from one array each round
  - Recursion or iteration depth O(log k)
  - Median becomes k = (m+n)//2
- q: Correctness condition for a partition.
  kind: reasoning
  key_points:
  - Every left element <= every right element
  - Left half has ceil((m+n)/2) elements
  - Check only the four boundary values with sentinels
narration: []
state_aloud:
- One array may be empty.
- Even versus odd total length.
- Infinity sentinels at partition edges.
walkthrough: |
  Ensure `a` is the shorter list. Binary search `i`, the count taken from `a` into the left half; the left half needs `half = (m + n + 1) // 2` elements so `j = half - i` come from `b`. Compare boundaries `a[i-1]` vs `b[j]` and `b[j-1]` vs `a[i]` (using infinities past the ends) to move `i` until the partition is valid, then compute the median from the four boundary values.
