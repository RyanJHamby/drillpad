id: search-2d-matrix
title: Search a 2D Matrix
bar_level: 2
target_minutes: 20
patterns:
- binary-search
firm_tags: []
categories:
- leetcode
anki_queries:
- deck:"HFT LeetCode 150" "Front:Search 2D Matrix (LC 74)"
statement: |
  `matrix` is an m x n grid of integers where each row is sorted ascending and the first value of every row is greater than the last value of the previous row. Return `True` if `target` is in the matrix, else `False`, in O(log(m*n)) time.

  Example: `search_matrix([[1,3,5,7],[10,11,16,20],[23,30,34,60]], 3)` is `True`; with target `13` it is `False`.
starter: |
  def search_matrix(matrix, target):
      pass
hints:
- Reading the grid row by row yields one fully sorted sequence.
- Treat it as a flat array of length m*n and binary search on that index.
- Map flat index k to row k // n and column k % n.
follow_ups:
- 'Rows and columns each sorted but rows not chained (LC 240): what changes?'
- Binary search on rows first, then within the row.
tests:
- name: present
  tags:
  - ordering
  code: |
    m=[[1,3,5,7],[10,11,16,20],[23,30,34,60]]
    assert search_matrix(m,3) is True
- name: absent
  tags:
  - invalid
  code: |
    m=[[1,3,5,7],[10,11,16,20],[23,30,34,60]]
    assert search_matrix(m,13) is False
- name: empty matrix
  tags:
  - empty
  code: |
    assert search_matrix([],1) is False
    assert search_matrix([[]],1) is False
- name: single cell
  tags:
  - single
  code: |
    assert search_matrix([[5]],5) is True
    assert search_matrix([[5]],4) is False
- name: corners
  tags:
  - boundary
  code: |
    m=[[1,3,5,7],[10,11,16,20],[23,30,34,60]]
    assert search_matrix(m,1) is True
    assert search_matrix(m,60) is True
    assert search_matrix(m,0) is False
    assert search_matrix(m,61) is False
- name: single column and single row
  tags:
  - duplicate
  code: |
    assert search_matrix([[1],[3],[5]],3) is True
    assert search_matrix([[1,2,3]],4) is False
- name: large grid with many queries
  tags:
  - scale
  hidden: true
  code: |
    m=[[r*1000+c for c in range(1000)] for r in range(1000)]
    for t in range(0,1000000,7):
        assert search_matrix(m,t) is True
    assert search_matrix(m,-1) is False
    assert search_matrix(m,1000000) is False
complexity:
- op: overall
  time: O(log(m*n))
  space: O(1)
extensions:
- q: State the cost versus a row scan.
  kind: complexity
  key_points:
  - Flat binary search is O(log(m*n)) = O(log m + log n)
  - Linear scan is O(m*n)
  - Two-stage (rows then columns) has the same bound
- q: Rows and columns sorted but not chained.
  kind: design
  key_points:
  - Start at top-right corner
  - Move left when too large, down when too small
  - O(m + n) time
- q: Index mapping.
  kind: reasoning
  key_points:
  - row = k // n, col = k % n
  - Handle empty matrix and empty rows before computing n
  - No materialised flat array needed
narration: []
state_aloud:
- Empty matrix or empty row.
- Single row/column.
- Index mapping row = k // n.
walkthrough: |
  Because the rows chain in order, the matrix is one sorted sequence of `m*n` values. Binary search over flat indices `0..m*n-1`, converting `mid` into `matrix[mid // n][mid % n]` and comparing it to the target. No flattening copy is created.
