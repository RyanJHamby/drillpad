id: max-depth-binary-tree
title: Maximum Depth of Binary Tree
bar_level: 1
target_minutes: 10
patterns:
- tree-dfs
firm_tags: []
categories:
- leetcode
anki_queries:
- deck:"HFT LeetCode 150" "Front:Max Depth Binary Tree (LC 104)"
statement: |
  Return the number of nodes on the longest root-to-leaf path of a binary tree (0 for an empty tree). `TreeNode` and `build_tree(level_order_list)` (None marks a missing child) are provided in the starter.

  Example: `max_depth(build_tree([3,9,20,None,None,15,7]))` returns `3`.
prelude: |
  from collections import deque

  class TreeNode:
      def __init__(self, val=0, left=None, right=None):
          self.val = val
          self.left = left
          self.right = right

  def build_tree(vals):
      """Build a tree from a level-order list where None marks a missing child."""
      if not vals or vals[0] is None:
          return None
      root = TreeNode(vals[0])
      q, i = deque([root]), 1
      while q and i < len(vals):
          node = q.popleft()
          if i < len(vals) and vals[i] is not None:
              node.left = TreeNode(vals[i])
              q.append(node.left)
          i += 1
          if i < len(vals) and vals[i] is not None:
              node.right = TreeNode(vals[i])
              q.append(node.right)
          i += 1
      return root
starter: |
  def max_depth(root):
