complexity:
- op: overall
  time: O(n)
  space: O(h)
extensions:
- q: Iterative version?
  kind: code
  key_points:
  - Use an explicit stack of (node, depth)
  - Or BFS counting levels
  - Avoids Python recursion limits
- q: Space in terms of height
  kind: complexity
  key_points:
  - Recursion stack is O(h)
  - O(log n) balanced, O(n) skewed
  - 'Time O(n): each node visited once'
- q: Minimum depth pitfall
  kind: design
  key_points:
  - A node with one child is not a leaf
  - Cannot just take min of both sides when one is empty
  - BFS finds the first leaf and exits early
narration: []
state_aloud:
- Empty tree is 0.
- Skewed trees hit recursion limits.
- Define depth in nodes versus edges.
walkthrough: |
  The depth of a tree is 1 plus the larger depth of its left and right subtrees, with the empty tree contributing 0. A post-order recursion computes this directly, visiting every node once. Space is the call stack, proportional to the tree height.
