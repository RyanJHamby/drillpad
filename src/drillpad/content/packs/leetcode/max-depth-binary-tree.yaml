hints:
- A tree's depth is one more than the deeper of its two subtrees.
- The empty tree has depth 0, which is the recursion base case.
- Mind recursion limits on skewed trees; an explicit stack or BFS avoids them.
follow_ups:
- Do it iteratively.
- How would you compute the minimum depth, and why is that trickier?
