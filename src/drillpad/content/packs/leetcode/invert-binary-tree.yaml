id: invert-binary-tree
title: Invert Binary Tree
bar_level: 1
target_minutes: 10
patterns:
- tree-dfs
firm_tags: []
categories:
- leetcode
anki_queries:
- deck:"HFT LeetCode 150" "Front:Invert Binary Tree (LC 226)"
statement: |
  Mirror a binary tree: swap the left and right child of every node. Return the root of the inverted tree. `TreeNode` and `build_tree(level_order_list)` (None marks a missing child) are provided in the starter. `tree_to_list(root)` returns the level-order list for easy comparison.

  Example: `[4,2,7,1,3,6,9]` becomes `[4,7,2,9,6,3,1]`.
prelude: |
  from collections import deque

  class TreeNode:
      def __init__(self, val=0, left=None, right=None):
          self.val = val
          self.left = left
          self.right = right

  def build_tree(vals):
      """Build a tree from a level-order list where None marks a missing child."""
      if not vals or vals[0] is None:
          return None
      root = TreeNode(vals[0])
      q, i = deque([root]), 1
      while q and i < len(vals):
          node = q.popleft()
          if i < len(vals) and vals[i] is not None:
              node.left = TreeNode(vals[i])
              q.append(node.left)
          i += 1
          if i < len(vals) and vals[i] is not None:
              node.right = TreeNode(vals[i])
              q.append(node.right)
          i += 1
      return root

  def tree_to_list(root):
      """Level-order list with None for missing children (trailing Nones trimmed)."""
      out, q = [], deque([root])
      while q:
          n = q.popleft()
          if n is None:
              out.append(None)
              continue
          out.append(n.val)
          q.append(n.left)
          q.append(n.right)
      while out and out[-1] is None:
          out.pop()
      return out
