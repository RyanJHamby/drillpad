- deck:"HFT LeetCode 150" "Front:Longest Increasing Subsequence (LC 300)"
statement: |
  Return the length of the longest strictly increasing subsequence of `nums` (elements need not be adjacent, but keep their order). An empty list gives 0.

  Example: `length_of_lis([10,9,2,5,3,7,101,18])` returns `4` (for instance `2,3,7,18`).
starter: |
  def length_of_lis(nums):
      pass
hints:
- A subsequence ending at i extends one ending at an earlier, smaller value.
- 'State: dp[i] = length of the longest increasing subsequence ending at index i.'
- dp[i] = 1 + max(dp[j] for j<i with nums[j]<nums[i]), default 1. For speed keep a tails array and binary search.
follow_ups:
- Can you reach O(n log n)?
- Reconstruct one longest subsequence.
