complexity:
- op: overall
  time: O(n log n)
  space: O(n)
  accepted_time:
  - O(n^2)
extensions:
- q: Complexity of both approaches
  kind: complexity
  key_points:
  - Quadratic DP compares each pair
  - Patience sorting uses binary search for O(n log n)
  - Both use O(n) space
- q: Patience sorting tails array
  kind: code
  key_points:
  - tails[k] is the smallest tail of any increasing subsequence of length k+1
  - bisect_left replaces the first tail >= x
  - The length of tails is the answer; strictness comes from bisect_left
- q: Reconstruct the subsequence
  kind: design
  key_points:
  - Store predecessor indexes or the index in tails of each element
  - Walk back from the last tail
  - Tails itself is not a valid subsequence
narration: []
state_aloud:
- Strictly increasing so equal values do not extend.
- Empty input returns 0.
- Subsequence, not substring.
walkthrough: Define `tails[k]` as the smallest possible last value of an increasing subsequence of length `k+1`; it is always sorted. For each number, binary search the first tail that is not smaller (`bisect_left`) and overwrite it, or append if none exists. The final length of `tails` is the answer. This compresses the O(n^2) recurrence `dp[i] = 1 + max dp[j]` into O(n log n) time and O(n) space.
