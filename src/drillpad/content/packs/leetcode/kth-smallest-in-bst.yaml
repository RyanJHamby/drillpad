id: kth-smallest-in-bst
title: Kth Smallest Element in a BST
bar_level: 2
target_minutes: 20
patterns:
- tree-dfs
firm_tags: []
categories:
- leetcode
anki_queries:
- deck:"HFT LeetCode 150" "Front:Kth Smallest in BST (LC 230)"
statement: |
  Given the root of a binary search tree and an integer `k` (1-indexed, 1 <= k <= number of nodes), return the k-th smallest value in the tree. `TreeNode` and `build_tree(level_order_list)` (None marks a missing child) are provided in the starter.

  Example: `kth_smallest(build_tree([3,1,4,None,2]), 1)` returns `1`.
prelude: |
  from collections import deque

  class TreeNode:
      def __init__(self, val=0, left=None, right=None):
          self.val = val
          self.left = left
          self.right = right

  def build_tree(vals):
      """Build a tree from a level-order list where None marks a missing child."""
      if not vals or vals[0] is None:
          return None
      root = TreeNode(vals[0])
      q, i = deque([root]), 1
      while q and i < len(vals):
          node = q.popleft()
          if i < len(vals) and vals[i] is not None:
              node.left = TreeNode(vals[i])
              q.append(node.left)
          i += 1
          if i < len(vals) and vals[i] is not None:
              node.right = TreeNode(vals[i])
              q.append(node.right)
          i += 1
      return root
starter: |
  def kth_smallest(root, k):
