id: binary-tree-right-side-view
title: Binary Tree Right Side View
bar_level: 2
target_minutes: 15
patterns:
- tree-bfs
- tree-dfs
firm_tags: []
categories:
- leetcode
anki_queries:
- deck:"HFT LeetCode 150" "Front:Binary Tree Right Side View (LC 199)"
statement: |
  Imagine standing to the right of a binary tree. Return the values of the nodes you can see, from top to bottom (the last node on each level, even if it is a left child). `TreeNode` and `build_tree(level_order_list)` (None marks a missing child) are provided in the starter.

  Example: `right_view(build_tree([1,2,3,None,5,None,4]))` returns `[1,3,4]`.
prelude: |
  from collections import deque

  class TreeNode:
      def __init__(self, val=0, left=None, right=None):
          self.val = val
          self.left = left
          self.right = right

  def build_tree(vals):
      """Build a tree from a level-order list where None marks a missing child."""
      if not vals or vals[0] is None:
          return None
      root = TreeNode(vals[0])
      q, i = deque([root]), 1
      while q and i < len(vals):
          node = q.popleft()
          if i < len(vals) and vals[i] is not None:
              node.left = TreeNode(vals[i])
              q.append(node.left)
          i += 1
          if i < len(vals) and vals[i] is not None:
              node.right = TreeNode(vals[i])
              q.append(node.right)
          i += 1
      return root
