  code: |
    assert right_view(None)==[]
- name: only left children are visible
  tags:
  - boundary
  code: |
    assert right_view(build_tree([1,2,None,3]))==[1,2,3]
- name: single node
  tags:
  - single
  code: |
    assert right_view(build_tree([9]))==[9]
- name: left subtree deeper than right
  tags:
  - boundary
  code: |
    assert right_view(build_tree([1,2,3,4]))==[1,3,4]
- name: wide tree
  tags:
  - scale
  hidden: true
  code: |
    t=build_tree(list(range(1,65536)))
    assert right_view(t)==[1,3,7,15,31,63,127,255,511,1023,2047,4095,8191,16383,32767,65535]
complexity:
- op: overall
  time: O(n)
  space: O(w)
extensions:
- q: DFS with right-first order
  kind: code
  key_points:
  - Track depth; when depth == len(res) append the node
  - Visit right child before left
  - O(h) stack space instead of O(w)
- q: Complexity of the BFS version
  kind: complexity
  key_points:
  - Every node visited once, O(n)
  - Queue O(w) where w is max width
  - Output size O(h)
- q: Top or bottom view variants
  kind: design
  key_points:
  - Track horizontal distance per node
  - BFS keeps the first (top) or last (bottom) node per column
  - Sort columns at the end
narration: []
state_aloud:
- Empty tree.
- Left child visible when no right sibling exists on that level.
- Deeper left subtree beyond the right one.
walkthrough: |
  Do a level-order traversal and, for each level, keep only the last node dequeued. That is the node visible from the right, which may be a left child when the right side is shorter. The traversal touches every node once with a queue bounded by the tree's width.
