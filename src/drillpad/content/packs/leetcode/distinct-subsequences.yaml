id: distinct-subsequences
title: Distinct Subsequences
bar_level: 3
target_minutes: 38
patterns:
- dp-2d
firm_tags: []
categories:
- leetcode
anki_queries:
- deck:"HFT LeetCode 150" "Front:Distinct Subsequences (LC 115)"
statement: |
  Count how many different ways the string `t` appears as a subsequence of `s` (characters kept in order, not necessarily adjacent). Ways that use different index sets count separately even if they spell the same text. The empty `t` appears exactly once.

  Example: `num_distinct("rabbbit", "rabbit")` returns `3`.
starter: |
  def num_distinct(s, t):
      pass
hints:
- 'For the last character of s: either it is unused, or it matches the last character of t and is used.'
- 'State: ways[i][j] = number of ways s[:i] contains t[:j] as a subsequence.'
- ways[i][0] = 1 for all i (empty t); ways[0][j>0] = 0. ways[i][j] = ways[i-1][j] + (ways[i-1][j-1] if s[i-1]==t[j-1]).
follow_ups:
- Reduce to a single row.
- Return the answer modulo 10^9+7.
tests:
