complexity:
- op: overall
  time: O(m * n)
  space: O(n)
  accepted_space:
  - O(m * n)
extensions:
- q: Complexity
  kind: complexity
  key_points:
  - m*n states, O(1) per state
  - Rolling 1D array gives O(n) space
  - Brute force over subsets of s is 2^m
- q: 1D space optimisation
  kind: code
  key_points:
  - Iterate j downward so ways[j-1] still belongs to the previous row
  - ways[j] += ways[j-1] when characters match
  - Initialise ways[0] = 1
- q: Counts overflow
  kind: design
  key_points:
  - Counts grow exponentially in length
  - Python ints are exact; other languages need a modulus
  - Ask the interviewer which is expected
narration: []
state_aloud:
- Empty t appears once.
- Count index choices, not distinct strings.
- If t is longer than s the answer is 0.
walkthrough: Let `ways[i][j]` count subsequences of `s[:i]` equal to `t[:j]`. Either `s[i-1]` is skipped (`ways[i-1][j]`) or, if it equals `t[j-1]`, it is used to match (`ways[i-1][j-1]`). Base case `ways[i][0] = 1`. Updating one array with `j` descending yields O(m*n) time and O(n) space.
