anki_queries:
- deck:"HFT LeetCode 150" "Front:Daily Temperatures (LC 739)"
statement: |
  Given daily temperatures, return a list where `answer[i]` is how many days you must wait after day `i` for a strictly warmer temperature, or `0` if that never happens.

  Example: `wait_days([73,74,75,71,69,72,76,73])` returns `[1,1,4,2,1,1,0,0]`.
starter: |
  def wait_days(temps):
      pass
hints:
- Brute force scans ahead for each day, O(n^2).
- Keep a stack of indices whose answer is still unknown; their temperatures are decreasing.
- A new warmer day resolves every index on the stack with a lower temperature.
follow_ups:
- Can you do it in O(1) extra space?
- Relate this to the stock span problem.
tests:
