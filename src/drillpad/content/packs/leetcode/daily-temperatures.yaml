  code: |
    t=list(range(100000,0,-1))+[200000]
    r=wait_days(t)
    assert r[0]==100000 and r[-1]==0 and r[50000]==50000
complexity:
- op: overall
  time: O(n)
  space: O(n)
extensions:
- q: Why O(n) with a nested loop?
  kind: complexity
  key_points:
  - Each index is pushed once and popped once
  - Amortized O(1) per element
  - Stack worst-case size n for decreasing input
- q: O(1) extra space approach
  kind: design
  key_points:
  - Scan right to left using the answer array to jump ahead
  - Jump by answer[j] to the next candidate
  - Still amortized O(n)
- q: Stock span variant
  kind: reasoning
  key_points:
  - Same monotonic stack looking backward
  - Pop while previous price <= current
  - Span is index distance to the new top
narration: []
state_aloud:
- Empty input.
- Equal temperature does not count as warmer.
- Never-warmer days return 0.
- Strictly decreasing input leaves the whole stack full.
walkthrough: |
  Maintain a stack of indices whose temperatures are in decreasing order. For each day, while the stack's top has a lower temperature than today, pop it and set its answer to the index difference. Then push today's index. Indices remaining at the end get 0. Every index enters and leaves the stack once, so the algorithm is linear.
