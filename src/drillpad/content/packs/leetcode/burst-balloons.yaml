firm_tags: []
categories:
- leetcode
anki_queries:
- deck:"HFT LeetCode 150" "Front:Burst Balloons (LC 312)"
statement: |
  Balloons carry the numbers in `nums`. Bursting balloon `i` earns `left * nums[i] * right`, where `left` and `right` are its current neighbours (a missing neighbour counts as 1). After a burst, neighbours close up. Return the maximum total coins from bursting all balloons. An empty list gives 0.

  Example: `max_coins([3,1,5,8])` returns `167`.
starter: |
  def max_coins(nums):
      pass
hints:
- Thinking about which balloon bursts FIRST makes subproblems depend on each other. Think about which bursts LAST.
- 'State: best[l][r] = max coins for bursting everything strictly between l and r (padded array with 1s at both ends).'
- best[l][r] = max over k in (l, r) of best[l][k] + best[k][r] + a[l]*a[k]*a[r]. Fill by increasing gap.
follow_ups:
- Print the burst order.
- Can you beat O(n^3)?
