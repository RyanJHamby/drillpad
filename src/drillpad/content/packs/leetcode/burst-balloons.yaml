complexity:
- op: overall
  time: O(n^3)
  space: O(n^2)
extensions:
- q: Complexity
  kind: complexity
  key_points:
  - O(n^2) intervals each trying O(n) last-burst choices
  - O(n^2) table
  - Memoised recursion has the same bound
- q: Why last burst
  kind: design
  key_points:
  - If k bursts last in (l, r) its neighbours are fixed as l and r
  - Left and right sides become independent subproblems
  - Choosing the first burst entangles the two sides
- q: Recover the order
  kind: code
  key_points:
  - Store the optimal k for each interval
  - 'Recurse: burst left part, right part, then k'
  - Reverse of the choice order is the burst order
narration: []
state_aloud:
- Out-of-range neighbours count as 1.
- Empty list is 0 coins.
- Think of the last balloon to burst in an interval.
walkthrough: 'Pad `nums` with a 1 on each side. Let `best[l][r]` be the maximum coins from bursting every balloon strictly between positions `l` and `r`. Choose `k` as the last balloon burst in that interval: its neighbours at that moment are `l` and `r`, so `best[l][r] = max(best[l][k] + best[k][r] + a[l]*a[k]*a[r])`. Fill by increasing gap; time O(n^3), space O(n^2).'
