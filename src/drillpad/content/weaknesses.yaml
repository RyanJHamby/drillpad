# Seed weaknesses for drillpad. EVERY entry is "user to confirm": mined from Ryan's notes, not self-declared
# inside drillpad. Unconfirmed seeds do not affect scoring until `status: confirmed` (see coach/weakness.py).
#
# evidence:
#   recorded         - the notes explicitly record this as a past failure/gap
#   drill-prescribed - the notes prescribe a drill/fix for it, but do not record Ryan failing at it
#                      (weaker evidence; confirm or delete)
# severity: 1 (minor) .. 3 (major) is a first guess.
# Sources are the author's private drill notes.
seeds:
  # ---- problem: whole-problem execution ----
  - category: problem
    tag: slow-time-to-working
    severity: 3
    status: user-to-confirm
    evidence: recorded
    description: Not fast enough to a working solution in timed rounds (prior fintech loop failure attributed to this).
    source: author's drill notes
  - category: problem
    tag: timed-execution
    severity: 3
    status: user-to-confirm
    evidence: recorded
    description: Trading-firm cycle failure attributed to timed execution; strong design/systems knowledge did not survive slow coding rounds.
    source: author's drill notes
  - category: problem
    tag: practical-part1-over-20min
    severity: 2
    status: user-to-confirm
    evidence: drill-prescribed
    description: Practical multi-part (in-memory system) rounds; target is part 1 green in 20 min.
    source: author's drill notes

  # ---- algorithm: process/approach habits ----
  - category: algorithm
    tag: edge-cases
    severity: 2
    status: user-to-confirm
    evidence: drill-prescribed
    description: Edge-case misses (listed as a miss category to classify after each session; negative amounts, duplicates, ordering, idempotency for practical rounds).
    source: author's drill notes
  - category: algorithm
    tag: optimizing-before-correct
    severity: 2
    status: user-to-confirm
    evidence: drill-prescribed
    description: Polishing/optimizing before a working version exists; no typing before a plan.
    source: author's drill notes
  - category: algorithm
    tag: untested-before-done
    severity: 2
    status: user-to-confirm
    evidence: drill-prescribed
    description: Declaring done without hand-testing a small example; tests that cannot fail; ignoring failing tests.
    source: author's drill notes

