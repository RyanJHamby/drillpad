# Learning Path Configuration
# Defines stages, prerequisites, and role-specific paths for DrillPad curriculum
# Every module on disk must appear in exactly one stage (tests/test_paths.py enforces it).
# Add new modules with `python scripts/course.py new-module`, then run `python scripts/course.py docs`.

stages:
  - id: "0-thinking-tools"
    title: "Thinking Tools: Frameworks for Problem Solving"
    description: "First-principles reasoning, design methodology, cost modeling. Foundation for all domains."
    modules:
      - reasoning-under-constraints
      - systems-design-process
      - design-judgment-tradeoffs
      - benchmarking-methodology

  - id: "1-the-machine"
    title: "The Machine: Hardware, Concurrency, Data Structures"
    description: "CPU, memory, cache, threading, language runtime. Single-node foundations."
    modules:
      - os-fundamentals
      - concurrency-fundamentals
      - data-structures-production
      - network-fundamentals-advanced
      - network-protocols
      - profiling-bottleneck-finding
      - performance-engineering
      - cpp-essentials
      - modern-cpp-evolution
      - memory-optimization
      - lock-free-systems
      - python-ai-infra
      - go-systems
      - rust-systems

  - id: "2-single-node-services"
    title: "Single-Node Services: Databases, Caching, APIs"
    description: "Persistent storage, in-memory caching, API design, security. Local systems at scale."
    modules:
      - database-fundamentals
      - caching-strategies
      - api-design-fundamentals
      - message-queues
      - security-fundamentals
      - cost-modeling-ai-inference

  - id: "3-distributed-core"
    title: "Distributed Core: Consensus, Replication, Fault Tolerance"
    description: "Distributed systems fundamentals. Consensus, quorums, replication, reliability across failure."
    modules:
      - distributed-systems
      - consistency-models-fundamentals
      - consensus-algorithms
      - distributed-transactions
      - exactly-once-semantics
      - failure-modes-resilience
      - fault-tolerance
      - load-balancing
      - stream-processing-fundamentals

  - id: "4-operating-it"
    title: "Operating It: Observability, Testing, Deployment"
    description: "Production operations. Monitoring, testing distributed systems, incident response, infrastructure."
    modules:
      - observability-debugging
      - testing-observability-fundamentals
      - testing-distributed-systems
      - deployment-and-incidents
      - failure-diagnosis-methodology

  - id: "5-design-synthesis"
    title: "Design Synthesis: System Design Case Studies"
    description: "Applying all fundamentals. Real-world architecture patterns, tradeoffs, at scale."
    modules:
      - system-design-case-studies
      - system-design-case-studies-expanded
      - infra-primitives-case-studies
      - aws-services-for-design
      - design-communication-under-pressure

  - id: "6-ai-infrastructure"
    title: "AI Infrastructure: Models, Serving, Pipelines"
    description: "ML systems end-to-end. Training, inference, data pipelines, evaluation, platforms."
    modules:
      - ml-training-fundamentals
      - gpu-fundamentals
      - llm-inference-systems
      - distributed-inference
      - ai-platform-orchestration
      - ml-evaluation-metrics
      - data-pipeline-architecture
      - data-quality-validation
      - feature-stores
      - ai-skills-senior-swe

  - id: "7-low-latency-trading"
    title: "Low-Latency & Trading Systems: Specialized Domains"
    description: "High-frequency trading systems, matching engines, market data. Microsecond precision."
    modules:
      - trading-and-market-data
      - latency-systems

  - id: "8-staff-founder"
    title: "Staff & Founder: Leadership & Business"
    description: "Senior leadership, organizational skills, founding skills. Career and company building."
    modules:
      - staff-engineering
      - founder-fundamentals
      - founder-engineering

  - id: "9-always-on"
    title: "Always On: Interview Mechanics & AI-Augmented Work"
    description: "Not a final stage: use alongside every other stage. Interview execution, timed mocks, and working with AI tooling."
    modules:
      - interview-execution-playbook
      - mock-interview-scenarios
      - ai-augmented-engineering

# Prerequisite edges: module -> list of required modules
