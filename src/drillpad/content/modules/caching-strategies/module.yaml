id: caching-strategies
title: "Caching Strategies: LRU, LFU & ARC Eviction"
language: systems
description: "Cache eviction policies: LRU (temporal locality, simple), LFU (skewed workloads, cold item problem), ARC (adaptive, combines both). Real systems: Redis/Memcached (LRU), Netflix CDN (LFU), Java ConcurrentHashMap (W-TinyLFU)."
