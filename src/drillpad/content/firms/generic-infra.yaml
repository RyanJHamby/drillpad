what_earns_points:
- part 1 green fast, then extend without rewriting
- one resolver/helper everything goes through
- explicit Enum/dataclass states
- injected clock for anything time-based
- asserts written unprompted after each part
- edge cases named before the interviewer asks
- 60-second answer for thread-safety, persistence, scale follow-ups
what_loses_points:
- 10 minutes of class design before any output
- guessing return formats instead of asking
- bare-string states
- time.time() hard-wired so tests are not deterministic
red_flags:
- building the wrong return format for 10 minutes without asking
