what_earns_points:
- traces a real example by hand before declaring done
- runs the code before submitting
- names complexity unprompted
- writes a test unprompted right after the core logic works
- states edge cases (empty, single, duplicates, overflow)
- engages with hints instead of getting defensive
what_loses_points:
- off-by-one and loop bound slips
- integer overflow ignored
- format-string / type slips that only show at runtime
- silent pauses over 20-30 seconds
- blowing the whole round on one phase
- brute force with no stated complexity
red_flags:
- submitting code without running or tracing it
- getting defensive when the interviewer hints
- running out of time with no working solution and no summary
- no clarifying questions at all
