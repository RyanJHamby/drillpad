[project]
name = "drillpad"
version = "0.1.0"
description = "Local-first learning and interview-practice environment for systems, infrastructure, and AI-infrastructure engineers: lessons, a code runner with hidden tests, spaced repetition, and learning tracks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-CONTENT.md"]
authors = [{ name = "Ryan Hamby" }]
keywords = ["interview-preparation", "system-design", "distributed-systems", "concurrency", "spaced-repetition", "fsrs", "local-first", "study-tool", "llm-inference", "low-latency"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6",
  "httpx>=0.27",
  "fsrs>=6.3.2",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "keyring>=25"]
voice = []
sync = ["boto3>=1.34"]

[project.urls]
Homepage = "https://github.com/RyanJHamby/drillpad"
Repository = "https://github.com/RyanJHamby/drillpad"
Issues = "https://github.com/RyanJHamby/drillpad/issues"
Changelog = "https://github.com/RyanJHamby/drillpad/blob/main/CHANGELOG.md"

[project.scripts]
drillpad = "drillpad.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pip-audit>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drillpad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
