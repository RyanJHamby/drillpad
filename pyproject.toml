[project]
name = "drillpad"
version = "0.0.1"
description = "Local-first coding-interview practice: editor, runner, Anki-driven quizzing, AI mock interviewer."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6",
  "httpx>=0.27",
  "fsrs>=6.3.2",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "keyring>=25"]
voice = []
sync = ["boto3>=1.34"]

[project.scripts]
drillpad = "drillpad.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pip-audit>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drillpad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
